name: BiggiePockets Code Review (reusable)

# Reusable two-stage AI review (Codex first pass, then Claude verifies and
# synthesizes) anchored on the PR's JIRA ticket, with the BiggiePockets service
# account submitting the resulting approve / request-changes decision.
#
# Callers own the triggers and gating (e.g. fire on review_requested when
# BiggiePockets is the requested reviewer) and pass the PR number as `pr`.
# Secrets are supplied by the caller via `secrets: inherit`:
#   OPENROUTER_API_KEY, CLAUDE_CODE_OAUTH_TOKEN, JIRA_EMAIL, JIRA_API_TOKEN,
#   BIGGIEPOCKETS_PAT, DATADOG_API_KEY (optional; enables review-quality
#   metrics in Datadog LLM Obs).
#
# Prompt versioning: every review-stage prompt lives in this repo's prompts/
# registry (BiggerPockets/.github) as a versioned template, plus one shared rule
# block per concern under prompts/_shared/ injected via {{@path}}.
# Prompts are resolved by scripts/resolve-prompts.sh into step outputs; a derived
# prompt_version (content hash) identifies each prompt in Datadog LLM Obs.
#
# Dual-arm summary experiment (BIG-21717): when the PR carries the opt-in label
# DUAL_ARM_LABEL, the review runs an independent Claude pass for each EXPERIMENT arm
# named in prompts/registry.json (the `thesis-first` arm today) in addition to the
# GATE arm, all over the same Codex findings. The two summaries are posted together in
# a single review comment, in a deterministic-but-randomized order (A/B labels swapped
# per PR number) so neither position is favored and the arms are not disclosed to
# reviewers. The GATE verdict — the official approve / request-changes review — ALWAYS
# comes from prompts/registry.json `gate_arm`; the experiment only changes
# presentation, never the decision. PRs without the label get the single gate-arm
# review (one summary, no A/B), which is byte-for-byte the pre-experiment behavior.
on:
  workflow_call:
    inputs:
      pr:
        description: 'PR number to review'
        required: true
        type: string
      registry_ref:
        description: >-
          Ref of BiggerPockets/.github to resolve review prompts/resolver from. Set it to
          the ref this workflow was called at (the value after `@` in
          `uses: BiggerPockets/.github/.github/workflows/...@<ref>`) so a caller pinned to
          a tag or SHA runs the exact prompt/resolver text that shipped with that workflow.
          Defaults to `main`, which is correct for callers that track `@main`; a caller that
          pins `uses:` MUST pass this explicitly or its prompts will silently drift to main.
        required: false
        default: main
        type: string

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write # claude-code-action authenticates via OIDC
    env:
      PR: ${{ inputs.pr }}
      # Apply this label to a PR to opt into the dual-arm (control + thesis-first)
      # summary experiment. Its absence keeps the single control-arm review.
      DUAL_ARM_LABEL: biggiepockets-dual-arm
      # Explicit model per stage, threaded into both the actual invocation below and the
      # Datadog LLM Obs tags/spans at the bottom of this job. Empty means "let the tool
      # use its own default" (today's behavior, unchanged). Set these once you want a
      # specific model pinned and reliably visible in telemetry — e.g. when Codex is
      # pointed at a non-default model — instead of an implicit, untracked default.
      # The Codex stage runs through OpenRouter, so its model must be an OpenRouter
      # model slug and must be set explicitly — Codex's own default model name is not
      # one OpenRouter accepts.
      CODEX_MODEL: "openai/gpt-5.1-codex"
      CODEX_RESPONSES_ENDPOINT: "https://openrouter.ai/api/v1/responses"
      CLAUDE_MODEL: ""
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          fetch-depth: 0

      # Prompt templates live in BiggerPockets/.github. Check out that repo at the ref the
      # caller passed via the registry_ref input, which defaults to main so a caller that
      # tracks @main works without setting it; a caller pinning a tag or SHA passes the
      # matching ref to run the prompt text that shipped with that workflow. Resolve the
      # ref from this input only — never from github.workflow_sha, which points at a commit
      # in the CALLER's repo and so is not a valid ref here.
      # GITHUB_TOKEN is scoped to the caller's repo, so use the BiggiePockets PAT.
      # persist-credentials is off so the PAT is never left in registry/.git/config where
      # the later Codex/Claude steps (which act on untrusted PR diffs and can read files/run
      # Bash) could read it — read-only prompts only need the checkout itself, not the
      # stored credentials.
      - name: Checkout prompt registry
        uses: actions/checkout@v4
        with:
          repository: BiggerPockets/.github
          ref: ${{ inputs.registry_ref }}
          token: ${{ secrets.BIGGIEPOCKETS_PAT }}
          persist-credentials: false
          path: registry

      - name: Record review start time
        run: echo "REVIEW_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      # Resolve PR context (base ref and title) from the API.
      - name: Resolve PR context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName -q .baseRefName)
          title=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title -q .title)
          echo "BASE_REF=$base" >> "$GITHUB_ENV"
          echo "PR_TITLE=$title" >> "$GITHUB_ENV"
          echo "Reviewing PR #$PR (base $base): $title"

      # The dual-arm experiment is opt-in per PR: label DUAL_ARM_LABEL to run the
      # control + thesis-first comparison; its absence keeps the single control-arm
      # review. Also the natural gradual-rollout switch — no code change needed to
      # enable/disable per PR.
      - name: Check dual-arm opt-in label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels -q '.labels[].name' 2>/dev/null || true)
          if printf '%s\n' "$labels" | grep -qx "$DUAL_ARM_LABEL"; then
            echo "DUAL_ARMS=true" >> "$GITHUB_ENV"
            echo "Opted into dual-arm review via label '$DUAL_ARM_LABEL'."
          else
            echo "DUAL_ARMS=false" >> "$GITHUB_ENV"
            echo "Not opted into dual-arm review (label '$DUAL_ARM_LABEL' absent); running the single control-arm review."
          fi

      - name: Compute PR diff
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git diff "origin/$BASE_REF...HEAD" > pr.diff
          echo "PR diff is $(wc -l < pr.diff) lines"

      # Anchor the review on the work's intent. Always writes ticket.json: either the
      # ticket fields, or {"available": false} so a missing/unfetchable ticket degrades
      # to a diff-based review instead of failing the gate.
      - name: Fetch JIRA ticket for intent
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          key=$(printf '%s' "$PR_TITLE" | grep -oE 'BIG-[0-9]+' | head -1 || true)
          if [ -z "$key" ]; then
            echo '{"available": false, "reason": "no BIG-XXXXX key in PR title"}' > ticket.json
            echo "No JIRA ticket key in PR title; falling back to diff-based review."
            exit 0
          fi

          http=$(curl -sS -w '%{http_code}' -o ticket-raw.json \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -H 'Accept: application/json' \
            "https://biggerpockets.atlassian.net/rest/api/3/issue/$key?fields=summary,description,customfield_11557") \
            || http="000"

          if [ "$http" = "200" ]; then
            jq --arg key "$key" '{available: true, key: $key, summary: .fields.summary, description: .fields.description, acceptance_criteria: .fields.customfield_11557}' \
              ticket-raw.json > ticket.json
            echo "Wrote ticket.json for $key"
          else
            echo "{\"available\": false, \"reason\": \"fetch failed (HTTP $http) for $key\"}" > ticket.json
            echo "Could not fetch $key (HTTP $http); falling back to diff-based review."
          fi

      # Gather the existing PR discussion so the review accounts for context that lives
      # in conversation rather than the diff: general comments, inline review threads, and
      # prior review bodies. Always writes conversations.json (empty arrays if none).
      - name: Fetch PR conversations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          comments=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -q '[.[] | {author: .user.login, created_at, body}]' | jq -s 'add // []')
          review_comments=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" \
            -q '[.[] | {author: .user.login, path, line, created_at, body}]' | jq -s 'add // []')
          reviews=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            -q '[.[] | select(.body != "") | {author: .user.login, state, submitted_at, body}]' | jq -s 'add // []')

          jq -n \
            --argjson comments "$comments" \
            --argjson review_comments "$review_comments" \
            --argjson reviews "$reviews" \
            '{issue_comments: $comments, review_comments: $review_comments, reviews: $reviews}' \
            > conversations.json
          echo "Wrote conversations.json ($(jq '.issue_comments | length' conversations.json) comments, $(jq '.review_comments | length' conversations.json) review comments, $(jq '.reviews | length' conversations.json) reviews)"

      # Resolve every review-stage prompt from the registry: the Codex prompt plus one
      # prompt per arm in prompts/registry.json, each with its shared-rule blocks expanded
      # and a content-derived prompt_version. The gate arm name (control) is also emitted.
      - name: Resolve review prompts
        id: resolve
        env:
          REGISTRY_DIR: registry
        run: registry/scripts/resolve-prompts.sh

      # Stage 1: Codex reviews the diff against the ticket intent and writes findings to
      # codex-findings.md (the `output-file`, which captures Codex's final message).
      #
      # Codex reviews the diff directly here rather than shelling out to the `codex review`
      # subcommand. `codex review` starts its own in-process app-server that needs both a
      # writable runtime home AND a localhost connection to the action's Responses API proxy.
      # When it was launched as a child of `codex exec`, that child inherited the exec sandbox,
      # which grants neither by default: under `sandbox: read-only` it died writing runtime
      # state ("failed to initialize in-process app-server client: Read-only file system
      # (os error 30)"), and under a writable profile it then died reaching the proxy
      # ("stream disconnected before completion: error sending request for url
      # http://127.0.0.1.../v1/responses"), because that profile grants filesystem writes but
      # no network. Either way Codex produced no findings and every review silently degraded to
      # a Claude-only pass. Reviewing inline via this step's own `codex exec` model call avoids
      # the nested subprocess entirely: it needs only to read files, so a read-only sandbox is
      # sufficient and there is no child process to sandbox.
      #
      # continue-on-error keeps a Codex failure (e.g. an OpenAI "Quota exceeded" error) from
      # blocking the review: Stage 2 proceeds on its own when codex-findings.md is missing or
      # empty. The next step still surfaces the failure as a warning so a genuinely broken Codex
      # (e.g. a bad key) doesn't silently disappear.
      - name: Record codex start time
        run: echo "CODEX_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      - name: Codex first-pass review
        id: codex
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          responses-api-endpoint: ${{ env.CODEX_RESPONSES_ENDPOINT }}
          model: ${{ env.CODEX_MODEL }}
          sandbox: read-only
          output-file: codex-findings.md
          prompt: ${{ steps.resolve.outputs.codex_prompt }}

      # If Codex failed (it exits nonzero and writes no codex-findings.md — e.g. on a quota
      # error), leave an empty findings file so Stage 2 cleanly takes its no-findings path,
      # and record a warning for observability.
      - name: Note skipped Codex first pass
        if: steps.codex.outcome == 'failure'
        run: |
          echo "::warning::Codex first-pass review failed (commonly an OpenAI quota error); continuing with a Claude-only review."
          : > codex-findings.md

      # Stage 2: Claude verifies Codex's findings, reviews independently, and decides.
      # The GATE arm (prompts/registry.json gate_arm) runs on every review and supplies
      # the official verdict. PRs opted into the dual-arm experiment (DUAL_ARM_LABEL)
      # also run each experiment arm (arms other than the gate arm) over the same Codex
      # findings, so the summary formats can be compared side by side.
      - name: Record codex end / claude gate start time
        run: |
          echo "CODEX_END_NS=$(date +%s%N)" >> "$GITHUB_ENV"
          echo "GATE_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      - name: Claude verify and synthesize (gate arm)
        id: claude_gate
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Allow the `claude` bot to trigger this review. Without this, PRs opened
          # by the claude bot are rejected with "Workflow initiated by non-human
          # actor: claude (type: Bot). Add bot to allowed_bots list."
          allowed_bots: 'claude'
          claude_args: ${{ env.CLAUDE_MODEL != '' && format('--allowedTools "Read,Grep,Glob,Bash,Write" --model {0}', env.CLAUDE_MODEL) || '--allowedTools "Read,Grep,Glob,Bash,Write"' }}
          prompt: ${{ steps.resolve.outputs.gate_prompt }}

      # The experiment run writes verdict.json back to the same path the gate run used,
      # so preserve the gate arm's verdict first.
      - name: Preserve gate verdict
        if: always()
        run: cp verdict.json verdict-gate.json 2>/dev/null || true

      # Experiment arms only run when the PR opted in via DUAL_ARM_LABEL AND the
      # registry declares at least one arm other than the gate arm. continue-on-error
      # keeps an experiment failure (e.g. a quota error) from failing the job and
      # skipping the gate submission; Datadog records the span as errored.
      - name: Record claude gate end / experiment start time
        run: |
          echo "GATE_END_NS=$(date +%s%N)" >> "$GITHUB_ENV"
          echo "EXPERIMENT_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"
          # The experiment run writes verdict.json back to the same path the gate run
          # used; remove the gate arm's output so a failed experiment run can't leave a
          # stale verdict.json that the preserve step would copy as the experiment arm's.
          rm -f verdict.json

      - name: Claude verify and synthesize (experiment arm)
        if: ${{ env.DUAL_ARMS == 'true' && steps.resolve.outputs.experiment_prompt != '' }}
        id: claude_experiment
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude'
          claude_args: ${{ env.CLAUDE_MODEL != '' && format('--allowedTools "Read,Grep,Glob,Bash,Write" --model {0}', env.CLAUDE_MODEL) || '--allowedTools "Read,Grep,Glob,Bash,Write"' }}
          prompt: ${{ steps.resolve.outputs.experiment_prompt }}

      - name: Preserve experiment verdict
        if: ${{ always() && env.DUAL_ARMS == 'true' && steps.resolve.outputs.experiment_prompt != '' }}
        run: cp verdict.json verdict-experiment.json 2>/dev/null || true

      - name: Record claude experiment end time
        if: ${{ always() && env.DUAL_ARMS == 'true' && steps.resolve.outputs.experiment_prompt != '' }}
        run: echo "EXPERIMENT_END_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      # Submit the review. The GATE arm's verdict is the official approve /
      # request-changes decision, always. Opted-in PRs whose experiment arm produced a
      # summary get one comment with BOTH summaries (gate + experiment) labeled Variant
      # A / Variant B; the label order is randomized per PR (deterministic hash of the
      # PR number) so position bias is balanced across PRs and the same PR keeps the
      # same labels across re-reviews, and the arms are not disclosed in the comment.
      - name: Submit review as BiggiePockets
        id: submit
        env:
          # PAT authenticating as the BiggiePockets service account. A bot cannot
          # approve its own PR, so this never gates BiggiePockets-authored PRs.
          GH_TOKEN: ${{ secrets.BIGGIEPOCKETS_PAT }}
          GATE_ARM: ${{ steps.resolve.outputs.gate_arm }}
          EXPERIMENT_ARM: ${{ steps.resolve.outputs.experiment_arm_key }}
        run: |
          if [ ! -f verdict-gate.json ]; then
            echo "::error::Gate arm review run did not produce verdict.json" >&2
            exit 1
          fi

          gate_verdict=$(jq -r '.verdict' verdict-gate.json)
          gate_summary=$(jq -r '.summary' verdict-gate.json)

          experiment_summary=""
          if [ -f verdict-experiment.json ]; then
            experiment_summary=$(jq -r '.summary // ""' verdict-experiment.json 2>/dev/null) || experiment_summary=""
          fi

          if [ "$DUAL_ARMS" = "true" ] && [ -n "$experiment_summary" ] && [ -n "$EXPERIMENT_ARM" ]; then
            parity=$(( $(printf '%s' "$PR" | cksum | awk '{print $2}') % 2 ))
            if [ "$parity" -eq 0 ]; then
              first_name="Variant A"; first_summary="$gate_summary"
              second_name="Variant B"; second_summary="$experiment_summary"
              label_assignment="A=$GATE_ARM|B=$EXPERIMENT_ARM"
            else
              first_name="Variant A"; first_summary="$experiment_summary"
              second_name="Variant B"; second_summary="$gate_summary"
              label_assignment="A=$EXPERIMENT_ARM|B=$GATE_ARM"
            fi

            {
              echo "BiggiePockets assisted review — the same review in two summary formats."
              echo ""
              printf '## %s\n\n%s\n' "$first_name" "$first_summary"
              printf '\n---\n\n## %s\n\n%s\n' "$second_name" "$second_summary"
            } > review-body.md
          else
            # Single-arm mode, or the experiment arm failed and produced no summary —
            # fall back to the gate-only body rather than posting an empty Variant.
            label_assignment="n/a"
            printf '## BiggiePockets assisted review\n\n%s\n' "$gate_summary" > review-body.md
          fi

          case "$gate_verdict" in
            approve)
              gh pr review "$PR" --approve --body-file review-body.md
              ;;
            request_changes)
              gh pr review "$PR" --request-changes --body-file review-body.md
              ;;
            *)
              echo "::error::Unexpected gate verdict from $GATE_ARM review: '$gate_verdict'" >&2
              exit 1
              ;;
          esac

          echo "GATE_VERDICT=$gate_verdict" >> "$GITHUB_ENV"
          echo "LABEL_ASSIGN=$label_assignment" >> "$GITHUB_ENV"
          if [ "$DUAL_ARMS" = "true" ] && [ -n "$EXPERIMENT_ARM" ]; then
            if [ -n "$experiment_summary" ]; then
              experiment_verdict=$(jq -r '.verdict // "unknown"' verdict-experiment.json 2>/dev/null) || experiment_verdict="unknown"
              agreement="agree"; [ "$gate_verdict" != "$experiment_verdict" ] && agreement="disagree"
              echo "EXPERIMENT_VERDICT=$experiment_verdict" >> "$GITHUB_ENV"
              echo "ARM_AGREEMENT=$agreement" >> "$GITHUB_ENV"
            else
              echo "EXPERIMENT_VERDICT=failed" >> "$GITHUB_ENV"
              echo "ARM_AGREEMENT=gate-only" >> "$GITHUB_ENV"
            fi
          else
            echo "EXPERIMENT_VERDICT=n/a" >> "$GITHUB_ENV"
            echo "ARM_AGREEMENT=single" >> "$GITHUB_ENV"
          fi

      # Reports ONE LLM OBS TRACE PER ARM, joined by a stable run_id (repo + pr +
      # review attempt) so offline evals and panel ratings line up per review.
      # Never blocks/fails/delays the review itself.
      #
      # Each arm is submitted as its OWN REQUEST, and that separation is what makes the
      # arm tags trustworthy. A tag key resolves to a single value per submitted payload
      # — NOT per trace, which was measured the hard way: when both arms shared one
      # request, every span reported the experiment's arm and prompt even after the arms
      # were split into two distinct trace_ids. So the gate arm's review was credited to
      # the variant prompt, and only ever on the dual-arm runs the experiment exists to
      # measure. One payload per arm means each request carries exactly one value for
      # `arm`/`prompt_name`/`prompt_version`, so they can be grouped and aggregated on.
      # Do not merge the two submissions back into one request.
      #
      #   gate trace       root biggiepockets.review -> codex.review, claude.synthesize.gate
      #   experiment trace root biggiepockets.review -> claude.synthesize.experiment
      #
      # Codex runs once and feeds both arms, so it lives in the gate trace (the
      # production pipeline) rather than being duplicated, which would double-count its
      # latency and tokens. Its findings are still the recorded input of BOTH arms'
      # spans. Compare arms at the claude.synthesize.* spans, which are like-for-like;
      # the gate trace's root also spans codex, so root durations are not comparable.
      - name: Report review metrics to Datadog LLM Obs
        if: always()
        continue-on-error: true
        env:
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
        run: |
          if [ -z "$DD_API_KEY" ]; then
            echo "Skipping Datadog LLM Obs submission: DATADOG_API_KEY not configured"
            exit 0
          fi

          now_ns=$(date +%s%N)
          review_start_ns="${REVIEW_START_NS:-$now_ns}"
          codex_start_ns="${CODEX_START_NS:-$review_start_ns}"
          codex_end_ns="${CODEX_END_NS:-$codex_start_ns}"
          gate_start_ns="${GATE_START_NS:-$codex_end_ns}"
          gate_end_ns="${GATE_END_NS:-$gate_start_ns}"
          experiment_start_ns="${EXPERIMENT_START_NS:-$gate_end_ns}"
          experiment_end_ns="${EXPERIMENT_END_NS:-$experiment_start_ns}"

          gate_verdict="${GATE_VERDICT:-unknown}"
          label_assignment="${LABEL_ASSIGN:-unknown}"
          arm_agreement="${ARM_AGREEMENT:-unknown}"
          dual_arms="false"
          [ "$DUAL_ARMS" = "true" ] && dual_arms="true"

          codex_prompt_name="${{ steps.resolve.outputs.codex_prompt_name }}"
          codex_prompt_version="${{ steps.resolve.outputs.codex_prompt_version }}"
          gate_prompt_name="${{ steps.resolve.outputs.gate_prompt_name }}"
          gate_prompt_version="${{ steps.resolve.outputs.gate_prompt_version }}"
          gate_arm="${{ steps.resolve.outputs.gate_arm }}"
          experiment_prompt_name="${{ steps.resolve.outputs.experiment_prompt_name }}"
          experiment_prompt_version="${{ steps.resolve.outputs.experiment_prompt_version }}"
          experiment_arm="${{ steps.resolve.outputs.experiment_arm_key }}"
          if [ "$dual_arms" != "true" ] || [ -z "$experiment_arm" ]; then
            experiment_prompt_name="n/a"
            experiment_prompt_version="n/a"
          fi

          codex_status="ok"
          [ "${{ steps.codex.outcome }}" = "failure" ] && codex_status="error"
          codex_findings=$(cat codex-findings.md 2>/dev/null || true)
          codex_findings_lines=$(wc -l < codex-findings.md 2>/dev/null || echo 0)

          gate_status="ok"
          [ "${{ steps.claude_gate.outcome }}" != "success" ] && gate_status="error"
          experiment_status="n/a"
          if [ "$dual_arms" = "true" ] && [ -n "$experiment_arm" ]; then
            experiment_status="ok"
            [ "${{ steps.claude_experiment.outcome }}" != "success" ] && experiment_status="error"
          fi

          root_status="ok"
          [ "${{ steps.submit.outcome }}" != "success" ] && root_status="error"

          gate_summary=""
          [ -f verdict-gate.json ] && gate_summary=$(jq -r '.summary // ""' verdict-gate.json 2>/dev/null) || gate_summary=""
          experiment_summary=""
          if [ -f verdict-experiment.json ]; then
            experiment_summary=$(jq -r '.summary // ""' verdict-experiment.json 2>/dev/null) || experiment_summary=""
          fi

          # Cap free-text fields sent to Datadog so one outsized findings report can't
          # blow past the LLM Obs payload limit; the untruncated text is always still in
          # this step's own job logs.
          truncate() {
            local text="$1" max=4000
            if [ "${#text}" -gt "$max" ]; then
              printf '%s… [truncated %d chars]' "${text:0:$max}" "$((${#text} - max))"
            else
              printf '%s' "$text"
            fi
          }
          codex_findings_excerpt=$(truncate "$codex_findings")
          gate_summary_excerpt=$(truncate "$gate_summary")
          experiment_summary_excerpt=$(truncate "$experiment_summary")

          codex_model_tag="${CODEX_MODEL:-unspecified}"
          claude_model_tag="${CLAUDE_MODEL:-unspecified}"

          run_id="$GITHUB_REPOSITORY-pr$PR-${{ github.run_id }}"

          # One trace per arm. Datadog resolves a tag key at trace scope, so an arm's
          # identity can only live on a uniform `arm`/`prompt_name`/`prompt_version` key
          # if that trace contains exactly one arm — which is what makes grouping and
          # eval aggregation by arm possible. Sharing a trace collapses the two arms onto
          # whichever span was submitted last.
          trace_id=$(openssl rand -hex 16)
          root_span_id=$(openssl rand -hex 8)
          experiment_trace_id=$(openssl rand -hex 16)
          experiment_root_span_id=$(openssl rand -hex 8)
          codex_span_id=$(openssl rand -hex 8)
          gate_span_id=$(openssl rand -hex 8)
          experiment_span_id=$(openssl rand -hex 8)

          # Submit ONE PAYLOAD PER ARM. The uniform arm/prompt_name/prompt_version keys
          # live at payload level, so each request carries exactly one value for them.
          submit_arm() {
            arm_name="$1"; arm_prompt_name="$2"; arm_prompt_version="$3"
            arm_trace_id="$4"; arm_spans="$5"

            payload=$(jq -n \
              --arg ml_app "biggiepockets-review" \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg pr "$PR" \
              --arg run_id "$run_id" \
              --arg verdict "$gate_verdict" \
              --arg label_assignment "$label_assignment" \
              --arg arm_agreement "$arm_agreement" \
              --arg arm "$arm_name" \
              --arg prompt_name "$arm_prompt_name" \
              --arg prompt_version "$arm_prompt_version" \
              --arg gate_arm "$gate_arm" \
              --arg experiment_arm "$experiment_arm" \
              --arg codex_model "$codex_model_tag" \
              --arg claude_model "$claude_model_tag" \
              --arg codex_prompt_name "$codex_prompt_name" \
              --arg codex_prompt_version "$codex_prompt_version" \
              --argjson codex_findings_lines "$codex_findings_lines" \
              --argjson dual_arms "$dual_arms" \
              --argjson spans "$arm_spans" \
              '{
                data: {
                  type: "span",
                  attributes: {
                    ml_app: $ml_app,
                    tags: [
                      "repo:\($repo)",
                      "pr:\($pr)",
                      "run_id:\($run_id)",
                      "arm:\($arm)",
                      "prompt_name:\($prompt_name)",
                      "prompt_version:\($prompt_version)",
                      "verdict:\($verdict)",
                      "label_assignment:\($label_assignment)",
                      "arm_agreement:\($arm_agreement)",
                      "gate_arm:\($gate_arm)",
                      "experiment_arm:\($experiment_arm)",
                      "codex_model:\($codex_model)",
                      "claude_model:\($claude_model)",
                      "codex_findings_lines:\($codex_findings_lines)",
                      "codex_prompt_name:\($codex_prompt_name)",
                      "codex_prompt_version:\($codex_prompt_version)",
                      "dual_arms:\($dual_arms)"
                    ],
                    spans: $spans
                  }
                }
              }')

            http_code=$(curl -sS -o /tmp/dd_response.json -w '%{http_code}' \
              -X POST "https://api.datadoghq.com/api/intake/llm-obs/v1/trace/spans" \
              -H "Content-Type: application/json" \
              -H "DD-API-KEY: $DD_API_KEY" \
              -d "$payload") || http_code="000"

            if [ "$http_code" -ge 300 ] 2>/dev/null || [ "$http_code" = "000" ]; then
              echo "::warning::Datadog LLM Obs submission failed for arm ${arm_name} (HTTP $http_code): $(cat /tmp/dd_response.json 2>/dev/null)"
            else
              echo "Reported ${arm_name} arm to Datadog LLM Obs (trace ${arm_trace_id}, prompt ${arm_prompt_name}@${arm_prompt_version}, run_id ${run_id})"
            fi
          }

          # Gate arm trace: the production review (codex first pass -> gate verdict).
          gate_spans=$(jq -n \
            --arg trace_id "$trace_id" \
            --arg root_span_id "$root_span_id" \
            --arg codex_span_id "$codex_span_id" \
            --arg gate_span_id "$gate_span_id" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg pr "$PR" \
            --arg base_ref "${BASE_REF:-unknown}" \
            --arg codex_model "$codex_model_tag" \
            --arg claude_model "$claude_model_tag" \
            --argjson review_start_ns "$review_start_ns" \
            --argjson root_duration "$((now_ns - review_start_ns))" \
            --argjson codex_start_ns "$codex_start_ns" \
            --argjson codex_duration "$((codex_end_ns - codex_start_ns))" \
            --argjson gate_start_ns "$gate_start_ns" \
            --argjson gate_duration "$((gate_end_ns - gate_start_ns))" \
            --arg codex_status "$codex_status" \
            --arg gate_status "$gate_status" \
            --arg root_status "$root_status" \
            --arg codex_findings_excerpt "$codex_findings_excerpt" \
            --arg gate_summary_excerpt "$gate_summary_excerpt" \
            '[
              {
                parent_id: "undefined",
                trace_id: $trace_id,
                span_id: $root_span_id,
                name: "biggiepockets.review",
                start_ns: $review_start_ns,
                duration: $root_duration,
                status: $root_status,
                meta: {
                  kind: "workflow",
                  input: {value: "repo:\($repo) pr:\($pr) base_ref:\($base_ref)"},
                  output: {value: $gate_summary_excerpt}
                }
              },
              {
                parent_id: $root_span_id,
                trace_id: $trace_id,
                span_id: $codex_span_id,
                name: "codex.review",
                start_ns: $codex_start_ns,
                duration: $codex_duration,
                status: $codex_status,
                meta: {
                  kind: "llm",
                  model_name: $codex_model,
                  model_provider: "openrouter",
                  input: {messages: [{role: "user", content: "Review pr:\($pr) against ticket.json/pr.diff"}]},
                  output: {messages: [{role: "assistant", content: $codex_findings_excerpt}]}
                }
              },
              {
                parent_id: $root_span_id,
                trace_id: $trace_id,
                span_id: $gate_span_id,
                name: "claude.synthesize.gate",
                start_ns: $gate_start_ns,
                duration: $gate_duration,
                status: $gate_status,
                meta: {
                  kind: "llm",
                  model_name: $claude_model,
                  model_provider: "anthropic",
                  input: {messages: [{role: "user", content: $codex_findings_excerpt}]},
                  output: {messages: [{role: "assistant", content: $gate_summary_excerpt}]}
                }
              }
            ]')

          submit_arm "$gate_arm" "$gate_prompt_name" "$gate_prompt_version" "$trace_id" "$gate_spans"

          # Experiment arm trace: the same codex findings summarized under the variant
          # prompt. Separate request, so its arm tags cannot overwrite the gate arm's.
          if [ "$dual_arms" = "true" ] && [ -n "$experiment_arm" ]; then
            experiment_spans=$(jq -n \
              --arg trace_id "$experiment_trace_id" \
              --arg root_span_id "$experiment_root_span_id" \
              --arg experiment_span_id "$experiment_span_id" \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg pr "$PR" \
              --arg base_ref "${BASE_REF:-unknown}" \
              --arg claude_model "$claude_model_tag" \
              --argjson experiment_start_ns "$experiment_start_ns" \
              --argjson experiment_duration "$((experiment_end_ns - experiment_start_ns))" \
              --arg experiment_status "$experiment_status" \
              --arg codex_findings_excerpt "$codex_findings_excerpt" \
              --arg experiment_summary_excerpt "$experiment_summary_excerpt" \
              '[
                {
                  parent_id: "undefined",
                  trace_id: $trace_id,
                  span_id: $root_span_id,
                  name: "biggiepockets.review",
                  start_ns: $experiment_start_ns,
                  duration: $experiment_duration,
                  status: $experiment_status,
                  meta: {
                    kind: "workflow",
                    input: {value: "repo:\($repo) pr:\($pr) base_ref:\($base_ref)"},
                    output: {value: $experiment_summary_excerpt}
                  }
                },
                {
                  parent_id: $root_span_id,
                  trace_id: $trace_id,
                  span_id: $experiment_span_id,
                  name: "claude.synthesize.experiment",
                  start_ns: $experiment_start_ns,
                  duration: $experiment_duration,
                  status: $experiment_status,
                  meta: {
                    kind: "llm",
                    model_name: $claude_model,
                    model_provider: "anthropic",
                    input: {messages: [{role: "user", content: $codex_findings_excerpt}]},
                    output: {messages: [{role: "assistant", content: $experiment_summary_excerpt}]}
                  }
                }
              ]')

            submit_arm "$experiment_arm" "$experiment_prompt_name" "$experiment_prompt_version" "$experiment_trace_id" "$experiment_spans"
          fi
          fi