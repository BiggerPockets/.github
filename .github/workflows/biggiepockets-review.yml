name: BiggiePockets Code Review (reusable)

# Reusable two-stage AI review (a first pass, then a second that verifies and
# synthesizes) anchored on the PR's JIRA ticket, with the BiggiePockets service
# account submitting the resulting approve / request-changes decision. Both stages
# run on pi against models pinned in scripts/pi/models.json.
#
# Callers own the triggers and gating (e.g. fire on review_requested when
# BiggiePockets is the requested reviewer) and pass the PR number as `pr`.
# Secrets are supplied by the caller via `secrets: inherit`:
#   OPENROUTER_API_KEY, JIRA_EMAIL, JIRA_API_TOKEN,
#   BIGGIEPOCKETS_PAT, DATADOG_API_KEY (optional; enables review-quality
#   metrics and cost tracking in Datadog LLM Obs).
#
# Cost tracking: each LLM span in the review trace carries the token counts and,
# where OpenRouter reported one, the cost the pass was charged, so Datadog attributes
# spend per model on the same trace as the quality metrics. Two optional org-level
# variables say where that lands: DD_SITE and DD_LLMOBS_ML_APP. No Datadog endpoint
# or org identifier is committed here. See README.md.
#
# Endpoint routing: OpenRouter serves one model slug from many endpoints, and which
# one took a call is what usually decides whether a review is fast, expensive, or
# killed by the 900s timeout. Each stage picks among them before it runs — fastest
# first, under a price ceiling derived from the endpoints actually serving that model
# — and reports which ones served it afterwards, from the generation ids pi already
# writes. The Datadog span carries the endpoint, its per-call latency and its real
# billed cost. See README.md.
#
# Prompt versioning: every review-stage prompt lives in this repo's prompts/
# registry (BiggerPockets/.github) as a versioned template, plus one shared rule
# block per concern under prompts/_shared/ injected via {{@path}}.
# Prompts are resolved by scripts/resolve-prompts.sh into step outputs; a derived
# prompt_version (content hash) identifies each prompt in Datadog LLM Obs. Each LLM
# span also carries its template and variables under meta.input.prompt, which is what
# Datadog Prompt Tracking reads to group runs by prompt and version.
#
# Prompt A/B test (BIG-21717): prompts/registry.json declares the arms, the control
# arm, and what share of pull requests an experiment arm gets. Each review runs ONE
# Stage-2 pass, using the arm that scripts/resolve-prompts.sh assigns to that PR by
# hashing '<repo>:<pr>' — so the arms are compared BETWEEN pull requests and a review
# never costs a second Stage-2 pass. The assigned arm writes both the posted summary
# and the approve / request-changes decision, which means an experiment prompt does
# affect real outcomes on its share of PRs. Assignment is deterministic, so a re-run
# reviews with the same arm. Set experiment_split_percent to 0 in registry.json to
# route everything to the control arm; every consuming repo reads that one file.
on:
  workflow_call:
    inputs:
      pr:
        description: 'PR number to review'
        required: true
        type: string
      registry_ref:
        description: >-
          Ref of BiggerPockets/.github to resolve review prompts/resolver from. Set it to
          the ref this workflow was called at (the value after `@` in
          `uses: BiggerPockets/.github/.github/workflows/...@<ref>`) so a caller pinned to
          a tag or SHA runs the exact prompt/resolver text that shipped with that workflow.
          Defaults to `main`, which is correct for callers that track `@main`; a caller that
          pins `uses:` MUST pass this explicitly or its prompts will silently drift to main.
        required: false
        default: main
        type: string
      synthesis_model:
        description: >-
          OpenRouter model slug for the Stage 2 verify-and-synthesize pass. Defaults to
          the model the whole org reviews on; a caller overrides it to put one repo on a
          different model — e.g. to route around a provider that is failing upstream, or
          to trial a model on a low-traffic repo before rolling it everywhere.

          The slug MUST be one of the models pinned in scripts/pi/models.json. A fresh CI
          runner resolves models only from that file, so an unlisted slug cannot be
          resolved and the run is failed early, by name, rather than dying mid-review.
          Adding a model is a one-line catalog entry plus its published OpenRouter rates.
        required: false
        default: deepseek/deepseek-v4.1-flash
        type: string
      first_pass_model:
        description: >-
          OpenRouter model slug for the Stage 1 first pass. Defaults to gpt-5.6-luna: the
          first pass is verified and rewritten by Stage 2, so it is the safest place in the
          review to run a cheaper model, and luna is a tenth the price of sol on both input
          and output. A caller overrides it to put one repo back on a stronger model, or to
          trial one on a low-traffic repo before rolling it everywhere.

          The slug MUST be one of the models pinned in scripts/pi/models.json with "stage1"
          in its `stages` list, so the run fails early and by name on an unlisted slug
          rather than dying mid-review.
        required: false
        default: openai/gpt-5.6-luna
        type: string

# A re-request starts a second run for the same PR; cancel the older one so it can't
# post a verdict on a superseded commit. github.repository is the caller's repo here.
concurrency:
  group: biggiepockets-review-${{ github.repository }}-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  # The two stages intentionally run in separate jobs. GitHub can only re-run a
  # failed job (not an individual step), so this boundary lets a rate-limited Stage 2
  # run be retried without paying for another first pass.
  first_pass:
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.pr_head.outputs.sha }}
      registry_sha: ${{ steps.registry_head.outputs.sha }}
    permissions:
      contents: read
      pull-requests: read
    env:
      PR: ${{ inputs.pr }}
      # Explicit model per stage, threaded into both the actual invocation below and the
      # Datadog LLM Obs tags/spans at the bottom of this job. Empty means "let the tool
      # use its own default" (today's behavior, unchanged). Set these once you want a
      # specific model pinned and reliably visible in telemetry — e.g. when a stage is
      # pointed at a non-default model — instead of an implicit, untracked default.
      # Both stages resolve their model from scripts/pi/models.json, so each slug must
      # be pinned there for that stage. They come from the first_pass_model and
      # synthesis_model inputs, so a repo can pick its own and the telemetry names the
      # model that actually ran.
      FIRST_PASS_MODEL: ${{ inputs.first_pass_model }}
      SYNTHESIS_MODEL: ${{ inputs.synthesis_model }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          fetch-depth: 0

      # Pin the Stage 2 job to the exact commit the first pass reviewed. This matters
      # when a failed Stage 2 job is retried after the PR has received another push.
      - name: Record PR head SHA
        id: pr_head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Prompt templates live in BiggerPockets/.github. Check out that repo at the ref the
      # caller passed via the registry_ref input, which defaults to main so a caller that
      # tracks @main works without setting it; a caller pinning a tag or SHA passes the
      # matching ref to run the prompt text that shipped with that workflow. Resolve the
      # ref from this input only — never from github.workflow_sha, which points at a commit
      # in the CALLER's repo and so is not a valid ref here.
      # GITHUB_TOKEN is scoped to the caller's repo, so use the BiggiePockets PAT.
      # persist-credentials is off so the PAT is never left in registry/.git/config where
      # the later review steps (which act on untrusted PR diffs and can read files/run
      # Bash) could read it — read-only prompts only need the checkout itself, not the
      # stored credentials.
      - name: Checkout prompt registry
        uses: actions/checkout@v4
        with:
          repository: BiggerPockets/.github
          ref: ${{ inputs.registry_ref }}
          token: ${{ secrets.BIGGIEPOCKETS_PAT }}
          persist-credentials: false
          path: registry

      - name: Record prompt registry SHA
        id: registry_head
        run: echo "sha=$(git -C registry rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record review start time
        run: echo "REVIEW_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      # Resolve PR context (base ref and title) from the API.
      - name: Resolve PR context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName -q .baseRefName)
          title=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title -q .title)
          echo "BASE_REF=$base" >> "$GITHUB_ENV"
          echo "PR_TITLE=$title" >> "$GITHUB_ENV"
          echo "Reviewing PR #$PR (base $base): $title"

      - name: Compute PR diff
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git diff "origin/$BASE_REF...HEAD" > pr.diff
          echo "PR diff is $(wc -l < pr.diff) lines"

      # Anchor the review on the work's intent. Always writes ticket.json: either the
      # ticket fields, or {"available": false} so a missing/unfetchable ticket degrades
      # to a diff-based review instead of failing the review.
      - name: Fetch JIRA ticket for intent
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          key=$(printf '%s' "$PR_TITLE" | grep -oE 'BIG-[0-9]+' | head -1 || true)
          if [ -z "$key" ]; then
            echo '{"available": false, "reason": "no BIG-XXXXX key in PR title"}' > ticket.json
            echo "No JIRA ticket key in PR title; falling back to diff-based review."
            exit 0
          fi

          http=$(curl -sS -w '%{http_code}' -o ticket-raw.json \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -H 'Accept: application/json' \
            "https://biggerpockets.atlassian.net/rest/api/3/issue/$key?fields=summary,description,customfield_11557") \
            || http="000"

          if [ "$http" = "200" ]; then
            jq --arg key "$key" '{available: true, key: $key, summary: .fields.summary, description: .fields.description, acceptance_criteria: .fields.customfield_11557}' \
              ticket-raw.json > ticket.json
            echo "Wrote ticket.json for $key"
          else
            echo "{\"available\": false, \"reason\": \"fetch failed (HTTP $http) for $key\"}" > ticket.json
            echo "Could not fetch $key (HTTP $http); falling back to diff-based review."
          fi

      # Gather the existing PR discussion so the review accounts for context that lives
      # in conversation rather than the diff: general comments, inline review threads, and
      # prior review bodies. Always writes conversations.json (empty arrays if none).
      - name: Fetch PR conversations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          comments=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -q '[.[] | {author: .user.login, created_at, body}]' | jq -s 'add // []')
          review_comments=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" \
            -q '[.[] | {author: .user.login, path, line, created_at, body}]' | jq -s 'add // []')
          reviews=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            -q '[.[] | select(.body != "") | {author: .user.login, state, submitted_at, body}]' | jq -s 'add // []')

          jq -n \
            --argjson comments "$comments" \
            --argjson review_comments "$review_comments" \
            --argjson reviews "$reviews" \
            '{issue_comments: $comments, review_comments: $review_comments, reviews: $reviews}' \
            > conversations.json
          echo "Wrote conversations.json ($(jq '.issue_comments | length' conversations.json) comments, $(jq '.review_comments | length' conversations.json) review comments, $(jq '.reviews | length' conversations.json) reviews)"

      # Resolve the review-stage prompts from the registry: the first-pass prompt, plus the
      # prompt of the single arm this PR is assigned to, each with its shared-rule blocks
      # expanded and a content-derived prompt_version. Also emits the assigned arm's key
      # and the bucket it was assigned from.
      - name: Resolve review prompts
        id: resolve
        env:
          REGISTRY_DIR: registry
        run: registry/scripts/resolve-prompts.sh

      # Stage 1: the first pass reviews the diff against the ticket intent and writes
      # findings to first-pass-findings.md, which Stage 2 consumes.
      #
      # This pass runs on pi, the same harness as Stage 2: one place to pin a model
      # (scripts/pi/models.json), one set of published rates behind the cost telemetry,
      # and the same early failure on an unpinned slug for both stages.
      #
      # continue-on-error keeps a first-pass failure from blocking the review: Stage 2
      # proceeds on its own when first-pass-findings.md is missing or empty. The next step
      # still surfaces the failure as a warning so a genuinely broken Stage 1 (e.g. a bad
      # key) doesn't silently disappear.
      - name: Install pi
        run: |
          npm install -g "@earendil-works/pi-coding-agent@0.84.3"
          echo "$(npm config get prefix)/bin" >> "$GITHUB_PATH"

      # Which OpenRouter endpoint serves a call decides both whether the pass finishes
      # inside its 900s cap and what it costs, and OpenRouter picks one per call unless
      # told otherwise. scripts/pi/openrouter.py reads the endpoints currently serving
      # this model and builds the preference from that live field: fastest first, under
      # a price ceiling set by what is actually on offer today. The ceiling is derived
      # rather than written down here because a pinned figure fails silently in both
      # directions -- above the field it excludes nothing, below it `max_price` is a
      # hard filter and the review has nowhere to run.
      #
      # continue-on-error, and an empty result is a valid one: the pass then runs on
      # OpenRouter's default routing, exactly as it did before. A routing preference is
      # an improvement on the default, not a precondition for reviewing a PR.
      - name: Resolve OpenRouter routing
        continue-on-error: true
        run: |
          routing=$(python3 registry/scripts/pi/openrouter.py routing "$FIRST_PASS_MODEL") || routing=""
          [ -n "$routing" ] || routing='{}'
          echo "OPENROUTER_ROUTING=$routing" >> "$GITHUB_ENV"
          echo "Stage 1 routing for $FIRST_PASS_MODEL: $routing"

      # pi resolves its models from a config dir (PI_CODING_AGENT_DIR), seeded from the
      # pinned OpenRouter provider in scripts/pi/models.json. `stages` is ours, not pi's,
      # so it is stripped here — pi only ever sees fields it defines.
      - name: Configure pi
        run: |
          mkdir -p "$RUNNER_TEMP/pi-config"
          routing="${OPENROUTER_ROUTING:-}"
          [ -n "$routing" ] || routing='{}'
          # compat.openRouterRouting is pi's OpenRouter provider-selection field; pi
          # sends it as the request's `provider` object. It is applied to the copy pi
          # reads, for this run only -- scripts/pi/models.json is unchanged -- and only
          # to the model this pass runs, since the ceiling was derived from that model's
          # own field and would strand a differently-priced one.
          jq --argjson routing "$routing" --arg model "$FIRST_PASS_MODEL" \
            '{providers: {openrouter: (.providers.openrouter
                | {baseUrl, apiKey, api,
                   models: [.models[]
                     | del(.stages)
                     | if .id == $model and ($routing | length) > 0
                       then .compat = ((.compat // {}) + {openRouterRouting: $routing})
                       else . end]})}}' \
            registry/scripts/pi/models.json > "$RUNNER_TEMP/pi-config/models.json"
          echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/pi-config" >> "$GITHUB_ENV"

          if ! jq -e --arg m "$FIRST_PASS_MODEL" \
            '.providers.openrouter.models[]
               | select(.id == $m) | select((.stages // ["stage1"]) | index("stage1"))' \
            registry/scripts/pi/models.json > /dev/null; then
            known=$(jq -r '.providers.openrouter.models[]
                             | select((.stages // ["stage1"]) | index("stage1")) | .id' \
                    registry/scripts/pi/models.json | paste -sd, -)
            echo "::error::first_pass_model '$FIRST_PASS_MODEL' is not pinned for stage1 in scripts/pi/models.json (have: $known). Add it there with its published OpenRouter rates and \"stage1\" in its stages list before pointing a repo at it." >&2
            exit 1
          fi

      - name: Record first-pass start time
        run: echo "FIRST_PASS_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      - name: First-pass review
        id: first_pass
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FIRST_PASS_PROMPT: ${{ steps.resolve.outputs.first_pass_prompt }}
        run: |
          printf '%s' "$FIRST_PASS_PROMPT" > first-pass-prompt.txt

          # pi's stock system prompt casts the model as an editor that writes files
          # and devotes a long block to pi's own documentation — both wrong for a
          # read-only review, and the latter is pure distraction. Replace it with
          # prompts/first-pass-system.md, which states how to operate: keep going,
          # verify before claiming, report security findings rather than soften them,
          # use git history for intent, cite real paths, and treat the final message
          # as the deliverable. What to review stays in the review prompt.
          #
          # This file is versioned by git, not by the prompt registry, so its hash is
          # tagged onto the span. Editing it changes review behavior as surely as a
          # Roll does and needs to be just as visible in Datadog.
          system_prompt=$(cat registry/prompts/first-pass-system.md)
          echo "FIRST_PASS_SYSTEM_VERSION=$(printf '%s' "$system_prompt" | sha256sum | cut -c1-12)" >> "$GITHUB_ENV"
          # Tools are allowlisted to the read/grep/glob/bash set the prompt needs to
          # explore the repo; `write` is deliberately absent, because this pass's
          # contract is that its final message IS the report. Context files, skills and
          # extensions are disabled so nothing in the untrusted PR checkout can steer
          # the run through configuration.
          #
          # `bash` is load-bearing — the prompt's step 2 requires `git log`/`git show` to
          # judge intent from history — but it is real execution against an untrusted PR
          # checkout, and pi has no read-only sandbox to confine it to. The same is true
          # of Stage 2, which has run with `bash` against the same checkout since it moved
          # to pi. Treat the OPENROUTER_API_KEY in this step's environment, and the
          # checkout's own credentials, as reachable by a sufficiently determined prompt
          # injection in a pull request. Narrowing that is a change to both stages, not
          # something this step can fix alone.
          timeout 900 pi --mode json \
            --model "$FIRST_PASS_MODEL" \
            --system-prompt "$system_prompt" \
            --thinking medium \
            --tools read,grep,glob,bash \
            --no-context-files --no-skills --no-extensions \
            --no-themes --no-prompt-templates \
            @first-pass-prompt.txt \
            > first-pass-output.jsonl 2> first-pass-error.log || pi_exit=$?
          pi_exit="${pi_exit:-0}"

          echo "FIRST_PASS_OUTPUT_FILE=$GITHUB_WORKSPACE/first-pass-output.jsonl" >> "$GITHUB_ENV"

          # The prompt's contract: the model's final message is the findings report.
          python3 registry/scripts/pi/final-message.py first-pass-output.jsonl > first-pass-findings.md
          if [ ! -s first-pass-findings.md ]; then
            echo "::error::first-pass review produced no findings (pi exit $pi_exit)" >&2
            tail -60 first-pass-error.log >&2 || true
            exit 1
          fi

      # If the first pass failed it may have left no findings file at all, so make sure
      # Stage 2 cleanly takes its no-findings path, and record a warning for observability.
      - name: Note skipped first pass
        if: steps.first_pass.outcome == 'failure'
        run: |
          echo "::warning::Stage 1 first-pass review failed; continuing with a Stage 2-only review."
          : > first-pass-findings.md

      # Persist the handoff even when the first pass failed. Stage 2 consumes the same
      # diff, ticket/discussion context, and (possibly empty) findings on every retry.
      - name: Record first-pass completion metadata
        if: always()
        run: |
          first_pass_end_ns=$(date +%s%N)
          echo "FIRST_PASS_END_NS=$first_pass_end_ns" >> "$GITHUB_ENV"
          # pi records its usage (tokens, turn count, and a cost.total computed from the
          # model's pinned OpenRouter rates) in the event stream it just wrote. Read it
          # here and hand it to the job that reports the trace, since that stream stays
          # on this runner. One line, because the handoff is read as env.
          first_pass_usage=$(python3 registry/scripts/llm-usage.py pi "${FIRST_PASS_MODEL:-unspecified}" \
            "${FIRST_PASS_OUTPUT_FILE:-}" | tr -d '\n') || first_pass_usage=""
          {
            echo "BASE_REF=$BASE_REF"
            echo "REVIEW_START_NS=$REVIEW_START_NS"
            echo "FIRST_PASS_START_NS=$FIRST_PASS_START_NS"
            echo "FIRST_PASS_END_NS=$first_pass_end_ns"
            echo "FIRST_PASS_STATUS=${{ steps.first_pass.outcome }}"
            echo "FIRST_PASS_USAGE_JSON=$first_pass_usage"
            echo "FIRST_PASS_SYSTEM_VERSION=${FIRST_PASS_SYSTEM_VERSION:-unknown}"
          } > review-context.env
          touch first-pass-findings.md

      - name: Upload first-pass review handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-pass-review-${{ github.run_id }}
          path: |
            pr.diff
            ticket.json
            conversations.json
            first-pass-findings.md
            review-context.env
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # A failed/rate-limited Stage 2 run can be retried with "Re-run failed jobs". The
  # successful first-pass job is not re-executed; this job downloads its immutable handoff.
  synthesis:
    needs: first_pass
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      PR: ${{ inputs.pr }}
      FIRST_PASS_MODEL: ${{ inputs.first_pass_model }}
      SYNTHESIS_MODEL: ${{ inputs.synthesis_model }}
    steps:
      - name: Checkout reviewed PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.first_pass.outputs.head_sha }}
          fetch-depth: 0

      - name: Checkout prompt registry
        uses: actions/checkout@v4
        with:
          repository: BiggerPockets/.github
          ref: ${{ needs.first_pass.outputs.registry_sha }}
          token: ${{ secrets.BIGGIEPOCKETS_PAT }}
          persist-credentials: false
          path: registry

      - name: Download first-pass review handoff
        uses: actions/download-artifact@v4
        with:
          name: first-pass-review-${{ github.run_id }}
          path: .

      - name: Restore review context
        run: cat review-context.env >> "$GITHUB_ENV"

      # Resolve again from the same pinned registry ref. Prompt text stays out of job
      # outputs (which are size-limited), while the artifact carries all model inputs.
      - name: Resolve review prompts
        id: resolve
        env:
          REGISTRY_DIR: registry
        run: registry/scripts/resolve-prompts.sh

      # Stage 2: pi verifies the first pass's findings, reviews independently, and decides.
      # This is the only Stage-2 pass, running whichever arm's prompt was assigned to
      # this PR. Its verdict is the review. pi is the @earendil-works/pi-coding-agent
      # CLI (a plain npm package — no GitHub app, no OIDC), authenticated to OpenRouter
      # with the same OPENROUTER_API_KEY the first pass uses.
      - name: Install pi
        run: |
          npm install -g "@earendil-works/pi-coding-agent@0.84.3"
          echo "$(npm config get prefix)/bin" >> "$GITHUB_PATH"

      # Which OpenRouter endpoint serves a call decides both whether the pass finishes
      # inside its 900s cap and what it costs, and OpenRouter picks one per call unless
      # told otherwise. scripts/pi/openrouter.py reads the endpoints currently serving
      # this model and builds the preference from that live field: fastest first, under
      # a price ceiling set by what is actually on offer today. The ceiling is derived
      # rather than written down here because a pinned figure fails silently in both
      # directions -- above the field it excludes nothing, below it `max_price` is a
      # hard filter and the review has nowhere to run.
      #
      # continue-on-error, and an empty result is a valid one: the pass then runs on
      # OpenRouter's default routing, exactly as it did before. A routing preference is
      # an improvement on the default, not a precondition for reviewing a PR.
      - name: Resolve OpenRouter routing
        continue-on-error: true
        run: |
          routing=$(python3 registry/scripts/pi/openrouter.py routing "$SYNTHESIS_MODEL") || routing=""
          [ -n "$routing" ] || routing='{}'
          echo "OPENROUTER_ROUTING=$routing" >> "$GITHUB_ENV"
          echo "Stage 2 routing for $SYNTHESIS_MODEL: $routing"

      # pi resolves its models from a config dir (PI_CODING_AGENT_DIR). Point it at a
      # writable scratch dir seeded with the pinned OpenRouter provider from
      # scripts/pi/models.json: the pinned models + rates are what make a FRESH runner
      # deterministic — these models are absent from the catalog pi ships, and the live
      # catalog refresh is a background fetch, not a startup step we can rely on.
      #
      # That is also why the requested model is checked against the catalog here. An
      # unlisted slug is unresolvable on a fresh runner, and pi would otherwise discover
      # that only after the review had started, surfacing as an empty verdict rather than
      # as the configuration mistake it is.
      - name: Configure pi
        run: |
          mkdir -p "$RUNNER_TEMP/pi-config"
          # `stages` is ours, not pi's — strip it so pi only sees fields it defines.
          routing="${OPENROUTER_ROUTING:-}"
          [ -n "$routing" ] || routing='{}'
          # compat.openRouterRouting is pi's OpenRouter provider-selection field; pi
          # sends it as the request's `provider` object. It is applied to the copy pi
          # reads, for this run only -- scripts/pi/models.json is unchanged -- and only
          # to the model this pass runs, since the ceiling was derived from that model's
          # own field and would strand a differently-priced one.
          jq --argjson routing "$routing" --arg model "$SYNTHESIS_MODEL" \
            '{providers: {openrouter: (.providers.openrouter
                | {baseUrl, apiKey, api,
                   models: [.models[]
                     | del(.stages)
                     | if .id == $model and ($routing | length) > 0
                       then .compat = ((.compat // {}) + {openRouterRouting: $routing})
                       else . end]})}}' \
            registry/scripts/pi/models.json > "$RUNNER_TEMP/pi-config/models.json"
          echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/pi-config" >> "$GITHUB_ENV"

          if ! jq -e --arg m "$SYNTHESIS_MODEL" \
            '.providers.openrouter.models[]
               | select(.id == $m) | select((.stages // ["stage2"]) | index("stage2"))' \
            registry/scripts/pi/models.json > /dev/null; then
            known=$(jq -r '.providers.openrouter.models[]
                             | select((.stages // ["stage2"]) | index("stage2")) | .id' \
                    registry/scripts/pi/models.json | paste -sd, -)
            echo "::error::synthesis_model '$SYNTHESIS_MODEL' is not pinned for stage2 in scripts/pi/models.json (have: $known). Add it there with its published OpenRouter rates and \"stage2\" in its stages list before pointing a repo at it." >&2
            exit 1
          fi

      - name: Record synthesis start time
        run: echo "SYNTHESIS_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      - name: Verify and synthesize
        id: synthesis
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARM_PROMPT: ${{ steps.resolve.outputs.arm_prompt }}
        run: |
          printf '%s' "$ARM_PROMPT" > arm-prompt.txt
          # One headless pass in JSON event-stream mode. Tools are allowlisted to the
          # same read/grep/glob/bash/write set the Claude stage had; context files,
          # skills, and extensions are disabled so nothing in the untrusted PR checkout
          # can steer the run. Stderr is captured so a failure carries pi's own error
          # text into the diagnostics step without polluting the JSONL that
          # llm-usage.py parses.
          timeout 900 pi --mode json \
            --model "$SYNTHESIS_MODEL" \
            --tools read,grep,glob,bash,write \
            --no-context-files --no-skills --no-extensions \
            --no-themes --no-prompt-templates \
            @arm-prompt.txt \
            > synthesis-output.jsonl 2> synthesis-error.log || pi_exit=$?
          pi_exit="${pi_exit:-0}"

          echo "SYNTHESIS_OUTPUT_FILE=$GITHUB_WORKSPACE/synthesis-output.jsonl" >> "$GITHUB_ENV"
          echo "SYNTHESIS_EXIT=$pi_exit" >> "$GITHUB_ENV"
          # pi may exit 0 on a retried-but-still-failed session (e.g. an upstream 429
          # that exhausted its retries), so the verdict file is the contract. Fail the
          # step so "Re-run failed jobs" retries just this pass.
          if [ ! -f verdict.json ]; then
            echo "::error::pi review run produced no verdict.json (pi exit $pi_exit)" >&2
            tail -60 synthesis-error.log >&2 || true
            exit 1
          fi

      - name: Capture review failure diagnostics
        if: ${{ always() && steps.synthesis.outcome == 'failure' }}
        env:
          DIAGNOSTIC_TOKEN_PROVIDER: ${{ secrets.OPENROUTER_API_KEY }}
          DIAGNOSTIC_TOKEN_GITHUB: ${{ github.token }}
          DIAGNOSTIC_TOKEN_REVIEW: ${{ secrets.BIGGIEPOCKETS_PAT }}
        run: |
          execution_file="${SYNTHESIS_OUTPUT_FILE:-$GITHUB_WORKSPACE/synthesis-output.jsonl}"
          python3 registry/scripts/review-diagnostics.py "$execution_file" \
            "$RUNNER_TEMP/review-diagnostics/diagnostics.json" \
            "$GITHUB_WORKSPACE/synthesis-error.log"

      - name: Upload review failure diagnostics
        if: ${{ always() && steps.synthesis.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: review-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/review-diagnostics/diagnostics.json
          retention-days: 7
          if-no-files-found: warn

      - name: Record synthesis end time
        if: always()
        run: echo "SYNTHESIS_END_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      # Which OpenRouter endpoint actually served this review, measured rather than
      # assumed. pi records `responseId` on every completed assistant turn, and on
      # OpenRouter that is the generation id, so the ids are already in synthesis-output.jsonl
      # with no change to pi. Each resolves through GET /api/v1/generation to the
      # serving provider and its real latency, generation time and billed cost.
      #
      # Measuring instead of asserting is what lets routing keep its fallbacks: the run
      # is free to move off a degrading endpoint, and this still names where the calls
      # landed. It is also why this survives the 900s kill -- every turn that finished
      # wrote its id before the kill, and those are the turns that describe the stall.
      #
      # Ids and per-call statistics only; no prompt or completion text is read.
      - name: Attribute the run to OpenRouter endpoints
        if: always()
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          attribution=$(python3 registry/scripts/pi/openrouter.py attribute \
            "${SYNTHESIS_OUTPUT_FILE:-$GITHUB_WORKSPACE/synthesis-output.jsonl}" \
            --api-key "$OPENROUTER_API_KEY") || attribution=""
          [ -n "$attribution" ] || attribution='{"primary":"","providers":[],"metrics":{}}'
          echo "STAGE2_ATTRIBUTION=$attribution" >> "$GITHUB_ENV"
          echo "Stage 2 served by: $(printf '%s' "$attribution" | jq -c '.calls_by_provider // {}')"

      # Submit the review under the arm this PR was assigned. The arm is not disclosed
      # in the comment: a reviewer who knows which prompt wrote a summary can't rate it
      # blind, and the whole point of the split is an unbiased read on the two prompts.
      - name: Submit review as BiggiePockets
        id: submit
        env:
          # PAT authenticating as the BiggiePockets service account. A bot cannot
          # approve its own PR, so this never gates BiggiePockets-authored PRs.
          GH_TOKEN: ${{ secrets.BIGGIEPOCKETS_PAT }}
          ASSIGNED_ARM: ${{ steps.resolve.outputs.assigned_arm }}
        run: |
          if [ ! -f verdict.json ]; then
            echo "::error::pi review run did not produce verdict.json" >&2
            exit 1
          fi

          verdict=$(jq -r '.verdict' verdict.json)
          summary=$(jq -r '.summary' verdict.json)

          printf '## BiggiePockets assisted review\n\n%s\n' "$summary" > review-body.md

          case "$verdict" in
            approve)
              gh pr review "$PR" --approve --body-file review-body.md
              ;;
            request_changes)
              gh pr review "$PR" --request-changes --body-file review-body.md
              ;;
            *)
              echo "::error::Unexpected verdict from $ASSIGNED_ARM arm review: '$verdict'" >&2
              exit 1
              ;;
          esac

          echo "VERDICT=$verdict" >> "$GITHUB_ENV"

      # Reports ONE LLM OBS TRACE per review, tagged with the arm this PR was assigned,
      # and joined by a stable run_id (repo + pr + review attempt) so offline evals and
      # panel ratings line up per review. Never blocks/fails/delays the review itself.
      #
      # `arm`/`prompt_name`/`prompt_version` are payload-level tags, which is where a tag
      # key resolves to one value — one arm per review, so one value each.
      #
      #   root biggiepockets.review -> pi.first_pass, pi.synthesize
      #
      # Compare arms by grouping on `arm` across pull requests (verdict rate, latency,
      # tokens).
      - name: Report review metrics to Datadog LLM Obs
        if: always()
        continue-on-error: true
        env:
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          # Site and ml_app come from org-level variables so no Datadog endpoint or
          # org identifier is committed here; both fall back to public defaults.
          DD_SITE: ${{ vars.DD_SITE }}
          DD_LLMOBS_ML_APP: ${{ vars.DD_LLMOBS_ML_APP }}
          FIRST_PASS_PROMPT_TEMPLATE: ${{ steps.resolve.outputs.first_pass_prompt_template }}
          ARM_PROMPT_TEMPLATE: ${{ steps.resolve.outputs.arm_prompt_template }}
        run: |
          if [ -z "$DD_API_KEY" ]; then
            echo "Skipping Datadog LLM Obs submission: DATADOG_API_KEY not configured"
            exit 0
          fi

          now_ns=$(date +%s%N)
          review_start_ns="${REVIEW_START_NS:-$now_ns}"
          first_pass_start_ns="${FIRST_PASS_START_NS:-$review_start_ns}"
          first_pass_end_ns="${FIRST_PASS_END_NS:-$first_pass_start_ns}"
          synthesis_start_ns="${SYNTHESIS_START_NS:-$first_pass_end_ns}"
          synthesis_end_ns="${SYNTHESIS_END_NS:-$synthesis_start_ns}"

          verdict="${VERDICT:-unknown}"
          first_pass_prompt_name="${{ steps.resolve.outputs.first_pass_prompt_name }}"
          first_pass_prompt_version="${{ steps.resolve.outputs.first_pass_prompt_version }}"
          # Travels from the first-pass job via review-context.env, since the system
          # prompt is applied there and this job never reads the file.
          first_pass_system_version="${FIRST_PASS_SYSTEM_VERSION:-unknown}"
          arm="${{ steps.resolve.outputs.assigned_arm }}"
          arm_prompt_name="${{ steps.resolve.outputs.arm_prompt_name }}"
          arm_prompt_version="${{ steps.resolve.outputs.arm_prompt_version }}"
          control_arm="${{ steps.resolve.outputs.control_arm }}"
          # Which side of the split this review is on, plus the inputs that produced it.
          # Recording the bucket and the split percentage makes an assignment auditable
          # after the fact: a later Apply that changes the split can't silently rewrite
          # what an already-recorded review was assigned under.
          assignment_bucket="${{ steps.resolve.outputs.assignment_bucket }}"
          split_percent="${{ steps.resolve.outputs.experiment_split_percent }}"
          arm_role="control"
          [ "$arm" != "$control_arm" ] && arm_role="experiment"

          first_pass_status="ok"
          [ "${FIRST_PASS_STATUS:-failure}" != "success" ] && first_pass_status="error"
          first_pass_findings=$(cat first-pass-findings.md 2>/dev/null || true)
          first_pass_findings_lines=$(wc -l < first-pass-findings.md 2>/dev/null || echo 0)

          synthesis_status="ok"
          [ "${{ steps.synthesis.outcome }}" != "success" ] && synthesis_status="error"

          root_status="ok"
          [ "${{ steps.submit.outcome }}" != "success" ] && root_status="error"

          summary=""
          [ -f verdict.json ] && summary=$(jq -r '.summary // ""' verdict.json 2>/dev/null) || summary=""

          # Cap free-text fields sent to Datadog so one outsized findings report can't
          # blow past the LLM Obs payload limit; the untruncated text is always still in
          # this step's own job logs.
          truncate() {
            local text="$1" max=4000
            if [ "${#text}" -gt "$max" ]; then
              printf '%s… [truncated %d chars]' "${text:0:$max}" "$((${#text} - max))"
            else
              printf '%s' "$text"
            fi
          }
          first_pass_findings_excerpt=$(truncate "$first_pass_findings")
          summary_excerpt=$(truncate "$summary")

          # Prompt Tracking: each LLM span carries the registry template that produced it,
          # under meta.input.prompt. The template keeps its {{PR}}/{{PROMPT_NAME}}/
          # {{PROMPT_VERSION}} placeholders and the substituted values ride along as
          # `variables`, so every PR's run lands on the same prompt in Datadog instead of
          # registering a new template per PR. `version` is our content-derived hash, so a
          # prompt edit (a Roll) is what starts a new version.
          prompt_json() { # name version template -> Prompt object
            jq -n \
              --arg name "$1" \
              --arg version "$2" \
              --arg template "$3" \
              --arg pr "$PR" \
              '{
                id: $name,
                name: $name,
                version: $version,
                template: $template,
                # Report only the placeholders this template actually uses, so the
                # variables list matches what a Playground replay needs to render it.
                variables: (
                  {PR: $pr, PROMPT_NAME: $name, PROMPT_VERSION: $version}
                  | with_entries(select(.key as $k | $template | contains("{{" + $k + "}}")))
                )
              }'
          }
          first_pass_prompt_obj=$(prompt_json "$first_pass_prompt_name" "$first_pass_prompt_version" "$FIRST_PASS_PROMPT_TEMPLATE")
          arm_prompt_obj=$(prompt_json "$arm_prompt_name" "$arm_prompt_version" "$ARM_PROMPT_TEMPLATE")

          first_pass_model_tag="${FIRST_PASS_MODEL:-unspecified}"
          synthesis_model_tag="${SYNTHESIS_MODEL:-unspecified}"

          dd_site="${DD_SITE:-datadoghq.com}"
          ml_app="${DD_LLMOBS_ML_APP:-biggiepockets-review}"

          # Cost tracking. Each pass carries its own usage as span metrics plus a
          # model identity split into the bare name and originating provider that
          # Datadog's pricing catalog keys on ("openai/gpt-5.6-sol" -> gpt-5.6-sol +
          # openai; "deepseek/deepseek-v4.1-flash" -> deepseek-v4.1-flash + deepseek);
          # the OpenRouter gateway is kept as a tag instead. Datadog then prices a
          # catalogued model from its token counts, and takes the reported `total_cost`
          # at face value for one it doesn't carry.
          #
          # Both numbers come from what the tools recorded. pi records a usage object
          # (tokens, a turn count, and a cost.total computed from the model's OpenRouter
          # list rates on the runner, pinned in scripts/pi/models.json) on every pass —
          # that is the same rate table OpenRouter bills against, so cost.total is the
          # amount the pass is charged. Both stages run pi and so report identically; the
          # first pass's counters travel from its own job in FIRST_PASS_USAGE_JSON, since
          # its event stream stays on that runner.
          #
          # turn_count rides along in metrics. It is what makes the token counts
          # interpretable: pi reports a running session total, so a multi-turn first pass
          # counts its conversation prefix once per turn and its cumulative input is not a
          # context-window requirement. scripts/pi/check_model_freshness.py divides the two
          # apart using this count when it sizes context for the weekly chart.
          # Only usage objects are read, never message content.
          # Fall back to an empty object if the helper can't run at all, so a cost
          # problem can't cost us the quality metrics in the same payload.
          no_fields='{"model_name":"unspecified","model_provider":"unspecified","metrics":{}}'
          first_pass_fields="${FIRST_PASS_USAGE_JSON:-}"
          synthesis_fields=$(python3 registry/scripts/llm-usage.py pi "$synthesis_model_tag" "${SYNTHESIS_OUTPUT_FILE:-}") || synthesis_fields="$no_fields"
          usable='has("model_name") and has("model_provider") and has("metrics")'
          echo "$first_pass_fields" | jq -e "$usable" >/dev/null 2>&1 || first_pass_fields="$no_fields"
          echo "$synthesis_fields" | jq -e "$usable" >/dev/null 2>&1 || synthesis_fields="$no_fields"

          run_id="$GITHUB_REPOSITORY-pr$PR-${{ github.run_id }}"

          trace_id=$(openssl rand -hex 16)
          root_span_id=$(openssl rand -hex 8)
          first_pass_span_id=$(openssl rand -hex 8)
          synthesis_span_id=$(openssl rand -hex 8)

          # The OpenRouter endpoints that served Stage 2, from the attribution step.
          # Provider names carry spaces ("Together AI"), and a space would split one tag
          # into two, so anything outside a tag-safe set becomes an underscore.
          # "unattributed" is a run whose lookups did not resolve -- a real, findable
          # state rather than missing data.
          attribution="${STAGE2_ATTRIBUTION:-}"
          echo "$attribution" | jq -e 'has("metrics")' >/dev/null 2>&1 \
            || attribution='{"primary":"","providers":[],"metrics":{}}'
          sanitize() { printf '%s' "$1" | tr -c '[:alnum:]_.:/-' '_'; }
          stage2_provider=$(sanitize "$(printf '%s' "$attribution" \
            | jq -r '.primary // "" | if . == "" then "unattributed" else . end')")
          # A run that spans several endpoints is itself the signal that one degraded
          # mid-review, so every endpoint touched gets its own tag rather than only the
          # one that served the most calls.
          stage2_provider_tags=$(printf '%s' "$attribution" \
            | jq -r '.providers // [] | .[]' \
            | while read -r name; do printf 'stage2_endpoint:%s\n' "$(sanitize "$name")"; done \
            | jq -R . | jq -sc .)
          [ -n "$stage2_provider_tags" ] || stage2_provider_tags='[]'
          attribution_metrics=$(printf '%s' "$attribution" | jq -c '.metrics // {}')

          spans=$(jq -n \
            --arg trace_id "$trace_id" \
            --arg root_span_id "$root_span_id" \
            --arg first_pass_span_id "$first_pass_span_id" \
            --arg synthesis_span_id "$synthesis_span_id" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg pr "$PR" \
            --arg base_ref "${BASE_REF:-unknown}" \
            --arg first_pass_model "$first_pass_model_tag" \
            --arg synthesis_model "$synthesis_model_tag" \
            --argjson review_start_ns "$review_start_ns" \
            --argjson root_duration "$((now_ns - review_start_ns))" \
            --argjson first_pass_start_ns "$first_pass_start_ns" \
            --argjson first_pass_duration "$((first_pass_end_ns - first_pass_start_ns))" \
            --argjson synthesis_start_ns "$synthesis_start_ns" \
            --argjson synthesis_duration "$((synthesis_end_ns - synthesis_start_ns))" \
            --arg first_pass_status "$first_pass_status" \
            --arg synthesis_status "$synthesis_status" \
            --arg root_status "$root_status" \
            --argjson first_pass_fields "$first_pass_fields" \
            --argjson synthesis_fields "$synthesis_fields" \
            --argjson attribution_metrics "$attribution_metrics" \
            --arg first_pass_findings_excerpt "$first_pass_findings_excerpt" \
            --arg summary_excerpt "$summary_excerpt" \
            --argjson first_pass_prompt "$first_pass_prompt_obj" \
            --argjson arm_prompt "$arm_prompt_obj" \
            '[
              {
                parent_id: "undefined",
                trace_id: $trace_id,
                span_id: $root_span_id,
                name: "biggiepockets.review",
                start_ns: $review_start_ns,
                duration: $root_duration,
                status: $root_status,
                meta: {
                  kind: "workflow",
                  input: {value: "repo:\($repo) pr:\($pr) base_ref:\($base_ref)"},
                  output: {value: $summary_excerpt}
                }
              },
              {
                parent_id: $root_span_id,
                trace_id: $trace_id,
                span_id: $first_pass_span_id,
                name: "pi.first_pass",
                start_ns: $first_pass_start_ns,
                duration: $first_pass_duration,
                status: $first_pass_status,
                metrics: $first_pass_fields.metrics,
                meta: {
                  kind: "llm",
                  model_name: $first_pass_fields.model_name,
                  model_provider: $first_pass_fields.model_provider,
                  input: {
                    messages: [{role: "user", content: "Review pr:\($pr) against ticket.json/pr.diff"}],
                    prompt: $first_pass_prompt
                  },
                  output: {messages: [{role: "assistant", content: $first_pass_findings_excerpt}]}
                }
              },
              {
                parent_id: $root_span_id,
                trace_id: $trace_id,
                span_id: $synthesis_span_id,
                name: "pi.synthesize",
                start_ns: $synthesis_start_ns,
                duration: $synthesis_duration,
                status: $synthesis_status,
                # Per-call latency and generation time from the endpoint that served
                # this pass, alongside the token counters pi itself records. This is
                # the pair that turns "the review was slow" into "this endpoint was
                # slow": the duration above is wall clock for the whole pass, these
                # are the calls inside it. billed_cost is what OpenRouter actually
                # charged, which a cost computed from list rates cannot see.
                #
                # Keep apostrophes out of this jq program: it is single-quoted, so one
                # closes the string and hands the rest of the payload to bash.
                metrics: ($synthesis_fields.metrics + $attribution_metrics),
                meta: {
                  kind: "llm",
                  model_name: $synthesis_fields.model_name,
                  model_provider: $synthesis_fields.model_provider,
                  input: {
                    messages: [{role: "user", content: $first_pass_findings_excerpt}],
                    prompt: $arm_prompt
                  },
                  output: {messages: [{role: "assistant", content: $summary_excerpt}]}
                }
              }
            ]')

          payload=$(jq -n \
            --arg ml_app "$ml_app" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg pr "$PR" \
            --arg run_id "$run_id" \
            --arg verdict "$verdict" \
            --arg arm "$arm" \
            --arg arm_role "$arm_role" \
            --arg prompt_name "$arm_prompt_name" \
            --arg prompt_version "$arm_prompt_version" \
            --arg control_arm "$control_arm" \
            --arg assignment_bucket "$assignment_bucket" \
            --arg split_percent "$split_percent" \
            --arg first_pass_model "$first_pass_model_tag" \
            --arg synthesis_model "$synthesis_model_tag" \
            --arg first_pass_prompt_name "$first_pass_prompt_name" \
            --arg first_pass_prompt_version "$first_pass_prompt_version" \
            --arg first_pass_system_version "$first_pass_system_version" \
            --argjson first_pass_findings_lines "$first_pass_findings_lines" \
            --arg stage2_provider "$stage2_provider" \
            --argjson stage2_provider_tags "$stage2_provider_tags" \
            --argjson spans "$spans" \
            '{
              data: {
                type: "span",
                attributes: {
                  ml_app: $ml_app,
                  # Parenthesized: an object value in jq is a term, so the `+` that
                  # appends the provider tags needs to be inside brackets.
                  tags: ([
                    "repo:\($repo)",
                    "pr:\($pr)",
                    "run_id:\($run_id)",
                    "arm:\($arm)",
                    "arm_role:\($arm_role)",
                    "prompt_name:\($prompt_name)",
                    "prompt_version:\($prompt_version)",
                    "verdict:\($verdict)",
                    "control_arm:\($control_arm)",
                    "assignment_bucket:\($assignment_bucket)",
                    "experiment_split_percent:\($split_percent)",
                    "gateway:openrouter",
                    "first_pass_model:\($first_pass_model)",
                    "synthesis_model:\($synthesis_model)",
                    "first_pass_findings_lines:\($first_pass_findings_lines)",
                    "first_pass_prompt_name:\($first_pass_prompt_name)",
                    "first_pass_prompt_version:\($first_pass_prompt_version)",
                    "first_pass_system_version:\($first_pass_system_version)"
                  ]
                  # The OpenRouter endpoint that served Stage 2. Grouping duration and
                  # status by this tag is what turns "this review was slow" into "this
                  # endpoint is slow", across runs. stage2_provider is the one that
                  # served the most calls; stage2_endpoint carries every one the run
                  # touched, so a run that was rerouted mid-review is visible as such.
                  + ["stage2_provider:\($stage2_provider)"]
                  + $stage2_provider_tags),
                  spans: $spans
                }
              }
            }')

          http_code=$(curl -sS -o /tmp/dd_response.json -w '%{http_code}' \
            -X POST "https://api.${dd_site}/api/intake/llm-obs/v1/trace/spans" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: $DD_API_KEY" \
            -d "$payload") || http_code="000"

          if [ "$http_code" -ge 300 ] 2>/dev/null || [ "$http_code" = "000" ]; then
            echo "::warning::Datadog LLM Obs submission failed (HTTP $http_code): $(cat /tmp/dd_response.json 2>/dev/null)"
          else
            echo "Reported ${arm} arm to Datadog LLM Obs (trace ${trace_id}, prompt ${arm_prompt_name}@${arm_prompt_version}, run_id ${run_id})"
            echo "Stage 2 provider: ${stage2_provider}"
          fi
