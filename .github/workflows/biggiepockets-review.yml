name: BiggiePockets Code Review (reusable)

# Reusable two-stage AI review (Codex first pass, then Claude verifies and
# synthesizes) anchored on the PR's JIRA ticket, with the BiggiePockets service
# account submitting the resulting approve / request-changes decision.
#
# Callers own the triggers and gating (e.g. fire on review_requested when
# BiggiePockets is the requested reviewer) and pass the PR number as `pr`.
# Secrets are supplied by the caller via `secrets: inherit`:
#   OPENAI_KEY, CLAUDE_CODE_OAUTH_TOKEN, JIRA_EMAIL, JIRA_API_TOKEN,
#   BIGGIEPOCKETS_PAT, DATADOG_API_KEY (optional; enables review-quality
#   metrics in Datadog LLM Obs).
on:
  workflow_call:
    inputs:
      pr:
        description: 'PR number to review'
        required: true
        type: string

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write # claude-code-action authenticates via OIDC
    env:
      PR: ${{ inputs.pr }}
      # Bump this whenever the Codex or Claude prompt text below changes, so
      # Datadog LLM Obs can separate before/after quality by prompt_version.
      PROMPT_VERSION: "4"
      # Explicit model per stage, threaded into both the actual invocation below and the
      # Datadog LLM Obs tags/spans at the bottom of this job. Empty means "let the tool
      # use its own default" (today's behavior, unchanged). Set these once you want a
      # specific model pinned and reliably visible in telemetry — e.g. when Codex is
      # pointed at a non-default model — instead of an implicit, untracked default.
      CODEX_MODEL: ""
      CLAUDE_MODEL: ""
      # Shared BiggerPockets member-privacy rules, enforced by both the Codex and Claude
      # prompts below. Defined once here so the two prompts can't drift out of sync.
      PRIVACY_RULES: |
        a. Last-name privacy: members can choose to show only the initial of their last name
           across the site, so a member's full name must never be presented without honoring that
           choice. The canonical helper is SocialUser#display_name (aliased #name), which respects
           the member's hide_last_name preference. Note #full_name and #first_name_last_initial do
           NOT check that preference, so rendering a member's name to others through them (or by
           concatenating first and last name directly) bypasses the privacy logic. Flag any such
           code in views, serializers, mailers, exports, or JSON. API responses are in scope too:
           any endpoint returning a member's name must go through #display_name.
        b. Investment-address privacy: when a member adds an investment address for a property
           they own, worked on, or showed interest in, that address must never be shown to other
           members. Precise location data such as latitude/longitude and the street address must
           be anonymized first. The canonical utilities are
           Api::V3::Dashboard::Map::LocationObfuscator.obfuscate (coordinates) and
           Api::V3::Dashboard::Map::StreetAddressMasker.mask (street address), designed to be used
           together. Flag any code that exposes such an address or its coordinates to other
           members or in API responses without anonymizing it.
      # Shared rule on data-only migrations, enforced by both the Codex and Claude prompts
      # below. Defined once here so the two prompts can't drift out of sync.
      MIGRATION_DATA_RULE: |
        If the diff includes a schema migration, check whether it also updates data rather than
        only structure — e.g. enabling/disabling/renaming a feature flag, backfilling a column, or
        other one-time data changes. Flag these: that kind of change belongs in a one-off rake
        task, done directly via the console/UI, or another one-time maintenance mechanism, not
        baked into a schema migration.
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          fetch-depth: 0

      - name: Record review start time
        run: echo "REVIEW_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      # Resolve PR context (base ref and title) from the API.
      - name: Resolve PR context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName -q .baseRefName)
          title=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title -q .title)
          echo "BASE_REF=$base" >> "$GITHUB_ENV"
          echo "PR_TITLE=$title" >> "$GITHUB_ENV"
          echo "Reviewing PR #$PR (base $base): $title"

      - name: Compute PR diff
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git diff "origin/$BASE_REF...HEAD" > pr.diff
          echo "PR diff is $(wc -l < pr.diff) lines"

      # Anchor the review on the work's intent. Always writes ticket.json: either the
      # ticket fields, or {"available": false} so a missing/unfetchable ticket degrades
      # to a diff-based review instead of failing the gate.
      - name: Fetch JIRA ticket for intent
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          key=$(printf '%s' "$PR_TITLE" | grep -oE 'BIG-[0-9]+' | head -1 || true)
          if [ -z "$key" ]; then
            echo '{"available": false, "reason": "no BIG-XXXXX key in PR title"}' > ticket.json
            echo "No JIRA ticket key in PR title; falling back to diff-based review."
            exit 0
          fi

          http=$(curl -sS -w '%{http_code}' -o ticket-raw.json \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -H 'Accept: application/json' \
            "https://biggerpockets.atlassian.net/rest/api/3/issue/$key?fields=summary,description,customfield_11557") \
            || http="000"

          if [ "$http" = "200" ]; then
            jq --arg key "$key" '{available: true, key: $key, summary: .fields.summary, description: .fields.description, acceptance_criteria: .fields.customfield_11557}' \
              ticket-raw.json > ticket.json
            echo "Wrote ticket.json for $key"
          else
            echo "{\"available\": false, \"reason\": \"fetch failed (HTTP $http) for $key\"}" > ticket.json
            echo "Could not fetch $key (HTTP $http); falling back to diff-based review."
          fi

      # Gather the existing PR discussion so the review accounts for context that lives
      # in conversation rather than the diff: general comments, inline review threads, and
      # prior review bodies. Always writes conversations.json (empty arrays if none).
      - name: Fetch PR conversations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          comments=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -q '[.[] | {author: .user.login, created_at, body}]' | jq -s 'add // []')
          review_comments=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" \
            -q '[.[] | {author: .user.login, path, line, created_at, body}]' | jq -s 'add // []')
          reviews=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            -q '[.[] | select(.body != "") | {author: .user.login, state, submitted_at, body}]' | jq -s 'add // []')

          jq -n \
            --argjson comments "$comments" \
            --argjson review_comments "$review_comments" \
            --argjson reviews "$reviews" \
            '{issue_comments: $comments, review_comments: $review_comments, reviews: $reviews}' \
            > conversations.json
          echo "Wrote conversations.json ($(jq '.issue_comments | length' conversations.json) comments, $(jq '.review_comments | length' conversations.json) review comments, $(jq '.reviews | length' conversations.json) reviews)"

      # Stage 1: Codex reviews the diff against the ticket intent and writes findings to
      # codex-findings.md (the `output-file`, which captures Codex's final message).
      #
      # Codex reviews the diff directly here rather than shelling out to the `codex review`
      # subcommand. `codex review` starts its own in-process app-server that needs both a
      # writable runtime home AND a localhost connection to the action's Responses API proxy.
      # When it was launched as a child of `codex exec`, that child inherited the exec sandbox,
      # which grants neither by default: under `sandbox: read-only` it died writing runtime
      # state ("failed to initialize in-process app-server client: Read-only file system
      # (os error 30)"), and under a writable profile it then died reaching the proxy
      # ("stream disconnected before completion: error sending request for url
      # http://127.0.0.1.../v1/responses"), because that profile grants filesystem writes but
      # no network. Either way Codex produced no findings and every review silently degraded to
      # a Claude-only pass. Reviewing inline via this step's own `codex exec` model call avoids
      # the nested subprocess entirely: it needs only to read files, so a read-only sandbox is
      # sufficient and there is no child process to sandbox.
      #
      # continue-on-error keeps a Codex failure (e.g. an OpenAI "Quota exceeded" error) from
      # blocking the review: Stage 2 proceeds on its own when codex-findings.md is missing or
      # empty. The next step still surfaces the failure as a warning so a genuinely broken Codex
      # (e.g. a bad key) doesn't silently disappear.
      - name: Record codex start time
        run: echo "CODEX_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      - name: Codex first-pass review
        id: codex
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_KEY }}
          model: ${{ env.CODEX_MODEL }}
          sandbox: read-only
          output-file: codex-findings.md
          prompt: |
            Perform a first-pass code review of this pull request and output a concise
            markdown findings report. Your final message IS the report — it is captured
            verbatim and handed to a second reviewer, so do not add conversational preamble.

            1. Read ticket.json. If "available" is true, treat its summary as intended behavior and its
               acceptance_criteria as GUIDELINES, not a hard contract — they describe the minimum the
               ticket set out to achieve, not the ceiling on what counts as correct. Do not flag a
               change just because it doesn't match the acceptance criteria verbatim: first judge
               whether the change actually satisfies the ticket's intent, and give particular credit
               when the author went beyond the literal criteria (see step 2 for how to weigh that
               against history/context). Only treat a deviation as a blocker if it genuinely fails the
               ticket's purpose. If the ticket is not available, do a diff-based review.
            2. Review the diff in pr.diff. Do NOT rely on the hunks alone: use `git log` / `git show`
               on the branch and grep the repository for callers and related tests to judge impact and
               intent. Git history and the PR's context are usually more reliable evidence of what was
               meant than the ticket's literal acceptance criteria: when a commit, the diff, or the
               conversation shows the work was refined or extended beyond the AC in a sound way, treat
               that as an improvement rather than scope creep.
            3. Enforce these BiggerPockets member-privacy rules and flag any violation with a
               file/line reference:
               ${{ env.PRIVACY_RULES }}
            4. ${{ env.MIGRATION_DATA_RULE }}
            5. Report concrete issues — bugs, regressions, security problems, member-privacy
               violations, and genuine misses of the ticket's intent or clear scope creep — each with a
               file/line reference and a brief rationale. Do not list "doesn't match acceptance
               criteria" as an issue by itself; only raise it when the deviation harms the intent. If
               nothing is blocking, say so briefly. Be specific and pragmatic; this is a first pass that
               a second reviewer will independently verify.

      # If Codex failed (it exits nonzero and writes no codex-findings.md — e.g. on a quota
      # error), leave an empty findings file so Stage 2 cleanly takes its no-findings path,
      # and record a warning for observability.
      - name: Note skipped Codex first pass
        if: steps.codex.outcome == 'failure'
        run: |
          echo "::warning::Codex first-pass review failed (commonly an OpenAI quota error); continuing with a Claude-only review."
          : > codex-findings.md

      - name: Record codex end / claude start time
        run: |
          echo "CODEX_END_NS=$(date +%s%N)" >> "$GITHUB_ENV"
          echo "CLAUDE_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      # Stage 2: Claude verifies Codex's findings, reviews independently, and decides.
      - name: Claude verify and synthesize
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Allow the `claude` bot to trigger this review. Without this, PRs opened
          # by the claude bot are rejected with "Workflow initiated by non-human
          # actor: claude (type: Bot). Add bot to allowed_bots list."
          allowed_bots: 'claude'
          claude_args: ${{ env.CLAUDE_MODEL != '' && format('--allowedTools "Read,Grep,Glob,Bash,Write" --model {0}', env.CLAUDE_MODEL) || '--allowedTools "Read,Grep,Glob,Bash,Write"' }}
          prompt: |
            Synthesize a single review decision for pull request #${{ env.PR }}.

            1. Read ticket.json. If "available" is true, treat its summary and description as the
               intended behavior, and its acceptance_criteria (Atlassian Document Format JSON) as
               GUIDELINES rather than a hard contract. The AC describe the minimum the ticket set out
               to achieve, not the ceiling on what counts as correct: don't reject a change merely for
               not matching them verbatim. Judge whether the change satisfies the ticket's intent, and
               weigh git history and the PR discussion (steps 2–3) as more authoritative evidence of
               what was actually meant.
            2. Read Codex's first-pass findings in codex-findings.md (if missing or empty, proceed
               with your own review).
            3. Read conversations.json: the PR's existing discussion (issue_comments, review_comments
               with file/line, and prior reviews). Factor this context into your review: respect
               decisions already settled in the thread, don't re-raise concerns the author has already
               addressed or that were explicitly accepted, and weigh unresolved objections raised by
               human reviewers. Treat the conversation as more reliable than the ticket's literal
               acceptance criteria: if the thread shows the work was refined or explicitly accepted
               beyond the AC in a sound way, honor that.
            4. Independently review the diff in pr.diff. Do NOT rely on the hunks alone: use `git log`
               / `git show` on the branch to inspect commit history and grep for callers and related
               tests to judge impact. When the diff adds or changes image assets, check that they are
               provided at retina quality (e.g. a 2x asset or an `srcset`/`@2x` variant); flag raster
               images that ship only at 1x where a high-DPI version is expected. ${{ env.MIGRATION_DATA_RULE }}
            5. Enforce these BiggerPockets member-privacy rules and treat a genuine violation as a
               blocking issue:
               ${{ env.PRIVACY_RULES }}
            6. Validate which of Codex's findings are real (discard false positives), add any genuine
               issues Codex missed, and (when a ticket is available) judge genuine misses of the
               ticket's intent or clear scope creep — but give credit when the author went beyond the
               literal acceptance criteria in a sound way rather than flagging it as non-compliant.
            7. Decide ONE verdict. Be pragmatic: use "request_changes" only when there is at least one
               genuine, blocking issue; otherwise "approve". A change that exceeds the AC without
               breaking the ticket's intent is a reason to approve, not to block.

            Write a file named verdict.json in the current working directory with EXACTLY this shape:
              {"verdict": "approve" | "request_changes", "summary": "<concise markdown>"}
            In the summary, note which of Codex's findings you confirmed, anything you added, how the
            change measures against the ticket, how the existing PR discussion informed your decision,
            and the rationale for the decision.

      - name: Record claude end time
        if: always()
        run: echo "CLAUDE_END_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      - name: Submit review as BiggiePockets
        id: submit
        env:
          # PAT authenticating as the BiggiePockets service account. A bot cannot
          # approve its own PR, so this never gates BiggiePockets-authored PRs.
          GH_TOKEN: ${{ secrets.BIGGIEPOCKETS_PAT }}
        run: |
          if [ ! -f verdict.json ]; then
            echo "::error::Review did not produce verdict.json" >&2
            exit 1
          fi

          verdict=$(jq -r '.verdict' verdict.json)
          summary=$(jq -r '.summary' verdict.json)

          case "$verdict" in
            approve)
              gh pr review "$PR" --approve --body "$summary"
              ;;
            request_changes)
              gh pr review "$PR" --request-changes --body "$summary"
              ;;
            *)
              echo "::error::Unexpected verdict from review: '$verdict'" >&2
              exit 1
              ;;
          esac

      # Reports one LLM Obs trace per review run (root "workflow" span plus a
      # child "llm" span for each stage) so review quality is measurable over
      # time and attributable to the exact prompt_version that produced it.
      # Never blocks/fails/delays the review itself: runs even if a prior step
      # failed (if: always()), no-ops without a Datadog key, and any submission
      # error is a warning, not a job failure.
      - name: Report review metrics to Datadog LLM Obs
        if: always()
        continue-on-error: true
        env:
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
        run: |
          if [ -z "$DD_API_KEY" ]; then
            echo "Skipping Datadog LLM Obs submission: DATADOG_API_KEY not configured"
            exit 0
          fi

          now_ns=$(date +%s%N)
          review_start_ns="${REVIEW_START_NS:-$now_ns}"
          codex_start_ns="${CODEX_START_NS:-$review_start_ns}"
          codex_end_ns="${CODEX_END_NS:-$codex_start_ns}"
          claude_start_ns="${CLAUDE_START_NS:-$codex_end_ns}"
          claude_end_ns="${CLAUDE_END_NS:-$claude_start_ns}"

          verdict="unknown"
          verdict_summary=""
          if [ -f verdict.json ]; then
            verdict=$(jq -r '.verdict // "unknown"' verdict.json)
            verdict_summary=$(jq -r '.summary // ""' verdict.json)
          fi

          codex_status="ok"
          [ "${{ steps.codex.outcome }}" = "failure" ] && codex_status="error"
          codex_findings=$(cat codex-findings.md 2>/dev/null || true)
          codex_findings_lines=$(wc -l < codex-findings.md 2>/dev/null || echo 0)

          claude_status="ok"
          if [ "${{ steps.claude.outcome }}" != "success" ] || [ "$verdict" = "unknown" ]; then
            claude_status="error"
          fi

          root_status="ok"
          [ "${{ steps.submit.outcome }}" != "success" ] && root_status="error"

          # Cap free-text fields sent to Datadog so one outsized findings report can't
          # blow past the LLM Obs payload limit; the untruncated text is always still in
          # this step's own job logs.
          truncate() {
            local text="$1" max=4000
            if [ "${#text}" -gt "$max" ]; then
              printf '%s… [truncated %d chars]' "${text:0:$max}" "$((${#text} - max))"
            else
              printf '%s' "$text"
            fi
          }
          codex_findings_excerpt=$(truncate "$codex_findings")
          verdict_summary_excerpt=$(truncate "$verdict_summary")

          codex_model_tag="${CODEX_MODEL:-unspecified}"
          claude_model_tag="${CLAUDE_MODEL:-unspecified}"

          trace_id=$(openssl rand -hex 16)
          root_span_id=$(openssl rand -hex 8)
          codex_span_id=$(openssl rand -hex 8)
          claude_span_id=$(openssl rand -hex 8)

          payload=$(jq -n \
            --arg ml_app "biggiepockets-review" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg pr "$PR" \
            --arg prompt_version "$PROMPT_VERSION" \
            --arg verdict "$verdict" \
            --arg base_ref "${BASE_REF:-unknown}" \
            --arg codex_model "$codex_model_tag" \
            --arg claude_model "$claude_model_tag" \
            --arg trace_id "$trace_id" \
            --arg root_span_id "$root_span_id" \
            --arg codex_span_id "$codex_span_id" \
            --arg claude_span_id "$claude_span_id" \
            --argjson review_start_ns "$review_start_ns" \
            --argjson root_duration "$((now_ns - review_start_ns))" \
            --argjson codex_start_ns "$codex_start_ns" \
            --argjson codex_duration "$((codex_end_ns - codex_start_ns))" \
            --argjson claude_start_ns "$claude_start_ns" \
            --argjson claude_duration "$((claude_end_ns - claude_start_ns))" \
            --arg codex_status "$codex_status" \
            --arg claude_status "$claude_status" \
            --arg root_status "$root_status" \
            --argjson codex_findings_lines "$codex_findings_lines" \
            --arg codex_findings_excerpt "$codex_findings_excerpt" \
            --arg verdict_summary_excerpt "$verdict_summary_excerpt" \
            '{
              data: {
                type: "span",
                attributes: {
                  ml_app: $ml_app,
                  tags: [
                    "repo:\($repo)",
                    "pr:\($pr)",
                    "prompt_version:\($prompt_version)",
                    "verdict:\($verdict)",
                    "codex_model:\($codex_model)",
                    "claude_model:\($claude_model)",
                    "codex_findings_lines:\($codex_findings_lines)"
                  ],
                  spans: [
                    {
                      parent_id: "undefined",
                      trace_id: $trace_id,
                      span_id: $root_span_id,
                      name: "biggiepockets.review",
                      start_ns: $review_start_ns,
                      duration: $root_duration,
                      status: $root_status,
                      meta: {
                        kind: "workflow",
                        input: {value: "repo:\($repo) pr:\($pr) base_ref:\($base_ref)"},
                        output: {value: $verdict_summary_excerpt}
                      }
                    },
                    {
                      parent_id: $root_span_id,
                      trace_id: $trace_id,
                      span_id: $codex_span_id,
                      name: "codex.review",
                      start_ns: $codex_start_ns,
                      duration: $codex_duration,
                      status: $codex_status,
                      meta: {
                        kind: "llm",
                        model_name: $codex_model,
                        model_provider: "openai",
                        input: {messages: [{role: "user", content: "Review pr:\($pr) against ticket.json/pr.diff"}]},
                        output: {messages: [{role: "assistant", content: $codex_findings_excerpt}]}
                      }
                    },
                    {
                      parent_id: $root_span_id,
                      trace_id: $trace_id,
                      span_id: $claude_span_id,
                      name: "claude.synthesize",
                      start_ns: $claude_start_ns,
                      duration: $claude_duration,
                      status: $claude_status,
                      meta: {
                        kind: "llm",
                        model_name: $claude_model,
                        model_provider: "anthropic",
                        input: {messages: [{role: "user", content: $codex_findings_excerpt}]},
                        output: {messages: [{role: "assistant", content: $verdict_summary_excerpt}]}
                      }
                    }
                  ]
                }
              }
            }')

          http_code=$(curl -sS -o /tmp/dd_response.json -w '%{http_code}' \
            -X POST "https://api.datadoghq.com/api/intake/llm-obs/v1/trace/spans" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: $DD_API_KEY" \
            -d "$payload") || http_code="000"

          if [ "$http_code" -ge 300 ] 2>/dev/null || [ "$http_code" = "000" ]; then
            echo "::warning::Datadog LLM Obs submission failed (HTTP $http_code): $(cat /tmp/dd_response.json 2>/dev/null)"
          else
            echo "Reported review metrics to Datadog LLM Obs (trace $trace_id, verdict $verdict, prompt_version $PROMPT_VERSION, codex_model $codex_model_tag, claude_model $claude_model_tag)"
          fi
