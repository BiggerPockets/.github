name: BiggiePockets Code Review (reusable)

# Reusable AI review panel, anchored on the PR's JIRA ticket, with the BiggiePockets
# service account submitting the resulting approve / request-changes decision.
#
# A review runs in three stages:
#   1. Context     — gathers everything the panel judges against and uploads it as one
#                    immutable handoff: the diff, the PR itself (body, labels, commits,
#                    touched files), the PRs it is stacked on, the JIRA ticket and its
#                    acceptance criteria, that ticket's epic, the PR discussion, and any
#                    design references found in those texts. Whatever isn't available is recorded as unavailable, in
#                    context-manifest.json, so an auditor can tell "there is no epic" from
#                    "the epic fetch failed". No model reviews the code here: nothing
#                    reads the diff ahead of the panel, so no finding is planted in front
#                    of the auditors whose independence is the whole point.
#   2. Panel       — three auditors (caspar, balthazar, melchior) each audit the change
#                    INDEPENDENTLY, each in a job of its own named for the seat, all
#                    running the SAME auditor prompt, and each writing its own verdict.
#                    No auditor can see another's verdict: a seat's output is uploaded per
#                    seat and downloaded only by stage 3.
#   3. Arbitration — one arbitrator reads all three verdicts, verifies the blocking
#                    findings against the code, and issues the ONE verdict that is posted.
#                    It is the only stage whose output reaches the pull request.
#
# Callers own the triggers and gating (e.g. fire on review_requested when
# BiggiePockets is the requested reviewer) and pass the PR number as `pr`.
# Secrets are supplied by the caller via `secrets: inherit`:
#   OPENROUTER_API_KEY, JIRA_EMAIL, JIRA_API_TOKEN,
#   BIGGIEPOCKETS_PAT, DATADOG_API_KEY (optional; enables review-quality
#   metrics in Datadog LLM Obs).
#
# Models: every model-running stage's model is an OpenRouter slug pinned below and
# overrideable per repository without editing this workflow — set the matching Actions
# *variable* in the calling repo (Settings → Actions → Variables), which the `vars`
# context below reads. An unset or empty variable keeps the pinned default.
#   MAGI_MODEL_CASPAR     caspar        (default openai/gpt-5.6-luna)
#   MAGI_MODEL_BALTHAZAR  balthazar     (default google/gemini-3.7-flash)
#   MAGI_MODEL_MELCHIOR   melchior      (default z-ai/glm-5.3-flash)
#   ARBITER_MODEL         arbitration   (default openai/gpt-5.6-sol)
# Every seat carries its own model in its own job. There is no shared fallback on
# purpose: a seat quietly running the same model as another seat is a panel that has lost
# a voice while still reporting three verdicts, which is worse than a seat that fails and
# says so.
# The three seats run different models on purpose: the auditor prompt is identical, so
# what a disagreement between seats measures is the models, and three runs of one model
# would mostly agree trivially and leave the arbitrator nothing to weigh.
#
# Prompt versioning: both prompts live in this repo's prompts/ registry
# (BiggerPockets/.github) as versioned templates, plus one shared rule block per
# concern under prompts/_shared/ injected via {{@path}}. Prompts are resolved by
# scripts/resolve-prompts.sh into step outputs; a derived prompt_version (content hash)
# identifies each prompt in Datadog LLM Obs. Each LLM span also carries its template and
# variables under meta.input.prompt, which is what Datadog Prompt Tracking reads to group
# runs by prompt and version. The panel seats all resolve the SAME auditor prompt, so one
# prompt_name/prompt_version covers all three audit spans.
on:
  workflow_call:
    inputs:
      pr:
        description: 'PR number to review'
        required: true
        type: string
      registry_ref:
        description: >-
          Ref of BiggerPockets/.github to resolve review prompts/resolver from. Set it to
          the ref this workflow was called at (the value after `@` in
          `uses: BiggerPockets/.github/.github/workflows/...@<ref>`) so a caller pinned to
          a tag or SHA runs the exact prompt/resolver text that shipped with that workflow.
          Defaults to `main`, which is correct for callers that track `@main`; a caller that
          pins `uses:` MUST pass this explicitly or its prompts will silently drift to main.
        required: false
        default: main
        type: string

jobs:
  # Stage 1. Gathers every input the panel reads — the diff, the JIRA ticket, the PR
  # discussion — and uploads the lot as one immutable handoff. No model runs here: the
  # panel is the first thing that forms an opinion about the code.
  #
  # Separate from the panel jobs because GitHub can only re-run a failed JOB (not an
  # individual step): this boundary lets a rate-limited auditor be retried without
  # re-fetching the diff and ticket, and guarantees all three auditors judge the exact
  # same commit and context.
  #
  # NOTE for callers: this job was previously named `codex`. A repo that lists it as a
  # required status check must switch that check to `context`. The panel's checks were
  # likewise `audit (caspar)` and friends when the seats were matrix legs; they are now
  # `caspar`, `balthazar` and `melchior`.
  context:
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.pr_head.outputs.sha }}
      registry_sha: ${{ steps.registry_head.outputs.sha }}
    permissions:
      contents: read
      pull-requests: read
    env:
      PR: ${{ inputs.pr }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          fetch-depth: 0

      # Pin every later job to the exact commit this context was gathered from. This
      # matters when a failed audit or arbitration job is retried after the PR has
      # received another push.
      - name: Record PR head SHA
        id: pr_head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Prompt templates live in BiggerPockets/.github. Check out that repo at the ref the
      # caller passed via the registry_ref input, which defaults to main so a caller that
      # tracks @main works without setting it; a caller pinning a tag or SHA passes the
      # matching ref to run the prompt text that shipped with that workflow. Resolve the
      # ref from this input only — never from github.workflow_sha, which points at a commit
      # in the CALLER's repo and so is not a valid ref here.
      # GITHUB_TOKEN is scoped to the caller's repo, so use the BiggiePockets PAT.
      # persist-credentials is off so the PAT is never left in registry/.git/config where
      # the later model steps (which act on untrusted PR diffs and can read files/run
      # Bash) could read it — read-only prompts only need the checkout itself, not the
      # stored credentials.
      - name: Checkout prompt registry
        uses: actions/checkout@v4
        with:
          repository: BiggerPockets/.github
          ref: ${{ inputs.registry_ref }}
          token: ${{ secrets.BIGGIEPOCKETS_PAT }}
          persist-credentials: false
          path: registry

      - name: Record prompt registry SHA
        id: registry_head
        run: echo "sha=$(git -C registry rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record review start time
        run: echo "REVIEW_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      # Everything from here to the upload is context gathering. Each source writes one
      # artifact file and nothing more: no step reads another's output to form a view of
      # the code. A source that isn't there degrades to {"available": false, "reason": ...}
      # instead of failing the review — a PR with no ticket, no epic and no designs is
      # still reviewable, just with less to judge intent against.
      #
      # No artifact carries an author, assignee or reporter. The panel judges the change,
      # not who wrote it, and leaving identities out keeps them off the handoff and out of
      # telemetry. The PR discussion is the one exception: attribution is what makes
      # "a human reviewer objected and it was never resolved" legible.
      - name: Gather PR metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,baseRefName,headRefName,isDraft,labels,additions,deletions,changedFiles,commits,files \
            > pr-raw.json

          jq '{
            available: true,
            number, title, body,
            base_ref: .baseRefName,
            head_ref: .headRefName,
            draft: .isDraft,
            labels: [.labels[].name],
            additions, deletions,
            changed_files: .changedFiles,
            commits: [.commits[] | {message: .messageHeadline, body: .messageBody}],
            files: [.files[] | {path, additions, deletions}]
          }' pr-raw.json > pr.json

          base=$(jq -r '.base_ref' pr.json)
          echo "BASE_REF=$base" >> "$GITHUB_ENV"
          echo "Reviewing PR #$PR (base $base): $(jq -r '.title' pr.json)"

      - name: Compute PR diff
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git diff "origin/$BASE_REF...HEAD" > pr.diff
          echo "PR diff is $(wc -l < pr.diff) lines"

      # Walk down the stack. A PR whose base is not the default branch is usually stacked
      # on top of another PR, and pr.diff above is computed against that base — so the
      # diff is this PR's own changes only, and the branch it sits on contains work that
      # is itself under review and can still change.
      #
      # An auditor not told that reads a stacked PR wrongly in both directions: it blames
      # this PR for what the parent introduced, and it reports as missing the work the
      # parent already did. Always writes stack.json.
      - name: Walk the PR stack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          default=$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef -q .defaultBranchRef.name)
          base=$(jq -r '.base_ref' pr.json)

          note="pr.diff contains ONLY this PR's own changes, measured against its base branch."
          if [ "$base" = "$default" ]; then
            jq -n --arg default "$default" --arg base "$base" --arg note "$note" \
              '{available: true, stacked: false, reason: "the PR targets the default branch", default_branch: $default, base_ref: $base, depth: 0, ancestors: [], note: $note}' \
              > stack.json
            echo "PR targets the default branch ($default); not a stack."
            exit 0
          fi

          # Follow base -> the PR whose head is that base, until the default branch. The
          # depth cap and the seen-list are guards, not expectations: a retargeted branch
          # can leave a cycle behind, and a cycle here would hang the whole review.
          ancestors='[]'
          b="$base"
          seen=""
          depth=0
          while [ "$b" != "$default" ] && [ "$depth" -lt 10 ]; do
            case " $seen " in *" $b "*) echo "::warning::Stack walk revisited branch $b; stopping."; break;; esac
            seen="$seen $b"

            # An open PR for the branch is the one being stacked on; fall back to the most
            # recent closed one, which is how a just-merged parent still explains the base.
            num=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$b" --state all --limit 10 \
              --json number,state \
              -q '[.[] | select(.state == "OPEN")] + [.[]] | .[0].number // empty')
            if [ -z "$num" ]; then
              echo "No pull request has $b as its head; stopping the walk there."
              break
            fi

            gh pr view "$num" --repo "$GITHUB_REPOSITORY" \
              --json number,title,body,state,url,baseRefName,headRefName,additions,deletions,commits,files \
              > "stack-$num.json"

            ancestors=$(jq -n --argjson a "$ancestors" --slurpfile p "stack-$num.json" \
              '$a + [$p[0] | {
                number, title, body, state, url,
                base_ref: .baseRefName,
                head_ref: .headRefName,
                additions, deletions,
                ticket_key: ((.title | capture("(?<k>BIG-[0-9]+)").k) // null),
                commits: [.commits[] | .messageHeadline],
                files: [.files[] | .path]
              }]')

            b=$(jq -r '.baseRefName' "stack-$num.json")
            depth=$((depth + 1))
          done

          jq -n \
            --arg default "$default" \
            --arg base "$base" \
            --arg note "$note" \
            --argjson ancestors "$ancestors" \
            '{
              available: true,
              stacked: (($ancestors | length) > 0),
              reason: (if ($ancestors | length) > 0 then "the PR is stacked on unmerged work"
                       else "the base branch is not the default branch, but no pull request has it as its head" end),
              default_branch: $default,
              base_ref: $base,
              depth: ($ancestors | length),
              ancestors: $ancestors,
              note: $note
            }' > stack.json
          echo "Stack: base $base, default $default, $(jq -r '.depth' stack.json) ancestor PR(s) $(jq -r '[.ancestors[].number] | map("#" + tostring) | join(" <- ")' stack.json)"

      # Anchor the review on the work's intent. Always writes ticket.json: either the
      # ticket fields, or {"available": false} so a missing/unfetchable ticket degrades
      # to a diff-based review instead of failing the review. Also records the parent
      # key, which is what the epic step below fetches.
      - name: Fetch JIRA ticket for intent
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          key=$(jq -r '.title' pr.json | grep -oE 'BIG-[0-9]+' | head -1 || true)
          if [ -z "$key" ]; then
            echo '{"available": false, "reason": "no BIG-XXXXX key in PR title"}' > ticket.json
            echo "No JIRA ticket key in PR title; falling back to diff-based review."
            exit 0
          fi

          http=$(curl -sS -w '%{http_code}' -o ticket-raw.json \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -H 'Accept: application/json' \
            "https://biggerpockets.atlassian.net/rest/api/3/issue/$key?fields=summary,description,customfield_11557,status,issuetype,labels,parent,attachment") \
            || http="000"

          if [ "$http" = "200" ]; then
            jq --arg key "$key" '{
              available: true,
              key: $key,
              summary: .fields.summary,
              description: .fields.description,
              acceptance_criteria: .fields.customfield_11557,
              status: .fields.status.name,
              issue_type: .fields.issuetype.name,
              labels: .fields.labels,
              parent: (if .fields.parent then {key: .fields.parent.key, summary: .fields.parent.fields.summary, type: .fields.parent.fields.issuetype.name} else null end)
            }' ticket-raw.json > ticket.json
            echo "PARENT_KEY=$(jq -r '.parent.key // ""' ticket.json)" >> "$GITHUB_ENV"
            echo "Wrote ticket.json for $key"
          else
            echo "{\"available\": false, \"reason\": \"fetch failed (HTTP $http) for $key\"}" > ticket.json
            echo "Could not fetch $key (HTTP $http); falling back to diff-based review."
          fi

      # The epic is where the wider goal usually lives: a ticket's own description is
      # often a slice of work whose purpose only makes sense against the epic it belongs
      # to. Fetched separately because a ticket can have no parent, or a parent the token
      # can't read, and neither is a reason to fail a review.
      - name: Fetch the ticket's epic for wider intent
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          # Distinguish the three ways there can be no epic. "No epic" and "I could not
          # read the epic" are different pieces of evidence, and an auditor that cannot
          # tell them apart cannot say which one it judged without.
          if [ "$(jq -r '.available' ticket.json)" != "true" ]; then
            echo '{"available": false, "reason": "no ticket was available, so no epic to fetch"}' > epic.json
            echo "No ticket, so no epic to fetch."
            exit 0
          fi
          if [ -z "${PARENT_KEY:-}" ]; then
            echo '{"available": false, "reason": "ticket has no parent epic"}' > epic.json
            echo "No parent epic to fetch."
            exit 0
          fi

          http=$(curl -sS -w '%{http_code}' -o epic-raw.json \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -H 'Accept: application/json' \
            "https://biggerpockets.atlassian.net/rest/api/3/issue/$PARENT_KEY?fields=summary,description,issuetype,status,labels") \
            || http="000"

          if [ "$http" = "200" ]; then
            jq --arg key "$PARENT_KEY" '{
              available: true,
              key: $key,
              summary: .fields.summary,
              description: .fields.description,
              issue_type: .fields.issuetype.name,
              status: .fields.status.name,
              labels: .fields.labels
            }' epic-raw.json > epic.json
            echo "Wrote epic.json for $PARENT_KEY"
          else
            echo "{\"available\": false, \"reason\": \"fetch failed (HTTP $http) for $PARENT_KEY\"}" > epic.json
            echo "Could not fetch parent $PARENT_KEY (HTTP $http)."
          fi

      # Gather the existing PR discussion so the review accounts for context that lives
      # in conversation rather than the diff: general comments, inline review threads, and
      # prior review bodies. Always writes conversations.json (empty arrays if none).
      - name: Fetch PR conversations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          comments=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -q '[.[] | {author: .user.login, created_at, body}]' | jq -s 'add // []')
          review_comments=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" \
            -q '[.[] | {author: .user.login, path, line, created_at, body}]' | jq -s 'add // []')
          reviews=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            -q '[.[] | select(.body != "") | {author: .user.login, state, submitted_at, body}]' | jq -s 'add // []')

          jq -n \
            --argjson comments "$comments" \
            --argjson review_comments "$review_comments" \
            --argjson reviews "$reviews" \
            '{issue_comments: $comments, review_comments: $review_comments, reviews: $reviews}' \
            > conversations.json
          echo "Wrote conversations.json ($(jq '.issue_comments | length' conversations.json) comments, $(jq '.review_comments | length' conversations.json) review comments, $(jq '.reviews | length' conversations.json) reviews)"

      # Design references, harvested from the text already gathered above — the PR body
      # and commit messages, the ticket and epic (description and acceptance criteria
      # included, since a Figma link is usually pasted into one of them), and the
      # discussion — plus the ticket's own attachments.
      #
      # Links are RECORDED, never followed. The panel has no Figma credentials, and
      # pulling design or member-facing content into a review artifact is not something a
      # code review needs. What a recorded link buys the auditors is the knowledge that a
      # design exists for this work, which is the difference between "no design was
      # specified" and "a design was specified and I can't see it".
      - name: Collect design references
        run: |
          # Every URL appearing anywhere in one of the context files. `..|strings` walks
          # the whole document, which is what reaches Atlassian Document Format nodes
          # without having to know their shape.
          # `|| true` because "this file contains no URLs" is the ordinary case, and grep
          # exits 1 on no match — without it a ticket with no links would fail the step.
          urls_from() { # file source-label
            [ -f "$1" ] || return 0
            jq -r '[.. | strings] | .[]' "$1" 2>/dev/null \
              | grep -oE 'https?://[^][ )"'"'"'<>,]+' \
              | sed 's/[.,;:)]*$//' \
              | sort -u \
              | jq -R --arg source "$2" '{url: ., source: $source}' || true
          }

          { urls_from pr.json pr
            urls_from stack.json stack
            urls_from ticket.json ticket
            urls_from epic.json epic
            urls_from conversations.json discussion
          } | jq -s '.' > urls.json

          if [ -f ticket-raw.json ]; then
            jq '[.fields.attachment // [] | .[] | {filename, mime_type: .mimeType, size, url: .content, source: "ticket"}]' \
              ticket-raw.json > attachments.json
          else
            echo '[]' > attachments.json
          fi

          # Keep only URLs that are plausibly a design artifact. An unclassified link is
          # dropped rather than listed: a designs.json full of Jira and CI links would
          # bury the one Figma URL that matters.
          jq -n \
            --slurpfile urls urls.json \
            --slurpfile attachments attachments.json \
            '
            def kind:
              if test("figma\\.com") then "figma"
              elif test("zeplin\\.io|invisionapp\\.com|sketch\\.com|miro\\.com|framer\\.com|abstract\\.com") then "design_tool"
              elif test("loom\\.com|youtube\\.com|youtu\\.be|vimeo\\.com") then "walkthrough_video"
              elif test("user-attachments|user-images\\.githubusercontent\\.com") then "screenshot"
              elif test("\\.(png|jpe?g|gif|webp|svg|pdf)([?#]|$)") then "image"
              else empty end;
            # One entry per URL, listing every place it appeared: the same Figma link is
            # usually in the ticket AND the PR body AND the discussion, and three copies
            # of one link say nothing that one link with three sources does not.
            ($urls[0]
              | map(. + {kind: (.url | kind)})
              | group_by(.url)
              | map({url: .[0].url, kind: .[0].kind, sources: (map(.source) | unique)})
            ) as $links
            | ($attachments[0]) as $att
            | {
                available: ((($links | length) + ($att | length)) > 0),
                links: $links,
                attachments: $att,
                note: "Links and attachments are recorded, not fetched: this review has no credentials for design tools. Treat a reference as evidence that a design exists for this work, not as something you can open, and never treat an unopenable reference as a defect."
              }' > designs.json
          echo "Wrote designs.json ($(jq '.links | length' designs.json) link(s), $(jq '.attachments | length' designs.json) attachment(s))"

      # One file that says what the panel actually got. Without it an auditor cannot tell
      # "there is no epic for this work" from "the epic fetch failed", and both read as
      # silence — which is how a review ends up judging intent against nothing and not
      # saying so.
      - name: Write the context manifest
        run: |
          jq -n \
            --arg head_sha "${{ steps.pr_head.outputs.sha }}" \
            --arg base_ref "$BASE_REF" \
            --argjson diff_lines "$(wc -l < pr.diff | tr -d " ")" \
            --slurpfile pr pr.json \
            --slurpfile stack stack.json \
            --slurpfile ticket ticket.json \
            --slurpfile epic epic.json \
            --slurpfile conversations conversations.json \
            --slurpfile designs designs.json \
            '{
              head_sha: $head_sha,
              base_ref: $base_ref,
              diff: {file: "pr.diff", lines: $diff_lines},
              pr: {file: "pr.json", available: true, commits: ($pr[0].commits | length), files: ($pr[0].files | length)},
              stack: {file: "stack.json", stacked: $stack[0].stacked, depth: $stack[0].depth, default_branch: $stack[0].default_branch, ancestors: [$stack[0].ancestors[].number]},
              ticket: {file: "ticket.json", available: $ticket[0].available, key: ($ticket[0].key // null), reason: ($ticket[0].reason // null), has_acceptance_criteria: ((($ticket[0].acceptance_criteria // {}) | [.. | objects | select(.type == "text") | .text] | length) > 0)},
              epic: {file: "epic.json", available: $epic[0].available, key: ($epic[0].key // null), reason: ($epic[0].reason // null)},
              conversations: {file: "conversations.json", issue_comments: ($conversations[0].issue_comments | length), review_comments: ($conversations[0].review_comments | length), reviews: ($conversations[0].reviews | length)},
              designs: {file: "designs.json", available: $designs[0].available, links: ($designs[0].links | length), attachments: ($designs[0].attachments | length)}
            }' > context-manifest.json
          cat context-manifest.json

      # Resolve the prompts from the registry — the single auditor prompt every seat runs
      # and the arbitrator prompt — each with its shared-rule blocks expanded and a
      # content-derived prompt_version. Also emits the panel seats, which the arbitrator
      # uses to know how many verdicts to expect.
      - name: Resolve review prompts
        id: resolve
        env:
          REGISTRY_DIR: registry
        run: registry/scripts/resolve-prompts.sh

      # Persist the handoff. Every auditor consumes the same diff, ticket, epic,
      # discussion and design references, on every retry.
      # No `if: always()` on this or the upload: a stage that failed part-way through
      # must not hand the panel a half-built context. Fail here and the whole review
      # stops, which is the correct outcome.
      - name: Record context metadata
        run: |
          {
            echo "BASE_REF=$BASE_REF"
            echo "REVIEW_START_NS=$REVIEW_START_NS"
            echo "CONTEXT_END_NS=$(date +%s%N)"
          } > review-context.env

      # The raw API responses (and the per-ancestor stack-<n>.json the walk fetched) are
      # deliberately NOT uploaded: they carry fields nobody reviews (assignee, reporter,
      # watchers) and the reshaped files above are what the prompts are written against.
      - name: Upload review handoff
        uses: actions/upload-artifact@v4
        with:
          name: review-context-${{ github.run_id }}
          path: |
            pr.diff
            pr.json
            stack.json
            ticket.json
            epic.json
            conversations.json
            designs.json
            context-manifest.json
            review-context.env
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Stage 2. Three wise men, three jobs, one prompt.
  #
  # Each seat is its own job, written out rather than fanned out from a matrix, so a seat
  # is an independent unit end to end: its own runner, its own model, its own status check
  # (`caspar`, `balthazar`, `melchior`), re-runnable on its own without touching the
  # others. The only thing a seat can read is stage 1's handoff — nothing available to an
  # auditor contains another auditor's output, which is what makes the three verdicts
  # independent rather than merely concurrent.
  #
  # The three `steps:` blocks below are BYTE-IDENTICAL on purpose. Everything that differs
  # between seats lives in the `env:` above them, so what a disagreement between seats
  # measures is the models — a difference in harness would corrupt that comparison, and
  # three copies of a block is exactly the kind of thing that drifts. Validation of that
  # invariant is not left to reviewers: .github/workflows/validate-prompts.yml fails if
  # the blocks stop matching, or if the set of seat jobs stops matching the registry.
  #
  # The model step is continue-on-error so a rate-limited seat still records a status for
  # the arbitrator instead of taking the whole review down with it.
  caspar:
    needs: context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write # claude-code-action authenticates via OIDC
    env:
      PR: ${{ inputs.pr }}
      AUDITOR: caspar
      AUDITOR_MODEL: ${{ vars.MAGI_MODEL_CASPAR || 'openai/gpt-5.6-luna' }}
    steps:
      - name: Checkout reviewed PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.head_sha }}
          fetch-depth: 0

      - name: Checkout prompt registry
        uses: actions/checkout@v4
        with:
          repository: BiggerPockets/.github
          ref: ${{ needs.context.outputs.registry_sha }}
          token: ${{ secrets.BIGGIEPOCKETS_PAT }}
          persist-credentials: false
          path: registry

      # The whole of stage 1: the diff, the PR, the ticket, its epic, the discussion, the
      # design references, and the manifest saying which of those were available.
      - name: Download review handoff
        uses: actions/download-artifact@v4
        with:
          name: review-context-${{ github.run_id }}
          path: .

      - name: Restore review context
        run: cat review-context.env >> "$GITHUB_ENV"

      # Resolve again from the same pinned registry ref. Prompt text stays out of job
      # outputs (which are size-limited), while the artifact carries all model inputs.
      - name: Resolve review prompts
        id: resolve
        env:
          REGISTRY_DIR: registry
        run: registry/scripts/resolve-prompts.sh

      # A seat with no model is a lost voice, not a fallback — fail before the panel can
      # report a verdict short of a seat it claimed to have.
      - name: Confirm seat model
        run: |
          if [ -z "$AUDITOR_MODEL" ]; then
            echo "::error::Auditor '$AUDITOR' has no model: set MAGI_MODEL_$(printf '%s' "$AUDITOR" | tr '[:lower:]-' '[:upper:]_') as a repository variable, or give this job a default." >&2
            exit 1
          fi
          echo "Auditor $AUDITOR runs $AUDITOR_MODEL"

      - name: Record audit start time
        run: echo "AUDIT_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      - name: Audit independently
        id: audit
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          # The action requires this input for launch validation. ANTHROPIC_AUTH_TOKEN
          # below is what makes Claude Code send the OpenRouter key as a bearer token.
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # Allow the `claude` bot to trigger this review. Without this, PRs opened
          # by the claude bot are rejected with "Workflow initiated by non-human
          # actor: claude (type: Bot). Add bot to allowed_bots list."
          allowed_bots: 'claude'
          claude_args: '--allowedTools "Read,Grep,Glob,Bash,Write" --model ${{ env.AUDITOR_MODEL }}'
          prompt: ${{ steps.resolve.outputs.auditor_prompt }}
        env:
          ANTHROPIC_BASE_URL: "https://openrouter.ai/api"
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}

      # Name the verdict for its seat before it leaves this job. The arbitrator reads
      # audit-<seat>.json, and a seat that produced no usable verdict must be visible as
      # such rather than absent: the recorded status is what stops a failed seat from
      # being mistaken for a silent approval.
      - name: Record seat verdict
        if: always()
        run: |
          audit_end_ns=$(date +%s%N)
          status="ok"
          [ "${{ steps.audit.outcome }}" != "success" ] && status="error"

          if [ -f verdict.json ] && jq -e '.verdict == "approve" or .verdict == "request_changes"' verdict.json >/dev/null 2>&1; then
            mv verdict.json "audit-$AUDITOR.json"
            echo "$AUDITOR: $(jq -r '.verdict' "audit-$AUDITOR.json") (confidence $(jq -r '.confidence // "unstated"' "audit-$AUDITOR.json"), $(jq -r '.blocking_findings // [] | length' "audit-$AUDITOR.json") blocking finding(s))"
          else
            status="error"
            rm -f verdict.json
            echo "::warning::Auditor $AUDITOR produced no valid verdict.json; the arbitrator will arbitrate without this seat."
          fi

          # Shell-safe seat name so the arbitrator can source every seat's file at once.
          key=$(printf '%s' "$AUDITOR" | tr '[:lower:]-' '[:upper:]_')
          {
            echo "AUDIT_${key}_START_NS=${AUDIT_START_NS:-$audit_end_ns}"
            echo "AUDIT_${key}_END_NS=$audit_end_ns"
            echo "AUDIT_${key}_STATUS=$status"
            echo "AUDIT_${key}_MODEL=$AUDITOR_MODEL"
          } > "audit-$AUDITOR.env"

      - name: Upload seat verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ env.AUDITOR }}-${{ github.run_id }}
          path: |
            audit-${{ env.AUDITOR }}.json
            audit-${{ env.AUDITOR }}.env
          if-no-files-found: error
          retention-days: 7
          overwrite: true

