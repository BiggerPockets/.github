name: BiggiePockets Code Review (reusable)

# Reusable AI review panel, anchored on the PR's JIRA ticket, with the BiggiePockets
# service account submitting the resulting approve / request-changes decision.
#
# A review runs in three stages:
#   1. First pass  — Codex reads the diff against the ticket and writes leads to
#                    codex-findings.md.
#   2. Panel       — three auditors (caspar, balthazar, melchior) each audit the change
#                    INDEPENDENTLY, in separate jobs, running the SAME auditor prompt,
#                    and each writes its own verdict. No auditor can see another's
#                    verdict: a seat's output is uploaded per seat and downloaded only by
#                    stage 3.
#   3. Arbitration — one arbitrator reads all three verdicts, verifies the blocking
#                    findings against the code, and issues the ONE verdict that is posted.
#                    It is the only stage whose output reaches the pull request.
#
# Callers own the triggers and gating (e.g. fire on review_requested when
# BiggiePockets is the requested reviewer) and pass the PR number as `pr`.
# Secrets are supplied by the caller via `secrets: inherit`:
#   OPENROUTER_API_KEY, JIRA_EMAIL, JIRA_API_TOKEN,
#   BIGGIEPOCKETS_PAT, DATADOG_API_KEY (optional; enables review-quality
#   metrics in Datadog LLM Obs).
#
# Models: every stage's model is an OpenRouter slug pinned below and overrideable per
# repository without editing this workflow — set the matching Actions *variable* in the
# calling repo (Settings → Actions → Variables), which the `vars` context below reads.
# An unset or empty variable keeps the pinned default.
#   CODEX_MODEL           first pass    (default openai/gpt-5.6-sol)
#   MAGI_MODEL_CASPAR     caspar        (default openai/gpt-5.6-luna)
#   MAGI_MODEL_BALTHAZAR  balthazar     (default google/gemini-3.7-flash)
#   MAGI_MODEL_MELCHIOR   melchior      (default z-ai/glm-5.3-flash)
#   MAGI_MODEL_DEFAULT    any seat with no default and no override of its own
#   ARBITER_MODEL         arbitration   (default openai/gpt-5.6-sol)
# The three seats run different models on purpose: the auditor prompt is identical, so
# what a disagreement between seats measures is the models, and three runs of one model
# would mostly agree trivially and leave the arbitrator nothing to weigh.
#
# Prompt versioning: every prompt lives in this repo's prompts/ registry
# (BiggerPockets/.github) as a versioned template, plus one shared rule block per
# concern under prompts/_shared/ injected via {{@path}}. Prompts are resolved by
# scripts/resolve-prompts.sh into step outputs; a derived prompt_version (content hash)
# identifies each prompt in Datadog LLM Obs. Each LLM span also carries its template and
# variables under meta.input.prompt, which is what Datadog Prompt Tracking reads to group
# runs by prompt and version. The panel seats all resolve the SAME auditor prompt, so one
# prompt_name/prompt_version covers all three audit spans.
on:
  workflow_call:
    inputs:
      pr:
        description: 'PR number to review'
        required: true
        type: string
      registry_ref:
        description: >-
          Ref of BiggerPockets/.github to resolve review prompts/resolver from. Set it to
          the ref this workflow was called at (the value after `@` in
          `uses: BiggerPockets/.github/.github/workflows/...@<ref>`) so a caller pinned to
          a tag or SHA runs the exact prompt/resolver text that shipped with that workflow.
          Defaults to `main`, which is correct for callers that track `@main`; a caller that
          pins `uses:` MUST pass this explicitly or its prompts will silently drift to main.
        required: false
        default: main
        type: string

jobs:
  # Stage 1. Gathers every input the panel reads and runs the Codex first pass, then
  # uploads the lot as one immutable handoff. Separate from the panel jobs because GitHub
  # can only re-run a failed JOB (not an individual step): this boundary lets a
  # rate-limited auditor be retried without paying for another Codex pass or re-fetching
  # the diff, and guarantees all three auditors judge the exact same commit and context.
  #
  # Job id stays `codex` so a repo that has this stage as a required status check keeps
  # matching it.
  codex:
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.pr_head.outputs.sha }}
      registry_sha: ${{ steps.registry_head.outputs.sha }}
      auditors: ${{ steps.resolve.outputs.auditors }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write # claude-code-action authenticates via OIDC
    env:
      PR: ${{ inputs.pr }}
      # The first pass runs through OpenRouter, so its model must be an OpenRouter model
      # slug and must be set explicitly — Codex's own default model name is not one
      # OpenRouter accepts.
      CODEX_MODEL: ${{ vars.CODEX_MODEL || 'openai/gpt-5.6-sol' }}
      CODEX_RESPONSES_ENDPOINT: "https://openrouter.ai/api/v1/responses"
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          fetch-depth: 0

      # Pin every later job to the exact commit the first pass read. This matters when a
      # failed audit or arbitration job is retried after the PR has received another push.
      - name: Record PR head SHA
        id: pr_head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Prompt templates live in BiggerPockets/.github. Check out that repo at the ref the
      # caller passed via the registry_ref input, which defaults to main so a caller that
      # tracks @main works without setting it; a caller pinning a tag or SHA passes the
      # matching ref to run the prompt text that shipped with that workflow. Resolve the
      # ref from this input only — never from github.workflow_sha, which points at a commit
      # in the CALLER's repo and so is not a valid ref here.
      # GITHUB_TOKEN is scoped to the caller's repo, so use the BiggiePockets PAT.
      # persist-credentials is off so the PAT is never left in registry/.git/config where
      # the later model steps (which act on untrusted PR diffs and can read files/run
      # Bash) could read it — read-only prompts only need the checkout itself, not the
      # stored credentials.
      - name: Checkout prompt registry
        uses: actions/checkout@v4
        with:
          repository: BiggerPockets/.github
          ref: ${{ inputs.registry_ref }}
          token: ${{ secrets.BIGGIEPOCKETS_PAT }}
          persist-credentials: false
          path: registry

      - name: Record prompt registry SHA
        id: registry_head
        run: echo "sha=$(git -C registry rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record review start time
        run: echo "REVIEW_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      # Resolve PR context (base ref and title) from the API.
      - name: Resolve PR context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName -q .baseRefName)
          title=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title -q .title)
          echo "BASE_REF=$base" >> "$GITHUB_ENV"
          echo "PR_TITLE=$title" >> "$GITHUB_ENV"
          echo "Reviewing PR #$PR (base $base): $title"

      - name: Compute PR diff
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git diff "origin/$BASE_REF...HEAD" > pr.diff
          echo "PR diff is $(wc -l < pr.diff) lines"

      # Anchor the review on the work's intent. Always writes ticket.json: either the
      # ticket fields, or {"available": false} so a missing/unfetchable ticket degrades
      # to a diff-based review instead of failing the review.
      - name: Fetch JIRA ticket for intent
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          key=$(printf '%s' "$PR_TITLE" | grep -oE 'BIG-[0-9]+' | head -1 || true)
          if [ -z "$key" ]; then
            echo '{"available": false, "reason": "no BIG-XXXXX key in PR title"}' > ticket.json
            echo "No JIRA ticket key in PR title; falling back to diff-based review."
            exit 0
          fi

          http=$(curl -sS -w '%{http_code}' -o ticket-raw.json \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -H 'Accept: application/json' \
            "https://biggerpockets.atlassian.net/rest/api/3/issue/$key?fields=summary,description,customfield_11557") \
            || http="000"

          if [ "$http" = "200" ]; then
            jq --arg key "$key" '{available: true, key: $key, summary: .fields.summary, description: .fields.description, acceptance_criteria: .fields.customfield_11557}' \
              ticket-raw.json > ticket.json
            echo "Wrote ticket.json for $key"
          else
            echo "{\"available\": false, \"reason\": \"fetch failed (HTTP $http) for $key\"}" > ticket.json
            echo "Could not fetch $key (HTTP $http); falling back to diff-based review."
          fi

      # Gather the existing PR discussion so the review accounts for context that lives
      # in conversation rather than the diff: general comments, inline review threads, and
      # prior review bodies. Always writes conversations.json (empty arrays if none).
      - name: Fetch PR conversations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          comments=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -q '[.[] | {author: .user.login, created_at, body}]' | jq -s 'add // []')
          review_comments=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" \
            -q '[.[] | {author: .user.login, path, line, created_at, body}]' | jq -s 'add // []')
          reviews=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            -q '[.[] | select(.body != "") | {author: .user.login, state, submitted_at, body}]' | jq -s 'add // []')

          jq -n \
            --argjson comments "$comments" \
            --argjson review_comments "$review_comments" \
            --argjson reviews "$reviews" \
            '{issue_comments: $comments, review_comments: $review_comments, reviews: $reviews}' \
            > conversations.json
          echo "Wrote conversations.json ($(jq '.issue_comments | length' conversations.json) comments, $(jq '.review_comments | length' conversations.json) review comments, $(jq '.reviews | length' conversations.json) reviews)"

      # Resolve the prompts from the registry — the first-pass prompt, the single auditor
      # prompt every seat runs, and the arbitrator prompt — each with its shared-rule
      # blocks expanded and a content-derived prompt_version. Also emits the panel seats,
      # which drive the audit job's fan-out matrix.
      - name: Resolve review prompts
        id: resolve
        env:
          REGISTRY_DIR: registry
        run: registry/scripts/resolve-prompts.sh

      # Stage 1: Codex reviews the diff against the ticket intent and writes leads to
      # codex-findings.md (the `output-file`, which captures Codex's final message). The
      # panel treats these as leads to verify, not conclusions to adopt.
      #
      # Codex reviews the diff directly here rather than shelling out to the `codex review`
      # subcommand. `codex review` starts its own in-process app-server that needs both a
      # writable runtime home AND a localhost connection to the action's Responses API proxy.
      # When it was launched as a child of `codex exec`, that child inherited the exec sandbox,
      # which grants neither by default: under `sandbox: read-only` it died writing runtime
      # state ("failed to initialize in-process app-server client: Read-only file system
      # (os error 30)"), and under a writable profile it then died reaching the proxy
      # ("stream disconnected before completion: error sending request for url
      # http://127.0.0.1.../v1/responses"), because that profile grants filesystem writes but
      # no network. Either way Codex produced no findings and every review silently degraded to
      # a panel-only pass. Reviewing inline via this step's own `codex exec` model call avoids
      # the nested subprocess entirely: it needs only to read files, so a read-only sandbox is
      # sufficient and there is no child process to sandbox.
      #
      # continue-on-error keeps a Codex failure (e.g. an OpenAI "Quota exceeded" error) from
      # blocking the review: the panel proceeds on its own when codex-findings.md is missing or
      # empty. The next step still surfaces the failure as a warning so a genuinely broken Codex
      # (e.g. a bad key) doesn't silently disappear.
      - name: Record codex start time
        run: echo "CODEX_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      - name: Codex first-pass review
        id: codex
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          responses-api-endpoint: ${{ env.CODEX_RESPONSES_ENDPOINT }}
          model: ${{ env.CODEX_MODEL }}
          sandbox: read-only
          output-file: codex-findings.md
          prompt: ${{ steps.resolve.outputs.codex_prompt }}

      # If Codex failed (it exits nonzero and writes no codex-findings.md — e.g. on a quota
      # error), leave an empty findings file so the panel cleanly takes its no-findings path,
      # and record a warning for observability.
      - name: Note skipped Codex first pass
        if: steps.codex.outcome == 'failure'
        run: |
          echo "::warning::Codex first-pass review failed (commonly an OpenAI quota error); continuing with a panel-only review."
          : > codex-findings.md

      # Persist the handoff even when Codex failed. Every auditor consumes the same diff,
      # ticket/discussion context, and (possibly empty) findings, on every retry.
      - name: Record Codex completion metadata
        if: always()
        run: |
          codex_end_ns=$(date +%s%N)
          echo "CODEX_END_NS=$codex_end_ns" >> "$GITHUB_ENV"
          {
            echo "BASE_REF=$BASE_REF"
            echo "REVIEW_START_NS=$REVIEW_START_NS"
            echo "CODEX_START_NS=$CODEX_START_NS"
            echo "CODEX_END_NS=$codex_end_ns"
            echo "CODEX_STATUS=${{ steps.codex.outcome }}"
            echo "CODEX_MODEL_USED=$CODEX_MODEL"
          } > review-context.env
          touch codex-findings.md

      - name: Upload review handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-context-${{ github.run_id }}
          path: |
            pr.diff
            ticket.json
            conversations.json
            codex-findings.md
            review-context.env
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Stage 2. One job per panel seat, fanned out over the seats the registry declares.
  # Separate jobs are what make the audits independent: each runs on its own runner, sees
  # only the stage-1 handoff, and writes only its own verdict. Nothing an auditor can read
  # contains another auditor's output.
  #
  # fail-fast is off so one seat's failure doesn't cancel the others mid-audit, and the
  # model step is continue-on-error so a rate-limited seat still leaves a recorded status
  # for the arbitrator. "Re-run failed jobs" re-runs only the seats that failed.
  audit:
    needs: codex
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        auditor: ${{ fromJSON(needs.codex.outputs.auditors) }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write # claude-code-action authenticates via OIDC
    env:
      PR: ${{ inputs.pr }}
      AUDITOR: ${{ matrix.auditor }}
      # One OpenRouter slug per seat, each overrideable by the matching repository
      # variable. MAGI_MODEL_DEFAULT only catches a seat added to registry.json that has
      # no entry here, so a new seat runs rather than failing the matrix.
      MAGI_MODEL_CASPAR: ${{ vars.MAGI_MODEL_CASPAR || 'openai/gpt-5.6-luna' }}
      MAGI_MODEL_BALTHAZAR: ${{ vars.MAGI_MODEL_BALTHAZAR || 'google/gemini-3.7-flash' }}
      MAGI_MODEL_MELCHIOR: ${{ vars.MAGI_MODEL_MELCHIOR || 'z-ai/glm-5.3-flash' }}
      MAGI_MODEL_DEFAULT: ${{ vars.MAGI_MODEL_DEFAULT || 'google/gemini-3.7-flash' }}
    steps:
      - name: Checkout reviewed PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.codex.outputs.head_sha }}
          fetch-depth: 0

      - name: Checkout prompt registry
        uses: actions/checkout@v4
        with:
          repository: BiggerPockets/.github
          ref: ${{ needs.codex.outputs.registry_sha }}
          token: ${{ secrets.BIGGIEPOCKETS_PAT }}
          persist-credentials: false
          path: registry

      - name: Download review handoff
        uses: actions/download-artifact@v4
        with:
          name: review-context-${{ github.run_id }}
          path: .

      - name: Restore review context
        run: cat review-context.env >> "$GITHUB_ENV"

      # Resolve again from the same pinned registry ref. Prompt text stays out of job
      # outputs (which are size-limited), while the artifact carries all model inputs.
      - name: Resolve review prompts
        id: resolve
        env:
          REGISTRY_DIR: registry
        run: registry/scripts/resolve-prompts.sh

      # Look the seat's model up by name rather than hard-coding a model per matrix leg,
      # so adding a seat to registry.json needs no change here and an override is a
      # repository variable rather than a workflow edit.
      - name: Select seat model
        id: seat
        run: |
          var="MAGI_MODEL_$(printf '%s' "$AUDITOR" | tr '[:lower:]-' '[:upper:]_')"
          model="${!var:-}"
          if [ -z "$model" ]; then model="$MAGI_MODEL_DEFAULT"; fi
          if [ -z "$model" ]; then
            echo "::error::No model resolved for auditor '$AUDITOR' (set $var or MAGI_MODEL_DEFAULT)" >&2
            exit 1
          fi
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "Auditor $AUDITOR runs $model"

      - name: Record audit start time
        run: echo "AUDIT_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      # The auditor prompt is identical for every seat — the resolver emits it once and
      # substitutes nothing seat-specific — so the three audits differ only by model and
      # by the independent judgment of the run.
      - name: Audit independently
        id: audit
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          # The action requires this input for launch validation. ANTHROPIC_AUTH_TOKEN
          # below is what makes Claude Code send the OpenRouter key as a bearer token.
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # Allow the `claude` bot to trigger this review. Without this, PRs opened
          # by the claude bot are rejected with "Workflow initiated by non-human
          # actor: claude (type: Bot). Add bot to allowed_bots list."
          allowed_bots: 'claude'
          claude_args: '--allowedTools "Read,Grep,Glob,Bash,Write" --model ${{ steps.seat.outputs.model }}'
          prompt: ${{ steps.resolve.outputs.auditor_prompt }}
        env:
          ANTHROPIC_BASE_URL: "https://openrouter.ai/api"
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}

      # Name the verdict for its seat before it leaves this job. The arbitrator reads
      # audit-<seat>.json, and a seat that produced no usable verdict must be visible as
      # such rather than absent: the recorded status is what stops a failed seat from
      # being mistaken for a silent approval.
      - name: Record seat verdict
        if: always()
        run: |
          audit_end_ns=$(date +%s%N)
          status="ok"
          [ "${{ steps.audit.outcome }}" != "success" ] && status="error"

          if [ -f verdict.json ] && jq -e '.verdict == "approve" or .verdict == "request_changes"' verdict.json >/dev/null 2>&1; then
            mv verdict.json "audit-$AUDITOR.json"
            echo "$AUDITOR: $(jq -r '.verdict' "audit-$AUDITOR.json") (confidence $(jq -r '.confidence // "unstated"' "audit-$AUDITOR.json"), $(jq -r '.blocking_findings // [] | length' "audit-$AUDITOR.json") blocking finding(s))"
          else
            status="error"
            rm -f verdict.json
            echo "::warning::Auditor $AUDITOR produced no valid verdict.json; the arbitrator will arbitrate without this seat."
          fi

          # Shell-safe seat name so the arbitrator can source every seat's file at once.
          key=$(printf '%s' "$AUDITOR" | tr '[:lower:]-' '[:upper:]_')
          {
            echo "AUDIT_${key}_START_NS=$AUDIT_START_NS"
            echo "AUDIT_${key}_END_NS=$audit_end_ns"
            echo "AUDIT_${key}_STATUS=$status"
            echo "AUDIT_${key}_MODEL=${{ steps.seat.outputs.model }}"
          } > "audit-$AUDITOR.env"

      - name: Upload seat verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.auditor }}-${{ github.run_id }}
          path: |
            audit-${{ matrix.auditor }}.json
            audit-${{ matrix.auditor }}.env
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Stage 3. Weighs the three verdicts and issues the one that gets posted.
  arbitrate:
    needs: [codex, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write # claude-code-action authenticates via OIDC
    env:
      PR: ${{ inputs.pr }}
      ARBITER_MODEL: ${{ vars.ARBITER_MODEL || 'openai/gpt-5.6-sol' }}
    steps:
      - name: Checkout reviewed PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.codex.outputs.head_sha }}
          fetch-depth: 0

      - name: Checkout prompt registry
        uses: actions/checkout@v4
        with:
          repository: BiggerPockets/.github
          ref: ${{ needs.codex.outputs.registry_sha }}
          token: ${{ secrets.BIGGIEPOCKETS_PAT }}
          persist-credentials: false
          path: registry

      - name: Download review handoff
        uses: actions/download-artifact@v4
        with:
          name: review-context-${{ github.run_id }}
          path: .

      # Every seat's artifact flattened into the working directory. Filenames carry the
      # seat name, so merging can't collide, and this is the first and only place in the
      # run where more than one auditor's verdict exists together.
      - name: Download panel verdicts
        uses: actions/download-artifact@v4
        with:
          pattern: audit-*-${{ github.run_id }}
          merge-multiple: true
          path: .

      - name: Restore review context
        run: |
          cat review-context.env >> "$GITHUB_ENV"
          for f in audit-*.env; do [ -f "$f" ] && cat "$f" >> "$GITHUB_ENV"; done
          true

      - name: Resolve review prompts
        id: resolve
        env:
          REGISTRY_DIR: registry
        run: registry/scripts/resolve-prompts.sh

      # A panel that lost most of its seats isn't a panel. Arbitrating over one verdict
      # would quietly turn a three-auditor review into a single-reviewer one, so require
      # a majority of seats to have produced a verdict and fail loudly otherwise — the
      # failed audit jobs can then be re-run without repeating stage 1.
      - name: Check panel quorum
        env:
          AUDITOR_COUNT: ${{ steps.resolve.outputs.auditor_count }}
        run: |
          seats=$(ls audit-*.json 2>/dev/null | wc -l | tr -d ' ')
          quorum=$(( AUDITOR_COUNT / 2 + 1 ))
          echo "PANEL_SEATS_REPORTING=$seats" >> "$GITHUB_ENV"
          echo "PANEL_SEATS_DECLARED=$AUDITOR_COUNT" >> "$GITHUB_ENV"
          if [ "$seats" -lt "$quorum" ]; then
            echo "::error::Only $seats of $AUDITOR_COUNT auditors produced a verdict (quorum $quorum); re-run the failed audit jobs." >&2
            exit 1
          fi
          if [ "$seats" -lt "$AUDITOR_COUNT" ]; then
            echo "::warning::Arbitrating over $seats of $AUDITOR_COUNT auditors."
          fi
          for f in audit-*.json; do
            echo "$f -> $(jq -r '.verdict' "$f") (confidence $(jq -r '.confidence // "unstated"' "$f"))"
          done

      - name: Record arbitration start time
        run: echo "ARBITER_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      - name: Arbitrate the panel
        id: arbiter
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          allowed_bots: 'claude'
          claude_args: '--allowedTools "Read,Grep,Glob,Bash,Write" --model ${{ env.ARBITER_MODEL }}'
          prompt: ${{ steps.resolve.outputs.arbiter_prompt }}
        env:
          ANTHROPIC_BASE_URL: "https://openrouter.ai/api"
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Record arbitration end time
        if: always()
        run: echo "ARBITER_END_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      # Summarize how the panel split and whether arbitration went with it. This is the
      # number worth watching: an arbitrator that never departs from the majority is a
      # vote counter, and one that always does is ignoring the panel.
      - name: Summarize panel outcome
        if: always()
        run: |
          # Count with jq, not grep: the verdict is read from the parsed document, so a
          # seat whose JSON is pretty-printed differently still counts.
          approve=0; changes=0; seat_verdicts=""
          for f in audit-*.json; do
            [ -f "$f" ] || continue
            seat="${f#audit-}"; seat="${seat%.json}"
            v=$(jq -r '.verdict' "$f")
            c=$(jq -r '.confidence // "unstated"' "$f")
            case "$v" in
              approve) approve=$((approve + 1)) ;;
              request_changes) changes=$((changes + 1)) ;;
            esac
            seat_verdicts="${seat_verdicts:+$seat_verdicts,}$seat=$v/$c"
          done

          echo "PANEL_APPROVE=$approve" >> "$GITHUB_ENV"
          echo "PANEL_REQUEST_CHANGES=$changes" >> "$GITHUB_ENV"
          # The seat-by-seat record, so a disagreement can be read back from telemetry
          # without opening the run.
          echo "PANEL_SEAT_VERDICTS=${seat_verdicts:-none}" >> "$GITHUB_ENV"

          if [ "$approve" -gt 0 ] && [ "$changes" -gt 0 ]; then
            agreement="split"
          elif [ "$changes" -gt 0 ]; then
            agreement="unanimous_request_changes"
          elif [ "$approve" -gt 0 ]; then
            agreement="unanimous_approve"
          else
            agreement="none"
          fi
          echo "PANEL_AGREEMENT=$agreement" >> "$GITHUB_ENV"
          echo "Panel: $approve approve, $changes request changes ($agreement) — ${seat_verdicts:-none}"

      - name: Submit review as BiggiePockets
        id: submit
        env:
          # PAT authenticating as the BiggiePockets service account. A bot cannot
          # approve its own PR, so this never gates BiggiePockets-authored PRs.
          GH_TOKEN: ${{ secrets.BIGGIEPOCKETS_PAT }}
        run: |
          if [ ! -f verdict.json ]; then
            echo "::error::Arbitration did not produce verdict.json" >&2
            exit 1
          fi

          verdict=$(jq -r '.verdict' verdict.json)
          summary=$(jq -r '.summary' verdict.json)

          printf '## BiggiePockets assisted review\n\n%s\n' "$summary" > review-body.md

          case "$verdict" in
            approve)
              gh pr review "$PR" --approve --body-file review-body.md
              ;;
            request_changes)
              gh pr review "$PR" --request-changes --body-file review-body.md
              ;;
            *)
              echo "::error::Unexpected verdict from arbitration: '$verdict'" >&2
              exit 1
              ;;
          esac

          echo "VERDICT=$verdict" >> "$GITHUB_ENV"

          # Whether arbitration followed the panel majority, computed here so the tag
          # reflects the verdict actually posted. A tie has no majority to follow or
          # depart from — which is exactly when the arbitrator is doing the deciding — so
          # record that as its own value rather than scoring it as an override.
          approve="${PANEL_APPROVE:-0}"
          changes="${PANEL_REQUEST_CHANGES:-0}"
          if [ "$changes" -gt "$approve" ]; then
            majority="request_changes"
          elif [ "$approve" -gt "$changes" ]; then
            majority="approve"
          else
            majority="none"
          fi

          if [ "$majority" = "none" ]; then
            followed="no_majority"
          elif [ "$verdict" = "$majority" ]; then
            followed="true"
          else
            followed="false"
          fi
          echo "ARBITER_FOLLOWED_PANEL=$followed" >> "$GITHUB_ENV"
          echo "Panel majority: $majority; arbitrated verdict: $verdict (followed=$followed)"

      # Reports ONE LLM OBS TRACE per review, joined by a stable run_id (repo + pr +
      # review attempt) so offline evals and panel ratings line up per review. Never
      # blocks/fails/delays the review itself.
      #
      #   root biggiepockets.review
      #     ├── codex.review
      #     ├── magi.audit.<seat>   (one span per auditor)
      #     └── magi.arbitrate
      #
      # The span tree is where a seat's individual verdict lives; the payload tags carry
      # the panel-level outcome (agreement, split, whether arbitration followed the
      # majority), which is what makes "is the panel earning its cost?" a query rather
      # than a manual read of run logs.
      - name: Report review metrics to Datadog LLM Obs
        if: always()
        continue-on-error: true
        env:
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          CODEX_PROMPT_TEMPLATE: ${{ steps.resolve.outputs.codex_prompt_template }}
          AUDITOR_PROMPT_TEMPLATE: ${{ steps.resolve.outputs.auditor_prompt_template }}
          ARBITER_PROMPT_TEMPLATE: ${{ steps.resolve.outputs.arbiter_prompt_template }}
          AUDITORS_JSON: ${{ steps.resolve.outputs.auditors }}
        run: |
          if [ -z "$DD_API_KEY" ]; then
            echo "Skipping Datadog LLM Obs submission: DATADOG_API_KEY not configured"
            exit 0
          fi

          now_ns=$(date +%s%N)
          review_start_ns="${REVIEW_START_NS:-$now_ns}"
          codex_start_ns="${CODEX_START_NS:-$review_start_ns}"
          codex_end_ns="${CODEX_END_NS:-$codex_start_ns}"
          arbiter_start_ns="${ARBITER_START_NS:-$codex_end_ns}"
          arbiter_end_ns="${ARBITER_END_NS:-$arbiter_start_ns}"

          verdict="${VERDICT:-unknown}"
          codex_prompt_name="${{ steps.resolve.outputs.codex_prompt_name }}"
          codex_prompt_version="${{ steps.resolve.outputs.codex_prompt_version }}"
          auditor_prompt_name="${{ steps.resolve.outputs.auditor_prompt_name }}"
          auditor_prompt_version="${{ steps.resolve.outputs.auditor_prompt_version }}"
          arbiter_prompt_name="${{ steps.resolve.outputs.arbiter_prompt_name }}"
          arbiter_prompt_version="${{ steps.resolve.outputs.arbiter_prompt_version }}"

          codex_status="ok"
          [ "${CODEX_STATUS:-failure}" != "success" ] && codex_status="error"
          codex_findings=$(cat codex-findings.md 2>/dev/null || true)
          codex_findings_lines=$(wc -l < codex-findings.md 2>/dev/null || echo 0)

          arbiter_status="ok"
          [ "${{ steps.arbiter.outcome }}" != "success" ] && arbiter_status="error"

          root_status="ok"
          [ "${{ steps.submit.outcome }}" != "success" ] && root_status="error"

          summary=""
          [ -f verdict.json ] && summary=$(jq -r '.summary // ""' verdict.json 2>/dev/null) || summary=""

          # Cap free-text fields sent to Datadog so one outsized findings report can't
          # blow past the LLM Obs payload limit; the untruncated text is always still in
          # this step's own job logs.
          truncate() {
            local text="$1" max=4000
            if [ "${#text}" -gt "$max" ]; then
              printf '%s… [truncated %d chars]' "${text:0:$max}" "$((${#text} - max))"
            else
              printf '%s' "$text"
            fi
          }
          codex_findings_excerpt=$(truncate "$codex_findings")
          summary_excerpt=$(truncate "$summary")

          # Prompt Tracking: each LLM span carries the registry template that produced it,
          # under meta.input.prompt. The template keeps its {{PR}}/{{PROMPT_NAME}}/
          # {{PROMPT_VERSION}}/{{AUDITORS}} placeholders and the substituted values ride
          # along as `variables`, so every PR's run lands on the same prompt in Datadog
          # instead of registering a new template per PR. `version` is our content-derived
          # hash, so a prompt edit (a Roll) is what starts a new version.
          auditor_list=$(printf '%s' "$AUDITORS_JSON" | jq -r 'join(", ")')
          prompt_json() { # name version template -> Prompt object
            jq -n \
              --arg name "$1" \
              --arg version "$2" \
              --arg template "$3" \
              --arg pr "$PR" \
              --arg auditors "$auditor_list" \
              '{
                id: $name,
                name: $name,
                version: $version,
                template: $template,
                # Report only the placeholders this template actually uses, so the
                # variables list matches what a Playground replay needs to render it.
                variables: (
                  {PR: $pr, PROMPT_NAME: $name, PROMPT_VERSION: $version, AUDITORS: $auditors}
                  | with_entries(select(.key as $k | $template | contains("{{" + $k + "}}")))
                )
              }'
          }
          codex_prompt_obj=$(prompt_json "$codex_prompt_name" "$codex_prompt_version" "$CODEX_PROMPT_TEMPLATE")
          auditor_prompt_obj=$(prompt_json "$auditor_prompt_name" "$auditor_prompt_version" "$AUDITOR_PROMPT_TEMPLATE")
          arbiter_prompt_obj=$(prompt_json "$arbiter_prompt_name" "$arbiter_prompt_version" "$ARBITER_PROMPT_TEMPLATE")

          codex_model_tag="${CODEX_MODEL_USED:-unspecified}"
          arbiter_model_tag="${ARBITER_MODEL:-unspecified}"

          run_id="$GITHUB_REPOSITORY-pr$PR-${{ github.run_id }}"

          trace_id=$(openssl rand -hex 16)
          root_span_id=$(openssl rand -hex 8)
          codex_span_id=$(openssl rand -hex 8)
          arbiter_span_id=$(openssl rand -hex 8)

          # One span per seat, built from that seat's own recorded verdict and timing, so
          # a disagreement is inspectable per auditor in the trace instead of collapsed
          # into the arbitrated result.
          audit_spans="[]"
          seat_tags="[]"
          for f in audit-*.json; do
            [ -f "$f" ] || continue
            seat="${f#audit-}"; seat="${seat%.json}"
            key=$(printf '%s' "$seat" | tr '[:lower:]-' '[:upper:]_')
            eval "s_start=\${AUDIT_${key}_START_NS:-$codex_end_ns}"
            eval "s_end=\${AUDIT_${key}_END_NS:-\$s_start}"
            eval "s_status=\${AUDIT_${key}_STATUS:-error}"
            eval "s_model=\${AUDIT_${key}_MODEL:-unspecified}"
            [ "$s_status" = "ok" ] || s_status="error"
            s_verdict=$(jq -r '.verdict // "unknown"' "$f")
            s_confidence=$(jq -r '.confidence // "unstated"' "$f")
            s_findings=$(jq -r '.blocking_findings // [] | length' "$f")
            s_summary=$(truncate "$(jq -r '.summary // ""' "$f")")

            audit_spans=$(jq -n \
              --argjson spans "$audit_spans" \
              --arg trace_id "$trace_id" \
              --arg parent_id "$root_span_id" \
              --arg span_id "$(openssl rand -hex 8)" \
              --arg seat "$seat" \
              --arg model "$s_model" \
              --arg status "$s_status" \
              --arg summary "$s_summary" \
              --arg pr "$PR" \
              --argjson prompt "$auditor_prompt_obj" \
              --argjson start_ns "$s_start" \
              --argjson duration "$((s_end - s_start))" \
              '$spans + [{
                parent_id: $parent_id,
                trace_id: $trace_id,
                span_id: $span_id,
                name: "magi.audit.\($seat)",
                start_ns: $start_ns,
                duration: $duration,
                status: $status,
                meta: {
                  kind: "llm",
                  model_name: $model,
                  model_provider: "openrouter",
                  input: {
                    messages: [{role: "user", content: "Audit pr:\($pr) independently as \($seat)"}],
                    prompt: $prompt
                  },
                  output: {messages: [{role: "assistant", content: $summary}]}
                }
              }]')

            seat_tags=$(jq -n --argjson t "$seat_tags" \
              --arg seat "$seat" --arg v "$s_verdict" --arg c "$s_confidence" \
              --arg m "$s_model" --arg n "$s_findings" \
              '$t + [
                "auditor_verdict.\($seat):\($v)",
                "auditor_confidence.\($seat):\($c)",
                "auditor_model.\($seat):\($m)",
                "auditor_blocking_findings.\($seat):\($n)"
              ]')
          done

          fixed_spans=$(jq -n \
            --arg trace_id "$trace_id" \
            --arg root_span_id "$root_span_id" \
            --arg codex_span_id "$codex_span_id" \
            --arg arbiter_span_id "$arbiter_span_id" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg pr "$PR" \
            --arg base_ref "${BASE_REF:-unknown}" \
            --arg codex_model "$codex_model_tag" \
            --arg arbiter_model "$arbiter_model_tag" \
            --argjson review_start_ns "$review_start_ns" \
            --argjson root_duration "$((now_ns - review_start_ns))" \
            --argjson codex_start_ns "$codex_start_ns" \
            --argjson codex_duration "$((codex_end_ns - codex_start_ns))" \
            --argjson arbiter_start_ns "$arbiter_start_ns" \
            --argjson arbiter_duration "$((arbiter_end_ns - arbiter_start_ns))" \
            --arg codex_status "$codex_status" \
            --arg arbiter_status "$arbiter_status" \
            --arg root_status "$root_status" \
            --arg codex_findings_excerpt "$codex_findings_excerpt" \
            --arg summary_excerpt "$summary_excerpt" \
            --arg seat_verdicts "${PANEL_SEAT_VERDICTS:-none}" \
            --argjson codex_prompt "$codex_prompt_obj" \
            --argjson arbiter_prompt "$arbiter_prompt_obj" \
            '[
              {
                parent_id: "undefined",
                trace_id: $trace_id,
                span_id: $root_span_id,
                name: "biggiepockets.review",
                start_ns: $review_start_ns,
                duration: $root_duration,
                status: $root_status,
                meta: {
                  kind: "workflow",
                  input: {value: "repo:\($repo) pr:\($pr) base_ref:\($base_ref)"},
                  output: {value: $summary_excerpt}
                }
              },
              {
                parent_id: $root_span_id,
                trace_id: $trace_id,
                span_id: $codex_span_id,
                name: "codex.review",
                start_ns: $codex_start_ns,
                duration: $codex_duration,
                status: $codex_status,
                meta: {
                  kind: "llm",
                  model_name: $codex_model,
                  model_provider: "openrouter",
                  input: {
                    messages: [{role: "user", content: "Review pr:\($pr) against ticket.json/pr.diff"}],
                    prompt: $codex_prompt
                  },
                  output: {messages: [{role: "assistant", content: $codex_findings_excerpt}]}
                }
              },
              {
                parent_id: $root_span_id,
                trace_id: $trace_id,
                span_id: $arbiter_span_id,
                name: "magi.arbitrate",
                start_ns: $arbiter_start_ns,
                duration: $arbiter_duration,
                status: $arbiter_status,
                meta: {
                  kind: "llm",
                  model_name: $arbiter_model,
                  model_provider: "openrouter",
                  input: {
                    messages: [{role: "user", content: "Panel verdicts: \($seat_verdicts)"}],
                    prompt: $arbiter_prompt
                  },
                  output: {messages: [{role: "assistant", content: $summary_excerpt}]}
                }
              }
            ]')

          spans=$(jq -n --argjson fixed "$fixed_spans" --argjson audits "$audit_spans" '$fixed + $audits')

          payload=$(jq -n \
            --arg ml_app "biggiepockets-review" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg pr "$PR" \
            --arg run_id "$run_id" \
            --arg verdict "$verdict" \
            --arg agreement "${PANEL_AGREEMENT:-unknown}" \
            --arg followed "${ARBITER_FOLLOWED_PANEL:-unknown}" \
            --arg approve "${PANEL_APPROVE:-0}" \
            --arg changes "${PANEL_REQUEST_CHANGES:-0}" \
            --arg reporting "${PANEL_SEATS_REPORTING:-0}" \
            --arg declared "${PANEL_SEATS_DECLARED:-0}" \
            --arg auditor_prompt_name "$auditor_prompt_name" \
            --arg auditor_prompt_version "$auditor_prompt_version" \
            --arg arbiter_prompt_name "$arbiter_prompt_name" \
            --arg arbiter_prompt_version "$arbiter_prompt_version" \
            --arg arbiter_model "$arbiter_model_tag" \
            --arg codex_model "$codex_model_tag" \
            --arg codex_prompt_name "$codex_prompt_name" \
            --arg codex_prompt_version "$codex_prompt_version" \
            --argjson codex_findings_lines "$codex_findings_lines" \
            --argjson seat_tags "$seat_tags" \
            --argjson spans "$spans" \
            '{
              data: {
                type: "span",
                attributes: {
                  ml_app: $ml_app,
                  tags: ([
                    "repo:\($repo)",
                    "pr:\($pr)",
                    "run_id:\($run_id)",
                    "verdict:\($verdict)",
                    "panel_agreement:\($agreement)",
                    "arbiter_followed_panel:\($followed)",
                    "panel_approve:\($approve)",
                    "panel_request_changes:\($changes)",
                    "panel_seats_reporting:\($reporting)",
                    "panel_seats_declared:\($declared)",
                    "auditor_prompt_name:\($auditor_prompt_name)",
                    "auditor_prompt_version:\($auditor_prompt_version)",
                    "arbiter_prompt_name:\($arbiter_prompt_name)",
                    "arbiter_prompt_version:\($arbiter_prompt_version)",
                    "arbiter_model:\($arbiter_model)",
                    "codex_model:\($codex_model)",
                    "codex_findings_lines:\($codex_findings_lines)",
                    "codex_prompt_name:\($codex_prompt_name)",
                    "codex_prompt_version:\($codex_prompt_version)"
                  ] + $seat_tags),
                  spans: $spans
                }
              }
            }')

          http_code=$(curl -sS -o /tmp/dd_response.json -w '%{http_code}' \
            -X POST "https://api.datadoghq.com/api/intake/llm-obs/v1/trace/spans" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: $DD_API_KEY" \
            -d "$payload") || http_code="000"

          if [ "$http_code" -ge 300 ] 2>/dev/null || [ "$http_code" = "000" ]; then
            echo "::warning::Datadog LLM Obs submission failed (HTTP $http_code): $(cat /tmp/dd_response.json 2>/dev/null)"
          else
            echo "Reported panel to Datadog LLM Obs (trace ${trace_id}, agreement ${PANEL_AGREEMENT:-unknown}, verdict ${verdict}, run_id ${run_id})"
          fi
