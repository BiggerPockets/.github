name: BiggiePockets Code Review (reusable)

# Reusable two-stage AI review (Codex first pass, then Claude verifies and
# synthesizes) anchored on the PR's JIRA ticket, with the BiggiePockets service
# account submitting the resulting approve / request-changes decision.
#
# Callers own the triggers and gating (e.g. fire on review_requested when
# BiggiePockets is the requested reviewer) and pass the PR number as `pr`.
# Secrets are supplied by the caller via `secrets: inherit`:
#   OPENROUTER_API_KEY, CLAUDE_CODE_OAUTH_TOKEN, JIRA_EMAIL, JIRA_API_TOKEN,
#   BIGGIEPOCKETS_PAT, DATADOG_API_KEY (optional; enables review-quality
#   metrics in Datadog LLM Obs).
#
# Prompt versioning: every review-stage prompt lives in this repo's prompts/
# registry (BiggerPockets/.github) as a versioned template, plus one shared rule
# block per concern under prompts/_shared/ injected via {{@path}}.
# Prompts are resolved by scripts/resolve-prompts.sh into step outputs; a derived
# prompt_version (content hash) identifies each prompt in Datadog LLM Obs. Each LLM
# span also carries its template and variables under meta.input.prompt, which is what
# Datadog Prompt Tracking reads to group runs by prompt and version.
#
# Prompt A/B test (BIG-21717): prompts/registry.json declares the arms, the control
# arm, and what share of pull requests an experiment arm gets. Each review runs ONE
# Claude pass, using the arm that scripts/resolve-prompts.sh assigns to that PR by
# hashing '<repo>:<pr>' — so the arms are compared BETWEEN pull requests and a review
# never costs a second Claude pass. The assigned arm writes both the posted summary
# and the approve / request-changes decision, which means an experiment prompt does
# affect real outcomes on its share of PRs. Assignment is deterministic, so a re-run
# reviews with the same arm. Set experiment_split_percent to 0 in registry.json to
# route everything to the control arm; every consuming repo reads that one file.
on:
  workflow_call:
    inputs:
      pr:
        description: 'PR number to review'
        required: true
        type: string
      registry_ref:
        description: >-
          Ref of BiggerPockets/.github to resolve review prompts/resolver from. Set it to
          the ref this workflow was called at (the value after `@` in
          `uses: BiggerPockets/.github/.github/workflows/...@<ref>`) so a caller pinned to
          a tag or SHA runs the exact prompt/resolver text that shipped with that workflow.
          Defaults to `main`, which is correct for callers that track `@main`; a caller that
          pins `uses:` MUST pass this explicitly or its prompts will silently drift to main.
        required: false
        default: main
        type: string
      dry_run:
        description: >-
          Run the review without submitting it. The verdict is uploaded as a
          `review-verdict-pr<pr>` artifact instead of being posted, which is what the
          prompt evals in the registry's evals/ use to score the prompts against pull
          requests whose correct outcome is already known. Everything upstream of the
          submit step is unchanged on purpose: an eval that runs a different pipeline
          measures a different pipeline.
        required: false
        default: false
        type: boolean

jobs:
  # Codex and Claude intentionally run in separate jobs. GitHub can only re-run a
  # failed job (not an individual step), so this boundary lets a rate-limited Claude
  # run be retried without paying for another Codex pass.
  codex:
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.pr_head.outputs.sha }}
      registry_sha: ${{ steps.registry_head.outputs.sha }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write # claude-code-action authenticates via OIDC
    env:
      PR: ${{ inputs.pr }}
      # Explicit model per stage, threaded into both the actual invocation below and the
      # Datadog LLM Obs tags/spans at the bottom of this job. Empty means "let the tool
      # use its own default" (today's behavior, unchanged). Set these once you want a
      # specific model pinned and reliably visible in telemetry — e.g. when Codex is
      # pointed at a non-default model — instead of an implicit, untracked default.
      # The Codex stage runs through OpenRouter, so its model must be an OpenRouter
      # model slug and must be set explicitly — Codex's own default model name is not
      # one OpenRouter accepts.
      CODEX_MODEL: "openai/gpt-5.6-sol"
      CODEX_RESPONSES_ENDPOINT: "https://openrouter.ai/api/v1/responses"
      CLAUDE_MODEL: "claude-opus-5"
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          fetch-depth: 0

      # Pin the Claude job to the exact commit Codex reviewed. This matters when a
      # failed Claude job is retried after the PR has received another push.
      - name: Record PR head SHA
        id: pr_head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Prompt templates live in BiggerPockets/.github. Check out that repo at the ref the
      # caller passed via the registry_ref input, which defaults to main so a caller that
      # tracks @main works without setting it; a caller pinning a tag or SHA passes the
      # matching ref to run the prompt text that shipped with that workflow. Resolve the
      # ref from this input only — never from github.workflow_sha, which points at a commit
      # in the CALLER's repo and so is not a valid ref here.
      # GITHUB_TOKEN is scoped to the caller's repo, so use the BiggiePockets PAT.
      # persist-credentials is off so the PAT is never left in registry/.git/config where
      # the later Codex/Claude steps (which act on untrusted PR diffs and can read files/run
      # Bash) could read it — read-only prompts only need the checkout itself, not the
      # stored credentials.
      - name: Checkout prompt registry
        uses: actions/checkout@v4
        with:
          repository: BiggerPockets/.github
          ref: ${{ inputs.registry_ref }}
          token: ${{ secrets.BIGGIEPOCKETS_PAT }}
          persist-credentials: false
          path: registry

      - name: Record prompt registry SHA
        id: registry_head
        run: echo "sha=$(git -C registry rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record review start time
        run: echo "REVIEW_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      # Resolve PR context (base ref and title) from the API.
      - name: Resolve PR context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName -q .baseRefName)
          title=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title -q .title)
          echo "BASE_REF=$base" >> "$GITHUB_ENV"
          echo "PR_TITLE=$title" >> "$GITHUB_ENV"
          echo "Reviewing PR #$PR (base $base): $title"

      - name: Compute PR diff
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git diff "origin/$BASE_REF...HEAD" > pr.diff
          echo "PR diff is $(wc -l < pr.diff) lines"

      # Anchor the review on the work's intent. Always writes ticket.json: either the
      # ticket fields, or {"available": false} so a missing/unfetchable ticket degrades
      # to a diff-based review instead of failing the review.
      - name: Fetch JIRA ticket for intent
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          key=$(printf '%s' "$PR_TITLE" | grep -oE 'BIG-[0-9]+' | head -1 || true)
          if [ -z "$key" ]; then
            echo '{"available": false, "reason": "no BIG-XXXXX key in PR title"}' > ticket.json
            echo "No JIRA ticket key in PR title; falling back to diff-based review."
            exit 0
          fi

          http=$(curl -sS -w '%{http_code}' -o ticket-raw.json \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -H 'Accept: application/json' \
            "https://biggerpockets.atlassian.net/rest/api/3/issue/$key?fields=summary,description,customfield_11557") \
            || http="000"

          if [ "$http" = "200" ]; then
            jq --arg key "$key" '{available: true, key: $key, summary: .fields.summary, description: .fields.description, acceptance_criteria: .fields.customfield_11557}' \
              ticket-raw.json > ticket.json
            echo "Wrote ticket.json for $key"
          else
            echo "{\"available\": false, \"reason\": \"fetch failed (HTTP $http) for $key\"}" > ticket.json
            echo "Could not fetch $key (HTTP $http); falling back to diff-based review."
          fi

      # Gather the existing PR discussion so the review accounts for context that lives
      # in conversation rather than the diff: general comments, inline review threads, and
      # prior review bodies. Always writes conversations.json (empty arrays if none).
      - name: Fetch PR conversations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          comments=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -q '[.[] | {author: .user.login, created_at, body}]' | jq -s 'add // []')
          review_comments=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" \
            -q '[.[] | {author: .user.login, path, line, created_at, body}]' | jq -s 'add // []')
          reviews=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            -q '[.[] | select(.body != "") | {author: .user.login, state, submitted_at, body}]' | jq -s 'add // []')

          jq -n \
            --argjson comments "$comments" \
            --argjson review_comments "$review_comments" \
            --argjson reviews "$reviews" \
            '{issue_comments: $comments, review_comments: $review_comments, reviews: $reviews}' \
            > conversations.json
          echo "Wrote conversations.json ($(jq '.issue_comments | length' conversations.json) comments, $(jq '.review_comments | length' conversations.json) review comments, $(jq '.reviews | length' conversations.json) reviews)"

      # Resolve the review-stage prompts from the registry: the Codex prompt, plus the
      # prompt of the single arm this PR is assigned to, each with its shared-rule blocks
      # expanded and a content-derived prompt_version. Also emits the assigned arm's key
      # and the bucket it was assigned from.
      - name: Resolve review prompts
        id: resolve
        env:
          REGISTRY_DIR: registry
        run: registry/scripts/resolve-prompts.sh

      # Stage 1: Codex reviews the diff against the ticket intent and writes findings to
      # codex-findings.md (the `output-file`, which captures Codex's final message).
      #
      # Codex reviews the diff directly here rather than shelling out to the `codex review`
      # subcommand. `codex review` starts its own in-process app-server that needs both a
      # writable runtime home AND a localhost connection to the action's Responses API proxy.
      # When it was launched as a child of `codex exec`, that child inherited the exec sandbox,
      # which grants neither by default: under `sandbox: read-only` it died writing runtime
      # state ("failed to initialize in-process app-server client: Read-only file system
      # (os error 30)"), and under a writable profile it then died reaching the proxy
      # ("stream disconnected before completion: error sending request for url
      # http://127.0.0.1.../v1/responses"), because that profile grants filesystem writes but
      # no network. Either way Codex produced no findings and every review silently degraded to
      # a Claude-only pass. Reviewing inline via this step's own `codex exec` model call avoids
      # the nested subprocess entirely: it needs only to read files, so a read-only sandbox is
      # sufficient and there is no child process to sandbox.
      #
      # continue-on-error keeps a Codex failure (e.g. an OpenAI "Quota exceeded" error) from
      # blocking the review: Stage 2 proceeds on its own when codex-findings.md is missing or
      # empty. The next step still surfaces the failure as a warning so a genuinely broken Codex
      # (e.g. a bad key) doesn't silently disappear.
      - name: Record codex start time
        run: echo "CODEX_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      - name: Codex first-pass review
        id: codex
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          responses-api-endpoint: ${{ env.CODEX_RESPONSES_ENDPOINT }}
          model: ${{ env.CODEX_MODEL }}
          sandbox: read-only
          output-file: codex-findings.md
          prompt: ${{ steps.resolve.outputs.codex_prompt }}

      # If Codex failed (it exits nonzero and writes no codex-findings.md — e.g. on a quota
      # error), leave an empty findings file so Stage 2 cleanly takes its no-findings path,
      # and record a warning for observability.
      - name: Note skipped Codex first pass
        if: steps.codex.outcome == 'failure'
        run: |
          echo "::warning::Codex first-pass review failed (commonly an OpenAI quota error); continuing with a Claude-only review."
          : > codex-findings.md

      # Persist the handoff even when Codex failed. Claude consumes the same diff,
      # ticket/discussion context, and (possibly empty) findings on every retry.
      - name: Record Codex completion metadata
        if: always()
        run: |
          codex_end_ns=$(date +%s%N)
          echo "CODEX_END_NS=$codex_end_ns" >> "$GITHUB_ENV"
          {
            echo "BASE_REF=$BASE_REF"
            echo "REVIEW_START_NS=$REVIEW_START_NS"
            echo "CODEX_START_NS=$CODEX_START_NS"
            echo "CODEX_END_NS=$codex_end_ns"
            echo "CODEX_STATUS=${{ steps.codex.outcome }}"
          } > review-context.env
          touch codex-findings.md

      - name: Upload Codex review handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-${{ github.run_id }}
          path: |
            pr.diff
            ticket.json
            conversations.json
            codex-findings.md
            review-context.env
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # A failed/rate-limited Claude run can be retried with "Re-run failed jobs". The
  # successful Codex job is not re-executed; this job downloads its immutable handoff.
  claude:
    needs: codex
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write # claude-code-action authenticates via OIDC
    env:
      PR: ${{ inputs.pr }}
      CODEX_MODEL: "openai/gpt-5.6-sol"
      CLAUDE_MODEL: "claude-opus-5"
    steps:
      - name: Checkout reviewed PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.codex.outputs.head_sha }}
          fetch-depth: 0

      - name: Checkout prompt registry
        uses: actions/checkout@v4
        with:
          repository: BiggerPockets/.github
          ref: ${{ needs.codex.outputs.registry_sha }}
          token: ${{ secrets.BIGGIEPOCKETS_PAT }}
          persist-credentials: false
          path: registry

      - name: Download Codex review handoff
        uses: actions/download-artifact@v4
        with:
          name: codex-review-${{ github.run_id }}
          path: .

      - name: Restore review context
        run: cat review-context.env >> "$GITHUB_ENV"

      # Resolve again from the same pinned registry ref. Prompt text stays out of job
      # outputs (which are size-limited), while the artifact carries all model inputs.
      - name: Resolve review prompts
        id: resolve
        env:
          REGISTRY_DIR: registry
        run: registry/scripts/resolve-prompts.sh

      # Stage 2: Claude verifies Codex's findings, reviews independently, and decides.
      # This is the only Claude pass, running whichever arm's prompt was assigned to
      # this PR. Its verdict is the review.
      - name: Record Claude start time
        run: echo "CLAUDE_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      - name: Claude verify and synthesize
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Allow the `claude` bot to trigger this review. Without this, PRs opened
          # by the claude bot are rejected with "Workflow initiated by non-human
          # actor: claude (type: Bot). Add bot to allowed_bots list."
          allowed_bots: 'claude'
          claude_args: ${{ env.CLAUDE_MODEL != '' && format('--allowedTools "Read,Grep,Glob,Bash,Write" --model {0}', env.CLAUDE_MODEL) || '--allowedTools "Read,Grep,Glob,Bash,Write"' }}
          prompt: ${{ steps.resolve.outputs.arm_prompt }}

      - name: Record Claude end time
        if: always()
        run: echo "CLAUDE_END_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      # Submit the review under the arm this PR was assigned. The arm is not disclosed
      # in the comment: a reviewer who knows which prompt wrote a summary can't rate it
      # blind, and the whole point of the split is an unbiased read on the two prompts.
      # Evals path: keep the verdict as an artifact rather than posting it. VERDICT is
      # still exported so the Datadog reporting below records a dry run the same way it
      # records a real one.
      - name: Record verdict without submitting
        if: ${{ inputs.dry_run }}
        run: |
          if [ ! -f verdict.json ]; then
            echo "::error::Claude review run did not produce verdict.json" >&2
            exit 1
          fi
          echo "VERDICT=$(jq -r '.verdict' verdict.json)" >> "$GITHUB_ENV"
          echo "Dry run: verdict is $(jq -r '.verdict' verdict.json), not submitting"

      # Uploaded even on failure: a missing or malformed verdict is itself an eval
      # result, and the scorer treats "no verdict" as a failed case rather than a pass.
      - name: Upload verdict for eval scoring
        if: ${{ always() && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: review-verdict-pr${{ inputs.pr }}
          path: verdict.json
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

      - name: Submit review as BiggiePockets
        if: ${{ !inputs.dry_run }}
        id: submit
        env:
          # PAT authenticating as the BiggiePockets service account. A bot cannot
          # approve its own PR, so this never gates BiggiePockets-authored PRs.
          GH_TOKEN: ${{ secrets.BIGGIEPOCKETS_PAT }}
          ASSIGNED_ARM: ${{ steps.resolve.outputs.assigned_arm }}
        run: |
          if [ ! -f verdict.json ]; then
            echo "::error::Claude review run did not produce verdict.json" >&2
            exit 1
          fi

          verdict=$(jq -r '.verdict' verdict.json)
          summary=$(jq -r '.summary' verdict.json)

          printf '## BiggiePockets assisted review\n\n%s\n' "$summary" > review-body.md

          case "$verdict" in
            approve)
              gh pr review "$PR" --approve --body-file review-body.md
              ;;
            request_changes)
              gh pr review "$PR" --request-changes --body-file review-body.md
              ;;
            *)
              echo "::error::Unexpected verdict from $ASSIGNED_ARM arm review: '$verdict'" >&2
              exit 1
              ;;
          esac

          echo "VERDICT=$verdict" >> "$GITHUB_ENV"

      # Reports ONE LLM OBS TRACE per review, tagged with the arm this PR was assigned,
      # and joined by a stable run_id (repo + pr + review attempt) so offline evals and
      # panel ratings line up per review. Never blocks/fails/delays the review itself.
      #
      # `arm`/`prompt_name`/`prompt_version` are payload-level tags, which is where a tag
      # key resolves to one value — one arm per review, so one value each.
      #
      #   root biggiepockets.review -> codex.review, claude.synthesize
      #
      # Compare arms by grouping on `arm` across pull requests (verdict rate, latency,
      # tokens).
      - name: Report review metrics to Datadog LLM Obs
        if: always()
        continue-on-error: true
        env:
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          CODEX_PROMPT_TEMPLATE: ${{ steps.resolve.outputs.codex_prompt_template }}
          ARM_PROMPT_TEMPLATE: ${{ steps.resolve.outputs.arm_prompt_template }}
        run: |
          if [ -z "$DD_API_KEY" ]; then
            echo "Skipping Datadog LLM Obs submission: DATADOG_API_KEY not configured"
            exit 0
          fi

          now_ns=$(date +%s%N)
          review_start_ns="${REVIEW_START_NS:-$now_ns}"
          codex_start_ns="${CODEX_START_NS:-$review_start_ns}"
          codex_end_ns="${CODEX_END_NS:-$codex_start_ns}"
          claude_start_ns="${CLAUDE_START_NS:-$codex_end_ns}"
          claude_end_ns="${CLAUDE_END_NS:-$claude_start_ns}"

          verdict="${VERDICT:-unknown}"
          codex_prompt_name="${{ steps.resolve.outputs.codex_prompt_name }}"
          codex_prompt_version="${{ steps.resolve.outputs.codex_prompt_version }}"
          arm="${{ steps.resolve.outputs.assigned_arm }}"
          arm_prompt_name="${{ steps.resolve.outputs.arm_prompt_name }}"
          arm_prompt_version="${{ steps.resolve.outputs.arm_prompt_version }}"
          control_arm="${{ steps.resolve.outputs.control_arm }}"
          # Which side of the split this review is on, plus the inputs that produced it.
          # Recording the bucket and the split percentage makes an assignment auditable
          # after the fact: a later Apply that changes the split can't silently rewrite
          # what an already-recorded review was assigned under.
          assignment_bucket="${{ steps.resolve.outputs.assignment_bucket }}"
          split_percent="${{ steps.resolve.outputs.experiment_split_percent }}"
          arm_role="control"
          [ "$arm" != "$control_arm" ] && arm_role="experiment"

          codex_status="ok"
          [ "${CODEX_STATUS:-failure}" != "success" ] && codex_status="error"
          codex_findings=$(cat codex-findings.md 2>/dev/null || true)
          codex_findings_lines=$(wc -l < codex-findings.md 2>/dev/null || echo 0)

          claude_status="ok"
          [ "${{ steps.claude.outcome }}" != "success" ] && claude_status="error"

          root_status="ok"
          [ "${{ steps.submit.outcome }}" != "success" ] && root_status="error"

          summary=""
          [ -f verdict.json ] && summary=$(jq -r '.summary // ""' verdict.json 2>/dev/null) || summary=""

          # Cap free-text fields sent to Datadog so one outsized findings report can't
          # blow past the LLM Obs payload limit; the untruncated text is always still in
          # this step's own job logs.
          truncate() {
            local text="$1" max=4000
            if [ "${#text}" -gt "$max" ]; then
              printf '%s… [truncated %d chars]' "${text:0:$max}" "$((${#text} - max))"
            else
              printf '%s' "$text"
            fi
          }
          codex_findings_excerpt=$(truncate "$codex_findings")
          summary_excerpt=$(truncate "$summary")

          # Prompt Tracking: each LLM span carries the registry template that produced it,
          # under meta.input.prompt. The template keeps its {{PR}}/{{PROMPT_NAME}}/
          # {{PROMPT_VERSION}} placeholders and the substituted values ride along as
          # `variables`, so every PR's run lands on the same prompt in Datadog instead of
          # registering a new template per PR. `version` is our content-derived hash, so a
          # prompt edit (a Roll) is what starts a new version.
          prompt_json() { # name version template -> Prompt object
            jq -n \
              --arg name "$1" \
              --arg version "$2" \
              --arg template "$3" \
              --arg pr "$PR" \
              '{
                id: $name,
                name: $name,
                version: $version,
                template: $template,
                # Report only the placeholders this template actually uses, so the
                # variables list matches what a Playground replay needs to render it.
                variables: (
                  {PR: $pr, PROMPT_NAME: $name, PROMPT_VERSION: $version}
                  | with_entries(select(.key as $k | $template | contains("{{" + $k + "}}")))
                )
              }'
          }
          codex_prompt_obj=$(prompt_json "$codex_prompt_name" "$codex_prompt_version" "$CODEX_PROMPT_TEMPLATE")
          arm_prompt_obj=$(prompt_json "$arm_prompt_name" "$arm_prompt_version" "$ARM_PROMPT_TEMPLATE")

          codex_model_tag="${CODEX_MODEL:-unspecified}"
          claude_model_tag="${CLAUDE_MODEL:-unspecified}"

          run_id="$GITHUB_REPOSITORY-pr$PR-${{ github.run_id }}"

          trace_id=$(openssl rand -hex 16)
          root_span_id=$(openssl rand -hex 8)
          codex_span_id=$(openssl rand -hex 8)
          claude_span_id=$(openssl rand -hex 8)

          spans=$(jq -n \
            --arg trace_id "$trace_id" \
            --arg root_span_id "$root_span_id" \
            --arg codex_span_id "$codex_span_id" \
            --arg claude_span_id "$claude_span_id" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg pr "$PR" \
            --arg base_ref "${BASE_REF:-unknown}" \
            --arg codex_model "$codex_model_tag" \
            --arg claude_model "$claude_model_tag" \
            --argjson review_start_ns "$review_start_ns" \
            --argjson root_duration "$((now_ns - review_start_ns))" \
            --argjson codex_start_ns "$codex_start_ns" \
            --argjson codex_duration "$((codex_end_ns - codex_start_ns))" \
            --argjson claude_start_ns "$claude_start_ns" \
            --argjson claude_duration "$((claude_end_ns - claude_start_ns))" \
            --arg codex_status "$codex_status" \
            --arg claude_status "$claude_status" \
            --arg root_status "$root_status" \
            --arg codex_findings_excerpt "$codex_findings_excerpt" \
            --arg summary_excerpt "$summary_excerpt" \
            --argjson codex_prompt "$codex_prompt_obj" \
            --argjson arm_prompt "$arm_prompt_obj" \
            '[
              {
                parent_id: "undefined",
                trace_id: $trace_id,
                span_id: $root_span_id,
                name: "biggiepockets.review",
                start_ns: $review_start_ns,
                duration: $root_duration,
                status: $root_status,
                meta: {
                  kind: "workflow",
                  input: {value: "repo:\($repo) pr:\($pr) base_ref:\($base_ref)"},
                  output: {value: $summary_excerpt}
                }
              },
              {
                parent_id: $root_span_id,
                trace_id: $trace_id,
                span_id: $codex_span_id,
                name: "codex.review",
                start_ns: $codex_start_ns,
                duration: $codex_duration,
                status: $codex_status,
                meta: {
                  kind: "llm",
                  model_name: $codex_model,
                  model_provider: "openrouter",
                  input: {
                    messages: [{role: "user", content: "Review pr:\($pr) against ticket.json/pr.diff"}],
                    prompt: $codex_prompt
                  },
                  output: {messages: [{role: "assistant", content: $codex_findings_excerpt}]}
                }
              },
              {
                parent_id: $root_span_id,
                trace_id: $trace_id,
                span_id: $claude_span_id,
                name: "claude.synthesize",
                start_ns: $claude_start_ns,
                duration: $claude_duration,
                status: $claude_status,
                meta: {
                  kind: "llm",
                  model_name: $claude_model,
                  model_provider: "anthropic",
                  input: {
                    messages: [{role: "user", content: $codex_findings_excerpt}],
                    prompt: $arm_prompt
                  },
                  output: {messages: [{role: "assistant", content: $summary_excerpt}]}
                }
              }
            ]')

          payload=$(jq -n \
            --arg ml_app "biggiepockets-review" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg pr "$PR" \
            --arg run_id "$run_id" \
            --arg verdict "$verdict" \
            --arg arm "$arm" \
            --arg arm_role "$arm_role" \
            --arg prompt_name "$arm_prompt_name" \
            --arg prompt_version "$arm_prompt_version" \
            --arg control_arm "$control_arm" \
            --arg assignment_bucket "$assignment_bucket" \
            --arg split_percent "$split_percent" \
            --arg codex_model "$codex_model_tag" \
            --arg claude_model "$claude_model_tag" \
            --arg codex_prompt_name "$codex_prompt_name" \
            --arg codex_prompt_version "$codex_prompt_version" \
            --argjson codex_findings_lines "$codex_findings_lines" \
            --argjson spans "$spans" \
            '{
              data: {
                type: "span",
                attributes: {
                  ml_app: $ml_app,
                  tags: [
                    "repo:\($repo)",
                    "pr:\($pr)",
                    "run_id:\($run_id)",
                    "arm:\($arm)",
                    "arm_role:\($arm_role)",
                    "prompt_name:\($prompt_name)",
                    "prompt_version:\($prompt_version)",
                    "verdict:\($verdict)",
                    "control_arm:\($control_arm)",
                    "assignment_bucket:\($assignment_bucket)",
                    "experiment_split_percent:\($split_percent)",
                    "codex_model:\($codex_model)",
                    "claude_model:\($claude_model)",
                    "codex_findings_lines:\($codex_findings_lines)",
                    "codex_prompt_name:\($codex_prompt_name)",
                    "codex_prompt_version:\($codex_prompt_version)"
                  ],
                  spans: $spans
                }
              }
            }')

          http_code=$(curl -sS -o /tmp/dd_response.json -w '%{http_code}' \
            -X POST "https://api.datadoghq.com/api/intake/llm-obs/v1/trace/spans" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: $DD_API_KEY" \
            -d "$payload") || http_code="000"

          if [ "$http_code" -ge 300 ] 2>/dev/null || [ "$http_code" = "000" ]; then
            echo "::warning::Datadog LLM Obs submission failed (HTTP $http_code): $(cat /tmp/dd_response.json 2>/dev/null)"
          else
            echo "Reported ${arm} arm to Datadog LLM Obs (trace ${trace_id}, prompt ${arm_prompt_name}@${arm_prompt_version}, run_id ${run_id})"
          fi
