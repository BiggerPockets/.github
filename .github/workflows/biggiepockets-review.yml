  # Stage 3. Weighs the three verdicts and issues the one that gets posted.
  #
  # Runs whenever stage 1 succeeded, even if a seat job failed outright: a seat that
  # never started (no model configured, runner lost) would otherwise skip arbitration and
  # leave the PR with no review at all. Whether a panel short a seat is still a panel is
  # decided by the quorum check below, which says so out loud, rather than by GitHub
  # silently skipping this job.
  arbitrate:
    needs: [context, caspar, balthazar, melchior]
    if: ${{ !cancelled() && needs.context.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write # claude-code-action authenticates via OIDC
    env:
      PR: ${{ inputs.pr }}
      ARBITER_MODEL: ${{ vars.ARBITER_MODEL || 'openai/gpt-5.6-sol' }}
    steps:
      - name: Checkout reviewed PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.head_sha }}
          fetch-depth: 0

      - name: Checkout prompt registry
        uses: actions/checkout@v4
        with:
          repository: BiggerPockets/.github
          ref: ${{ needs.context.outputs.registry_sha }}
          token: ${{ secrets.BIGGIEPOCKETS_PAT }}
          persist-credentials: false
          path: registry

      - name: Download review handoff
        uses: actions/download-artifact@v4
        with:
          name: review-context-${{ github.run_id }}
          path: .

      # Every seat's artifact flattened into the working directory. Filenames carry the
      # seat name, so merging can't collide, and this is the first and only place in the
      # run where more than one auditor's verdict exists together.
      - name: Download panel verdicts
        uses: actions/download-artifact@v4
        with:
          pattern: audit-*-${{ github.run_id }}
          merge-multiple: true
          path: .

      - name: Restore review context
        run: |
          cat review-context.env >> "$GITHUB_ENV"
          for f in audit-*.env; do [ -f "$f" ] && cat "$f" >> "$GITHUB_ENV"; done
          true

      - name: Resolve review prompts
        id: resolve
        env:
          REGISTRY_DIR: registry
        run: registry/scripts/resolve-prompts.sh

      # A panel that lost most of its seats isn't a panel. Arbitrating over one verdict
      # would quietly turn a three-auditor review into a single-reviewer one, so require
      # a majority of seats to have produced a verdict and fail loudly otherwise — the
      # failed audit jobs can then be re-run without repeating stage 1.
      - name: Check panel quorum
        env:
          AUDITOR_COUNT: ${{ steps.resolve.outputs.auditor_count }}
        run: |
          seats=$(ls audit-*.json 2>/dev/null | wc -l | tr -d ' ')
          quorum=$(( AUDITOR_COUNT / 2 + 1 ))
          echo "PANEL_SEATS_REPORTING=$seats" >> "$GITHUB_ENV"
          echo "PANEL_SEATS_DECLARED=$AUDITOR_COUNT" >> "$GITHUB_ENV"
          if [ "$seats" -lt "$quorum" ]; then
            echo "::error::Only $seats of $AUDITOR_COUNT auditors produced a verdict (quorum $quorum); re-run the failed audit jobs." >&2
            exit 1
          fi
          if [ "$seats" -lt "$AUDITOR_COUNT" ]; then
            echo "::warning::Arbitrating over $seats of $AUDITOR_COUNT auditors."
          fi
          for f in audit-*.json; do
            echo "$f -> $(jq -r '.verdict' "$f") (confidence $(jq -r '.confidence // "unstated"' "$f"))"
          done

      - name: Record arbitration start time
        run: echo "ARBITER_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      - name: Arbitrate the panel
        id: arbiter
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          allowed_bots: 'claude'
          claude_args: '--allowedTools "Read,Grep,Glob,Bash,Write" --model ${{ env.ARBITER_MODEL }}'
          prompt: ${{ steps.resolve.outputs.arbiter_prompt }}
        env:
          ANTHROPIC_BASE_URL: "https://openrouter.ai/api"
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Record arbitration end time
        if: always()
        run: echo "ARBITER_END_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      # Summarize how the panel split and whether arbitration went with it. This is the
      # number worth watching: an arbitrator that never departs from the majority is a
      # vote counter, and one that always does is ignoring the panel.
      - name: Summarize panel outcome
        if: always()
        run: |
          # Count with jq, not grep: the verdict is read from the parsed document, so a
          # seat whose JSON is pretty-printed differently still counts.
          approve=0; changes=0; seat_verdicts=""
          for f in audit-*.json; do
            [ -f "$f" ] || continue
            seat="${f#audit-}"; seat="${seat%.json}"
            v=$(jq -r '.verdict' "$f")
            c=$(jq -r '.confidence // "unstated"' "$f")
            case "$v" in
              approve) approve=$((approve + 1)) ;;
              request_changes) changes=$((changes + 1)) ;;
            esac
            seat_verdicts="${seat_verdicts:+$seat_verdicts,}$seat=$v/$c"
          done

          echo "PANEL_APPROVE=$approve" >> "$GITHUB_ENV"
          echo "PANEL_REQUEST_CHANGES=$changes" >> "$GITHUB_ENV"
          # The seat-by-seat record, so a disagreement can be read back from telemetry
          # without opening the run.
          echo "PANEL_SEAT_VERDICTS=${seat_verdicts:-none}" >> "$GITHUB_ENV"

          if [ "$approve" -gt 0 ] && [ "$changes" -gt 0 ]; then
            agreement="split"
          elif [ "$changes" -gt 0 ]; then
            agreement="unanimous_request_changes"
          elif [ "$approve" -gt 0 ]; then
            agreement="unanimous_approve"
          else
            agreement="none"
          fi
          echo "PANEL_AGREEMENT=$agreement" >> "$GITHUB_ENV"
          echo "Panel: $approve approve, $changes request changes ($agreement) — ${seat_verdicts:-none}"

      - name: Submit review as BiggiePockets
        id: submit
        env:
          # PAT authenticating as the BiggiePockets service account. A bot cannot
          # approve its own PR, so this never gates BiggiePockets-authored PRs.
          GH_TOKEN: ${{ secrets.BIGGIEPOCKETS_PAT }}
        run: |
          if [ ! -f verdict.json ]; then
            echo "::error::Arbitration did not produce verdict.json" >&2
            exit 1
          fi

          verdict=$(jq -r '.verdict' verdict.json)
          summary=$(jq -r '.summary' verdict.json)

          # The review body is the arbitrator's summary verbatim — no heading. GitHub
          # already attributes the review to BiggiePockets in its own chrome, so a title
          # restating that just pushes the verdict below the fold.
          printf '%s\n' "$summary" > review-body.md

          case "$verdict" in
            approve)
              gh pr review "$PR" --approve --body-file review-body.md
              ;;
            request_changes)
              gh pr review "$PR" --request-changes --body-file review-body.md
              ;;
            *)
              echo "::error::Unexpected verdict from arbitration: '$verdict'" >&2
              exit 1
              ;;
          esac

          echo "VERDICT=$verdict" >> "$GITHUB_ENV"

          # Whether arbitration followed the panel majority, computed here so the tag
          # reflects the verdict actually posted. A tie has no majority to follow or
          # depart from — which is exactly when the arbitrator is doing the deciding — so
          # record that as its own value rather than scoring it as an override.
          approve="${PANEL_APPROVE:-0}"
          changes="${PANEL_REQUEST_CHANGES:-0}"
          if [ "$changes" -gt "$approve" ]; then
            majority="request_changes"
          elif [ "$approve" -gt "$changes" ]; then
            majority="approve"
          else
            majority="none"
          fi

          if [ "$majority" = "none" ]; then
            followed="no_majority"
          elif [ "$verdict" = "$majority" ]; then
            followed="true"
          else
            followed="false"
          fi
          echo "ARBITER_FOLLOWED_PANEL=$followed" >> "$GITHUB_ENV"
          echo "Panel majority: $majority; arbitrated verdict: $verdict (followed=$followed)"

      # Reports ONE LLM OBS TRACE per review, joined by a stable run_id (repo + pr +
      # review attempt) so offline evals and panel ratings line up per review. Never
      # blocks/fails/delays the review itself.
      #
      #   root biggiepockets.review
      #     ├── magi.audit.<seat>   (one span per auditor)
      #     └── magi.arbitrate
      #
      # The span tree is where a seat's individual verdict lives; the payload tags carry
      # the panel-level outcome (agreement, split, whether arbitration followed the
      # majority), which is what makes "is the panel earning its cost?" a query rather
      # than a manual read of run logs.
      - name: Report review metrics to Datadog LLM Obs
        if: always()
        continue-on-error: true
        env:
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          AUDITOR_PROMPT_TEMPLATE: ${{ steps.resolve.outputs.auditor_prompt_template }}
          ARBITER_PROMPT_TEMPLATE: ${{ steps.resolve.outputs.arbiter_prompt_template }}
          AUDITORS_JSON: ${{ steps.resolve.outputs.auditors }}
        run: |
          if [ -z "$DD_API_KEY" ]; then
            echo "Skipping Datadog LLM Obs submission: DATADOG_API_KEY not configured"
            exit 0
          fi

          now_ns=$(date +%s%N)
          review_start_ns="${REVIEW_START_NS:-$now_ns}"
          context_end_ns="${CONTEXT_END_NS:-$review_start_ns}"
          arbiter_start_ns="${ARBITER_START_NS:-$context_end_ns}"
          arbiter_end_ns="${ARBITER_END_NS:-$arbiter_start_ns}"

          verdict="${VERDICT:-unknown}"
          auditor_prompt_name="${{ steps.resolve.outputs.auditor_prompt_name }}"
          auditor_prompt_version="${{ steps.resolve.outputs.auditor_prompt_version }}"
          arbiter_prompt_name="${{ steps.resolve.outputs.arbiter_prompt_name }}"
          arbiter_prompt_version="${{ steps.resolve.outputs.arbiter_prompt_version }}"

          arbiter_status="ok"
          [ "${{ steps.arbiter.outcome }}" != "success" ] && arbiter_status="error"

          root_status="ok"
          [ "${{ steps.submit.outcome }}" != "success" ] && root_status="error"

          summary=""
          [ -f verdict.json ] && summary=$(jq -r '.summary // ""' verdict.json 2>/dev/null) || summary=""

          # Cap free-text fields sent to Datadog so one outsized summary can't blow past
          # the LLM Obs payload limit; the untruncated text is always still in this step's
          # own job logs.
          truncate() {
            local text="$1" max=4000
            if [ "${#text}" -gt "$max" ]; then
              printf '%s… [truncated %d chars]' "${text:0:$max}" "$((${#text} - max))"
            else
              printf '%s' "$text"
            fi
          }
          summary_excerpt=$(truncate "$summary")

          # Prompt Tracking: each LLM span carries the registry template that produced it,
          # under meta.input.prompt. The template keeps its {{PR}}/{{PROMPT_NAME}}/
          # {{PROMPT_VERSION}}/{{AUDITORS}} placeholders and the substituted values ride
          # along as `variables`, so every PR's run lands on the same prompt in Datadog
          # instead of registering a new template per PR. `version` is our content-derived
          # hash, so a prompt edit (a Roll) is what starts a new version.
          auditor_list=$(printf '%s' "$AUDITORS_JSON" | jq -r 'join(", ")')
          prompt_json() { # name version template -> Prompt object
            jq -n \
              --arg name "$1" \
              --arg version "$2" \
              --arg template "$3" \
              --arg pr "$PR" \
              --arg auditors "$auditor_list" \
              '{
                id: $name,
                name: $name,
                version: $version,
                template: $template,
                # Report only the placeholders this template actually uses, so the
                # variables list matches what a Playground replay needs to render it.
                variables: (
                  {PR: $pr, PROMPT_NAME: $name, PROMPT_VERSION: $version, AUDITORS: $auditors}
                  | with_entries(select(.key as $k | $template | contains("{{" + $k + "}}")))
                )
              }'
          }
          auditor_prompt_obj=$(prompt_json "$auditor_prompt_name" "$auditor_prompt_version" "$AUDITOR_PROMPT_TEMPLATE")
          arbiter_prompt_obj=$(prompt_json "$arbiter_prompt_name" "$arbiter_prompt_version" "$ARBITER_PROMPT_TEMPLATE")

          arbiter_model_tag="${ARBITER_MODEL:-unspecified}"

          run_id="$GITHUB_REPOSITORY-pr$PR-${{ github.run_id }}"

          trace_id=$(openssl rand -hex 16)
          root_span_id=$(openssl rand -hex 8)
          arbiter_span_id=$(openssl rand -hex 8)

          # One span per seat, built from that seat's own recorded verdict and timing, so
          # a disagreement is inspectable per auditor in the trace instead of collapsed
          # into the arbitrated result.
          audit_spans="[]"
          seat_tags="[]"
          for f in audit-*.json; do
            [ -f "$f" ] || continue
            seat="${f#audit-}"; seat="${seat%.json}"
            key=$(printf '%s' "$seat" | tr '[:lower:]-' '[:upper:]_')
            eval "s_start=\${AUDIT_${key}_START_NS:-$context_end_ns}"
            eval "s_end=\${AUDIT_${key}_END_NS:-\$s_start}"
            eval "s_status=\${AUDIT_${key}_STATUS:-error}"
            eval "s_model=\${AUDIT_${key}_MODEL:-unspecified}"
            [ "$s_status" = "ok" ] || s_status="error"
            s_verdict=$(jq -r '.verdict // "unknown"' "$f")
            s_confidence=$(jq -r '.confidence // "unstated"' "$f")
            s_findings=$(jq -r '.blocking_findings // [] | length' "$f")
            s_summary=$(truncate "$(jq -r '.summary // ""' "$f")")

            audit_spans=$(jq -n \
              --argjson spans "$audit_spans" \
              --arg trace_id "$trace_id" \
              --arg parent_id "$root_span_id" \
              --arg span_id "$(openssl rand -hex 8)" \
              --arg seat "$seat" \
              --arg model "$s_model" \
              --arg status "$s_status" \
              --arg summary "$s_summary" \
              --arg pr "$PR" \
              --argjson prompt "$auditor_prompt_obj" \
              --argjson start_ns "$s_start" \
              --argjson duration "$((s_end - s_start))" \
              '$spans + [{
                parent_id: $parent_id,
                trace_id: $trace_id,
                span_id: $span_id,
                name: "magi.audit.\($seat)",
                start_ns: $start_ns,
                duration: $duration,
                status: $status,
                meta: {
                  kind: "llm",
                  model_name: $model,
                  model_provider: "openrouter",
                  input: {
                    messages: [{role: "user", content: "Audit pr:\($pr) independently as \($seat)"}],
                    prompt: $prompt
                  },
                  output: {messages: [{role: "assistant", content: $summary}]}
                }
              }]')

            seat_tags=$(jq -n --argjson t "$seat_tags" \
              --arg seat "$seat" --arg v "$s_verdict" --arg c "$s_confidence" \
              --arg m "$s_model" --arg n "$s_findings" \
              '$t + [
                "auditor_verdict.\($seat):\($v)",
                "auditor_confidence.\($seat):\($c)",
                "auditor_model.\($seat):\($m)",
                "auditor_blocking_findings.\($seat):\($n)"
              ]')
          done

          fixed_spans=$(jq -n \
            --arg trace_id "$trace_id" \
            --arg root_span_id "$root_span_id" \
            --arg arbiter_span_id "$arbiter_span_id" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg pr "$PR" \
            --arg base_ref "${BASE_REF:-unknown}" \
            --arg arbiter_model "$arbiter_model_tag" \
            --argjson review_start_ns "$review_start_ns" \
            --argjson root_duration "$((now_ns - review_start_ns))" \
            --argjson arbiter_start_ns "$arbiter_start_ns" \
            --argjson arbiter_duration "$((arbiter_end_ns - arbiter_start_ns))" \
            --arg arbiter_status "$arbiter_status" \
            --arg root_status "$root_status" \
            --arg summary_excerpt "$summary_excerpt" \
            --arg seat_verdicts "${PANEL_SEAT_VERDICTS:-none}" \
            --argjson arbiter_prompt "$arbiter_prompt_obj" \
            '[
              {
                parent_id: "undefined",
                trace_id: $trace_id,
                span_id: $root_span_id,
                name: "biggiepockets.review",
                start_ns: $review_start_ns,
                duration: $root_duration,
                status: $root_status,
                meta: {
                  kind: "workflow",
                  input: {value: "repo:\($repo) pr:\($pr) base_ref:\($base_ref)"},
                  output: {value: $summary_excerpt}
                }
              },
              {
                parent_id: $root_span_id,
                trace_id: $trace_id,
                span_id: $arbiter_span_id,
                name: "magi.arbitrate",
                start_ns: $arbiter_start_ns,
                duration: $arbiter_duration,
                status: $arbiter_status,
                meta: {
                  kind: "llm",
                  model_name: $arbiter_model,
                  model_provider: "openrouter",
                  input: {
                    messages: [{role: "user", content: "Panel verdicts: \($seat_verdicts)"}],
                    prompt: $arbiter_prompt
                  },
                  output: {messages: [{role: "assistant", content: $summary_excerpt}]}
                }
              }
            ]')

          spans=$(jq -n --argjson fixed "$fixed_spans" --argjson audits "$audit_spans" '$fixed + $audits')

          payload=$(jq -n \
            --arg ml_app "biggiepockets-review" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg pr "$PR" \
            --arg run_id "$run_id" \
            --arg verdict "$verdict" \
            --arg agreement "${PANEL_AGREEMENT:-unknown}" \
            --arg followed "${ARBITER_FOLLOWED_PANEL:-unknown}" \
            --arg approve "${PANEL_APPROVE:-0}" \
            --arg changes "${PANEL_REQUEST_CHANGES:-0}" \
            --arg reporting "${PANEL_SEATS_REPORTING:-0}" \
            --arg declared "${PANEL_SEATS_DECLARED:-0}" \
            --arg auditor_prompt_name "$auditor_prompt_name" \
            --arg auditor_prompt_version "$auditor_prompt_version" \
            --arg arbiter_prompt_name "$arbiter_prompt_name" \
            --arg arbiter_prompt_version "$arbiter_prompt_version" \
            --arg arbiter_model "$arbiter_model_tag" \
            --argjson seat_tags "$seat_tags" \
            --argjson spans "$spans" \
            '{
              data: {
                type: "span",
                attributes: {
                  ml_app: $ml_app,
                  tags: ([
                    "repo:\($repo)",
                    "pr:\($pr)",
                    "run_id:\($run_id)",
                    "verdict:\($verdict)",
                    "panel_agreement:\($agreement)",
                    "arbiter_followed_panel:\($followed)",
                    "panel_approve:\($approve)",
                    "panel_request_changes:\($changes)",
                    "panel_seats_reporting:\($reporting)",
                    "panel_seats_declared:\($declared)",
                    "auditor_prompt_name:\($auditor_prompt_name)",
                    "auditor_prompt_version:\($auditor_prompt_version)",
                    "arbiter_prompt_name:\($arbiter_prompt_name)",
                    "arbiter_prompt_version:\($arbiter_prompt_version)",
                    "arbiter_model:\($arbiter_model)"
                  ] + $seat_tags),
                  spans: $spans
                }
              }
            }')

          http_code=$(curl -sS -o /tmp/dd_response.json -w '%{http_code}' \
            -X POST "https://api.datadoghq.com/api/intake/llm-obs/v1/trace/spans" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: $DD_API_KEY" \
            -d "$payload") || http_code="000"

          if [ "$http_code" -ge 300 ] 2>/dev/null || [ "$http_code" = "000" ]; then
            echo "::warning::Datadog LLM Obs submission failed (HTTP $http_code): $(cat /tmp/dd_response.json 2>/dev/null)"
          else
            echo "Reported panel to Datadog LLM Obs (trace ${trace_id}, agreement ${PANEL_AGREEMENT:-unknown}, verdict ${verdict}, run_id ${run_id})"
          fi
