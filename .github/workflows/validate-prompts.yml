name: Validate prompt registry

# Guard rails for the BiggiePockets review prompt registry (prompts/). Prompt
# versions are derived from content, so this prevents the failure modes that a
# hand-bumped version can't: a broken template, a dangling {{@include}}, a
# registry.json that references a prompt that doesn't exist, a panel that can't be
# fanned out, or a resolver that is not deterministic for a fixed PR number.

on:
  pull_request:
    paths:
      - 'prompts/**'
      - 'scripts/resolve-prompts.sh'
      - '.github/workflows/biggiepockets-review.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      REGISTRY_DIR: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate registry config
        run: |
          jq -e '.version == 3' prompts/registry.json >/dev/null
          jq -e '.codex_prompt == "codex-first-pass"' prompts/registry.json >/dev/null
          for field in codex_prompt auditor_prompt arbiter_prompt; do
            name=$(jq -r --arg f "$field" '.[$f] // empty' prompts/registry.json)
            test -n "$name" || { echo "registry.json missing $field"; exit 1; }
            test -f "prompts/$name.md" || { echo "prompts/$name.md missing for $field"; exit 1; }
          done
          # A one-seat "panel" is a single reviewer wearing a panel's costume: the
          # arbitrator would have nothing to weigh and the extra stage would be pure cost.
          count=$(jq -r '.auditors | length' prompts/registry.json)
          test "$count" -ge 2 || { echo "registry.json declares $count auditor(s); need >= 2"; exit 1; }
          distinct=$(jq -r '.auditors | unique | length' prompts/registry.json)
          test "$count" = "$distinct" || { echo "duplicate auditor seat names"; exit 1; }
          # Seat names become artifact names, file names, and env-var suffixes downstream.
          for seat in $(jq -r '.auditors[]' prompts/registry.json); do
            printf '%s' "$seat" | grep -qE '^[a-z][a-z0-9-]*$' \
              || { echo "auditor seat '$seat' is not lowercase alphanumeric/dashes"; exit 1; }
          done
          echo "registry.json OK ($count auditors)"

      - name: Resolver resolves all prompts for e2e PR
        env:
          PR: '12345'
        run: |
          : > /tmp/o1.txt
          GITHUB_OUTPUT=/tmp/o1.txt scripts/resolve-prompts.sh >/dev/null
          test -s /tmp/o1.txt || { echo "resolver wrote no output" >&2; exit 1; }
          echo "resolve OK"

      - name: Resolver is deterministic for a fixed PR
        env:
          PR: '12345'
        run: |
          : > /tmp/o2.txt
          GITHUB_OUTPUT=/tmp/o2.txt scripts/resolve-prompts.sh >/dev/null
          # The resolver appends, so each run needs a truncated file of its own; two
          # fresh resolves must be byte-identical.
          : > /tmp/o3.txt
          GITHUB_OUTPUT=/tmp/o3.txt scripts/resolve-prompts.sh >/dev/null
          diff /tmp/o2.txt /tmp/o3.txt
          echo "deterministic OK"

      - name: No unresolved template markers
        env:
          PR: '12345'
        run: |
          : > /tmp/o4.txt
          GITHUB_OUTPUT=/tmp/o4.txt scripts/resolve-prompts.sh >/dev/null
          # Assert the resolver actually wrote where we told it to. Without this an
          # unreadable file yields an empty string, and every check below passes on
          # nothing. GITHUB_OUTPUT must be set inline, not in a step `env:` block —
          # the runner overrides that one with its own per-step file.
          test -s /tmp/o4.txt || { echo "resolver wrote no output" >&2; exit 1; }
          # Only the *resolved* prompts must be marker-free. The *_prompt_template
          # outputs keep their {{PR}}/{{PROMPT_NAME}}/{{PROMPT_VERSION}}/{{AUDITORS}}
          # placeholders on purpose — that is the template Datadog Prompt Tracking records.
          for out in codex_prompt auditor_prompt arbiter_prompt; do
            resolved=$(sed -n "/^$out<</,/^_BIGGIEPOCKETS_PROMPT_EOF_$/p" /tmp/o4.txt | sed '1d;$d')
            test -n "$resolved" || { echo "$out resolved to empty text" >&2; exit 1; }
            if printf '%s' "$resolved" | grep -qE '\{\{'; then
              echo "Unresolved template markers remain in $out:" >&2
              printf '%s' "$resolved" | grep -nE '\{\{' >&2
              exit 1
            fi
          done
          echo "no unresolved markers"

      - name: Prompt templates are include-expanded and non-empty
        env:
          PR: '12345'
        run: |
          : > /tmp/o5.txt
          GITHUB_OUTPUT=/tmp/o5.txt scripts/resolve-prompts.sh >/dev/null
          test -s /tmp/o5.txt || { echo "resolver wrote no output" >&2; exit 1; }
          # The *_prompt_template outputs are what Datadog records as the prompt
          # template. They keep {{PR}}-style placeholders, but a shared-rule include
          # must already be expanded — an unexpanded {{@...}} would ship a template
          # that no longer matches the text the model actually saw.
          for out in codex_prompt_template auditor_prompt_template arbiter_prompt_template; do
            tmpl=$(sed -n "/^$out<</,/^_BIGGIEPOCKETS_PROMPT_EOF_$/p" /tmp/o5.txt | sed '1d;$d')
            test -n "$tmpl" || { echo "$out is empty" >&2; exit 1; }
            if printf '%s' "$tmpl" | grep -qE '\{\{@'; then
              echo "Unexpanded include remains in $out:" >&2
              printf '%s' "$tmpl" | grep -nE '\{\{@' >&2
              exit 1
            fi
          done
          echo "templates include-expanded"

      # The whole point of the panel is three INDEPENDENT judgments of the same question.
      # If the resolver ever parameterized the auditor prompt by seat, the seats would be
      # answering subtly different questions and a disagreement would no longer mean the
      # auditors disagreed. Assert the emitted auditor prompt is one fixed text.
      - name: Auditor prompt is identical for every seat
        env:
          PR: '12345'
        run: |
          : > /tmp/o6.txt
          GITHUB_OUTPUT=/tmp/o6.txt scripts/resolve-prompts.sh >/dev/null
          # Exactly one auditor_prompt block is emitted, and it names no individual seat.
          blocks=$(grep -c '^auditor_prompt<<' /tmp/o6.txt)
          test "$blocks" = "1" || { echo "expected 1 auditor_prompt block, got $blocks" >&2; exit 1; }
          prompt=$(sed -n '/^auditor_prompt<</,/^_BIGGIEPOCKETS_PROMPT_EOF_$/p' /tmp/o6.txt | sed '1d;$d')
          for seat in $(jq -r '.auditors[]' prompts/registry.json); do
            if printf '%s' "$prompt" | grep -qi "$seat"; then
              echo "auditor prompt names seat '$seat'; it must be seat-agnostic" >&2
              exit 1
            fi
          done
          echo "auditor prompt is seat-agnostic"

      # The arbitrator has to know which seats to expect, or a seat that failed to
      # produce a verdict reads as an absence rather than a gap.
      - name: Arbitrator prompt names the panel
        env:
          PR: '12345'
        run: |
          : > /tmp/o7.txt
          GITHUB_OUTPUT=/tmp/o7.txt scripts/resolve-prompts.sh >/dev/null
          tmpl=$(sed -n '/^arbiter_prompt_template<</,/^_BIGGIEPOCKETS_PROMPT_EOF_$/p' /tmp/o7.txt | sed '1d;$d')
          printf '%s' "$tmpl" | grep -q '{{AUDITORS}}' \
            || { echo "arbiter prompt template must reference {{AUDITORS}}" >&2; exit 1; }
          resolved=$(sed -n '/^arbiter_prompt<</,/^_BIGGIEPOCKETS_PROMPT_EOF_$/p' /tmp/o7.txt | sed '1d;$d')
          for seat in $(jq -r '.auditors[]' prompts/registry.json); do
            printf '%s' "$resolved" | grep -q "$seat" \
              || { echo "resolved arbiter prompt does not name seat '$seat'" >&2; exit 1; }
          done
          echo "arbiter prompt names every seat"

      # The audit job fans out over this value via fromJSON, so it must be a JSON array
      # of strings — a malformed one fails the matrix at run time, after stage 1 has
      # already been paid for.
      - name: Auditors output is a matrix-ready JSON array
        env:
          PR: '12345'
        run: |
          : > /tmp/o8.txt
          GITHUB_OUTPUT=/tmp/o8.txt scripts/resolve-prompts.sh >/dev/null
          auditors=$(sed -n '/^auditors<</,/^_BIGGIEPOCKETS_PROMPT_EOF_$/p' /tmp/o8.txt | sed '1d;$d')
          printf '%s' "$auditors" | jq -e 'type == "array" and length >= 2 and all(.[]; type == "string")' >/dev/null \
            || { echo "auditors output is not a JSON array of >=2 strings: $auditors" >&2; exit 1; }
          count=$(sed -n '/^auditor_count<</,/^_BIGGIEPOCKETS_PROMPT_EOF_$/p' /tmp/o8.txt | sed '1d;$d')
          test "$count" = "$(printf '%s' "$auditors" | jq 'length')" \
            || { echo "auditor_count ($count) disagrees with auditors array" >&2; exit 1; }
          # Single line, so it survives being interpolated into the matrix expression.
          test "$(printf '%s' "$auditors" | wc -l | tr -d ' ')" = "0" \
            || { echo "auditors output must be compact single-line JSON" >&2; exit 1; }
          echo "auditors matrix-ready ($auditors)"

      - name: Resolver rejects a broken registry
        run: |
          # Each of these misconfigurations would otherwise surface as a confusing
          # mid-review failure (or, for a one-seat panel, as a silently degraded review).
          cp prompts/registry.json /tmp/registry.bak
          restore() { cp /tmp/registry.bak prompts/registry.json; }
          expect_fail() {
            local label="$1"
            if PR=1 GITHUB_OUTPUT=/tmp/reject.txt scripts/resolve-prompts.sh >/dev/null 2>&1; then
              restore; echo "resolver accepted $label" >&2; exit 1
            fi
            restore; echo "rejected: $label"
          }
          jq '.auditor_prompt = "does-not-exist"' /tmp/registry.bak > prompts/registry.json
          expect_fail "auditor_prompt pointing at a missing file"
          jq '.arbiter_prompt = null' /tmp/registry.bak > prompts/registry.json
          expect_fail "a null arbiter_prompt"
          jq '.auditors = ["caspar"]' /tmp/registry.bak > prompts/registry.json
          expect_fail "a one-seat panel"
          jq '.auditors = ["caspar", "caspar", "melchior"]' /tmp/registry.bak > prompts/registry.json
          expect_fail "duplicate seat names"
          jq '.auditors = ["Caspar", "melchior"]' /tmp/registry.bak > prompts/registry.json
          expect_fail "a seat name that is not shell/artifact safe"

      - name: Roll bumps prompt versions (content-derived provenance)
        env:
          PR: '1'
        run: |
          : > /tmp/before.txt
          GITHUB_OUTPUT=/tmp/before.txt scripts/resolve-prompts.sh >/dev/null
          for f in prompts/_shared/*.md; do printf '\n# probe\n' >> "$f"; done
          : > /tmp/after.txt
          GITHUB_OUTPUT=/tmp/after.txt scripts/resolve-prompts.sh >/dev/null
          for f in prompts/_shared/*.md; do git checkout -- "$f"; done
          test -s /tmp/before.txt && test -s /tmp/after.txt \
            || { echo "resolver wrote no output" >&2; exit 1; }
          before=$(sed -n '/^auditor_prompt_version<</,/^_BIGGIEPOCKETS_PROMPT_EOF_$/p' /tmp/before.txt | sed '1d;$d')
          after=$(sed -n '/^auditor_prompt_version<</,/^_BIGGIEPOCKETS_PROMPT_EOF_$/p' /tmp/after.txt | sed '1d;$d')
          if [ "$before" = "$after" ]; then
            echo "editing a shared rule did not bump prompt_version" >&2
            exit 1
          fi
          echo "shared-rule Roll bumps versions ($before -> $after)"
