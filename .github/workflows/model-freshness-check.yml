name: Weekly pi model freshness check

# scripts/pi/models.json pins the OpenRouter list rates Stage 2 (pi) bills against
# and reviews on. Prices move, uptime degrades, and better/cheaper models ship on
# their own schedule, so this runs weekly and opens an issue when any of that has
# drifted: a pinned rate no longer matches OpenRouter's live price, a pinned model
# has dropped out of the catalog or its uptime has slipped below 95%, or a cheaper
# reasoning-capable model with comparable context and healthy uptime has shown up.
# It never edits models.json itself — swapping a review model is a judgment call
# on review quality that no API can make, so this only surfaces what changed for a
# human to act on.
#
# "Cheaper" is judged on an *effective* $/1M rate, not the raw input price: pi's
# review prompts are almost entirely re-sent (cached) context, so OpenRouter's
# prompt-cache discount dominates real cost far more than the list input rate
# does. The effective rate blends a model's input/cacheRead/output rates by the
# actual token mix observed on pi's own review spans in Datadog LLM Observability
# (DD_API_KEY/DD_APP_KEY below), refreshed on every run over a 90-day window so
# the blend tracks usage as it drifts rather than going stale. Without those
# secrets set, the check still runs — it just falls back to the raw input rate.

on:
  schedule:
    - cron: '0 14 * * 1' # every Monday, 14:00 UTC
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check model freshness
        id: check
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: python3 scripts/pi/check_model_freshness.py scripts/pi/models.json > freshness.json

      - name: Commit the price/uptime chart when one was generated
        id: chart
        run: |
          chart_path=$(jq -r '.chart_path // empty' freshness.json)
          if [ -z "$chart_path" ]; then
            echo "No chart generated this run."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$chart_path"
          if git diff --cached --quiet; then
            echo "Chart unchanged."
          else
            git commit -m "Update weekly pi model freshness chart"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "path=$chart_path" >> "$GITHUB_OUTPUT"

      - name: Open an issue when something is notable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_SHA: ${{ steps.chart.outputs.sha }}
          CHART_PATH: ${{ steps.chart.outputs.path }}
        run: |
          notable=$(jq -r '.notable' freshness.json)
          if [ "$notable" != "true" ]; then
            echo "Nothing notable this week."
            exit 0
          fi

          body=$(mktemp)
          {
            echo "Weekly check of \`scripts/pi/models.json\` against OpenRouter's live catalog."
            echo

            if [ -n "$CHART_SHA" ]; then
              echo "![Price vs. context](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${CHART_SHA}/${CHART_PATH})"
              echo
            fi

            missing=$(jq -r '.missing[]?' freshness.json)
            if [ -n "$missing" ]; then
              echo "### Pinned models no longer in OpenRouter's catalog"
              echo
              echo "| Model |"
              echo "| --- |"
              echo "$missing" | sed 's/^/| /; s/$/ |/'
              echo
            fi

            drift_count=$(jq '.drift | length' freshness.json)
            if [ "$drift_count" -gt 0 ]; then
              echo "### Pinned rates that no longer match OpenRouter's list price"
              echo
              echo "| Model | Field | Pinned \$/1M | Live \$/1M |"
              echo "| --- | --- | --- | --- |"
              jq -r '.drift[] | .id as $id | .fields[] | "| \($id) | \(.field) | \(.pinned) | \(.live) |"' freshness.json
              echo
            fi

            unreliable_count=$(jq '.unreliable_pinned | length' freshness.json)
            if [ "$unreliable_count" -gt 0 ]; then
              echo "### Pinned models with degraded uptime (below 95%)"
              echo
              echo "| Model | Uptime (24h) |"
              echo "| --- | --- |"
              jq -r '.unreliable_pinned[] | "| \(.id) | \(.uptime_pct)% |"' freshness.json
              echo
            fi

            candidate_count=$(jq '.candidates | length' freshness.json)
            if [ "$candidate_count" -gt 0 ]; then
              echo "### Cheaper reasoning-capable models (>=100k context, >=95% uptime) than the cheapest pinned model"
              echo
              echo "| Model | Name | \$/1M effective | \$/1M input | Context | Uptime (24h) |"
              echo "| --- | --- | --- | --- | --- | --- |"
              jq -r '.candidates[] | "| \(.id) | \(.name) | \(.effective_rate_per_million) | \(.input_rate_per_million) | \(.context_length) | \(.uptime_pct)% |"' freshness.json
              echo
            fi

            token_mix_present=$(jq -r 'if .token_mix then "true" else "false" end' freshness.json)
            if [ "$token_mix_present" = "true" ]; then
              jq -r '.token_mix | "_Effective $/1M blends each model'"'"'s input/cacheRead/output rates by pi'"'"'s own review token mix over the trailing \(.window | ltrimstr("now-")): \((.fresh_input_share*100)|round)% fresh input, \((.cache_read_share*100)|round)% cache read, \((.output_share*100)|round)% output, from \(.sample_count) sampled review spans._"' freshness.json
            else
              echo "_Effective \$/1M falls back to the raw input rate this run — Datadog credentials weren't available to compute the real token mix._"
            fi
            echo

            echo "This is an automated nudge to look, not a recommendation — review quality still needs a human call before rolling any model in \`scripts/pi/models.json\`."
          } > "$body"

          existing=$(gh issue list --search 'in:title "pi model freshness check" is:open' --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
          else
            gh issue create --title "Weekly pi model freshness check found something" --body-file "$body"
          fi
