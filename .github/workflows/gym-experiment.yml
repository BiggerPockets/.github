name: Gym experiment (first-pass model recall)

# Replays recorded first-pass reviews against ONE model and reports how much of what the
# recorded model found that model still finds.
#
# Why this exists: Stage 1's model is set by an organization variable (vars.FIRST_PASS_MODEL),
# so changing it changes what reaches a human reviewer across every repo at once — and
# nothing in a review notices a model that quietly stops reporting a class of defect. A
# finding that is never written leaves no trace, the run still passes, and Stage 2 verifies
# only what it was handed. The gym dataset holds what a previous model did report, pinned
# to the commit it reviewed; this workflow re-asks those questions.
#
# ONE MODEL PER RUN. The `model` input takes a single OpenRouter slug and planning rejects
# a list. Evaluating a different model is a separate dispatch of this workflow.
#
# Results go to Datadog LLM Observability as one experiment per run (see
# scripts/gym/datadog_experiment.py). Each replay is a span holding the model's review, the
# recorded findings and the judge's scores. Those quote the private code under review, and
# this repository is public, so none of it is printed to a log or uploaded as an artifact
# here. GitHub keeps only the counts.
#
# Each step's logic lives in scripts/gym/steps/, one script per step, taking its inputs
# from the step's `env:`.
#
# Cost: roughly $0.02 per replay on a cheap model and $0.17 on an expensive one, plus a
# judge call per replay. The full dataset is ~97 jobs. Start with limit=3.

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'The one OpenRouter model slug to evaluate (e.g. openai/gpt-5.6-luna).'
        required: true
      dataset:
        description: 'Path within BiggerPockets/pi-gym-data to the dataset file. Its dataset.name names the Datadog dataset.'
        required: false
        default: 'gym/sol-first-pass-findings.yaml'
      limit:
        description: 'Replay only the first N records. Leave empty for the whole dataset.'
        required: false
        default: '3'
      severity:
        description: 'Restrict to these severities (e.g. blocker,blocking). Empty = all.'
        required: false
        default: ''
      record_ids:
        description: 'Comma-separated record ids to replay instead of the whole dataset (e.g. to re-run ones that timed out). Empty = all.'
        required: false
        default: ''
      judge_model:
        description: 'Model that scores the replays. Must not be the model under evaluation.'
        required: false
        default: 'anthropic/claude-haiku-4.5'
      match_prompt_version:
        description: 'Only replay records recorded under the current first-pass prompt.'
        required: false
        default: 'true'
      datadog_project:
        description: 'Datadog LLM Obs project the experiment is recorded in'
        required: false
        default: 'biggiepockets-review-gym'
      max_parallel:
        description: 'Concurrent replays. OpenRouter reserves credit per in-flight request, so too many return 402.'
        required: false
        default: '3'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      experiment_id: ${{ steps.experiment.outputs.experiment_id }}
      project_id: ${{ steps.experiment.outputs.project_id }}
      dataset_id: ${{ steps.experiment.outputs.dataset_id }}
    env:
      DATASET_FILE: gym-data/${{ inputs.dataset }}
      MODEL: ${{ inputs.model }}
      JUDGE_MODEL: ${{ inputs.judge_model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/gym/requirements.txt

      # These secrets live on this PUBLIC repository, so GYM_REPO_TOKEN is deliberately not
      # the review service account's BIGGIEPOCKETS_PAT, which can write. It is a fine-grained
      # PAT with read-only Contents and Pull requests on the repositories the dataset points
      # at, plus read-only Contents on BiggerPockets/pi-gym-data. A leak of it cannot write.
      - name: Check required secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GYM_REPO_TOKEN: ${{ secrets.GYM_REPO_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: >-
          scripts/gym/steps/check-secrets.sh
          OPENROUTER_API_KEY GYM_REPO_TOKEN JIRA_EMAIL JIRA_API_TOKEN DD_API_KEY DD_APP_KEY

      - name: Resolve the current first-pass prompt version
        id: prompt
        env:
          REGISTRY_DIR: .
          PR: '0'
        run: scripts/resolve-prompts.sh

      # The dataset is private-repo-derived content and must never land in this public
      # repository, so it is checked out read-only from BiggerPockets/pi-gym-data.
      - name: Checkout gym dataset (BiggerPockets/pi-gym-data)
        uses: actions/checkout@v4
        with:
          repository: BiggerPockets/pi-gym-data
          token: ${{ secrets.GYM_REPO_TOKEN }}
          persist-credentials: false
          path: gym-data

      # A record's findings were produced by a specific first-pass prompt. Replaying it
      # under a changed prompt measures the prompt edit and the model together and reports
      # the sum as the model, so by default the run is scoped to records the current prompt
      # produced.
      - name: Plan the replays
        id: plan
        env:
          LIMIT: ${{ inputs.limit }}
          SEVERITY: ${{ inputs.severity }}
          RECORD_IDS: ${{ inputs.record_ids }}
          PROMPT_VERSION: ${{ inputs.match_prompt_version != 'false' && steps.prompt.outputs.first_pass_prompt_version || '' }}
        run: scripts/gym/steps/plan.sh

      - name: Create the Datadog experiment
        id: experiment
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DATADOG_PROJECT: ${{ inputs.datadog_project }}
          PROMPT_VERSION: ${{ steps.prompt.outputs.first_pass_prompt_version }}
        run: scripts/gym/steps/create-experiment.sh

  replay:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # OpenRouter reserves credit against every in-flight request, so concurrency is
      # bounded by the account balance, not throughput: 8 large-context replays at once
      # returned "402 Payment Required" on well over half the jobs, and a 402 loses the
      # replay rather than queueing it. The key is shared organization-wide, so a wide run
      # can also starve production reviews of credit.
      max-parallel: ${{ fromJSON(inputs.max_parallel || '3') }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.label }} · ${{ matrix.record }}
    env:
      RECORD: ${{ matrix.record }}
      LABEL: ${{ matrix.label }}
      MODEL: ${{ matrix.model }}
      DATASET_FILE: gym-data/${{ inputs.dataset }}
      REPLAY_DIR: ${{ github.workspace }}/replay
      OUT_DIR: ${{ github.workspace }}/out
    steps:
      - name: Checkout registry (prompts + scripts)
        uses: actions/checkout@v4
        with:
          path: registry

      - name: Checkout gym dataset (BiggerPockets/pi-gym-data)
        uses: actions/checkout@v4
        with:
          repository: BiggerPockets/pi-gym-data
          token: ${{ secrets.GYM_REPO_TOKEN }}
          persist-credentials: false
          path: gym-data

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r registry/scripts/gym/requirements.txt

      - name: Resolve ticket key
        id: ticket
        env:
          GH_TOKEN: ${{ secrets.GYM_REPO_TOKEN }}
          REPO: ${{ matrix.repo }}
          PR: ${{ matrix.pr }}
        run: registry/scripts/gym/steps/resolve-ticket.sh

      # The repo at the reviewed commit, the merge-base diff, the ticket, and the
      # conversation as of the review. See scripts/gym/replay_context.py.
      - name: Rebuild replay context
        env:
          GH_TOKEN: ${{ secrets.GYM_REPO_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET_KEY: ${{ steps.ticket.outputs.key }}
        run: >-
          python3 registry/scripts/gym/replay_context.py
          --record "$RECORD" --dataset "$DATASET_FILE" --workdir "$REPLAY_DIR"
          --ticket-key "$TICKET_KEY"

      # resolve-prompts.sh substitutes {{PR}} into the prompt, so it is given the record's
      # own pull request; otherwise the replayed prompt is not the one the review ran.
      - name: Resolve review prompts
        id: resolve
        env:
          REGISTRY_DIR: registry
          PR: ${{ matrix.pr }}
          GITHUB_REPOSITORY: ${{ matrix.repo }}
        run: registry/scripts/resolve-prompts.sh

      - name: Install pi
        run: registry/scripts/gym/steps/install-pi.sh

      - name: Configure pi
        run: registry/scripts/gym/steps/configure-pi.sh

      - name: Replay first-pass review
        id: replay
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FIRST_PASS_PROMPT: ${{ steps.resolve.outputs.first_pass_prompt }}
        run: registry/scripts/gym/steps/replay.sh

      - name: Mark the replay failed
        if: steps.replay.outcome == 'failure'
        run: mkdir -p "$OUT_DIR" && echo "$RECORD" > "$OUT_DIR/FAILED"

      - name: Attribute the replay to OpenRouter endpoints
        if: always()
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: registry/scripts/gym/steps/attribute.sh

      # Judged only when the replay succeeded: scoring a crashed checkout as a model miss
      # would blame the model for the harness.
      - name: Judge the replay
        if: steps.replay.outcome == 'success'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
          SEVERITY: ${{ matrix.severity }}
        run: registry/scripts/gym/steps/judge.sh

      - name: Record the replay in the Datadog experiment
        if: always()
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          EXPERIMENT_ID: ${{ needs.plan.outputs.experiment_id }}
          PROJECT_ID: ${{ needs.plan.outputs.project_id }}
          DATASET_ID: ${{ needs.plan.outputs.dataset_id }}
        run: registry/scripts/gym/steps/record-replay.sh

      - name: Upload counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gym-${{ matrix.label }}--${{ matrix.record }}
          if-no-files-found: ignore
          retention-days: 14
          path: out/

  report:
    needs: [plan, replay]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    env:
      EXPERIMENT_ID: ${{ needs.plan.outputs.experiment_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/gym/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: gym-*
          path: results
          merge-multiple: false

      - name: Summarize
        env:
          DATADOG_PROJECT: ${{ inputs.datadog_project }}
        run: scripts/gym/steps/summarize.sh

      - name: Close the Datadog experiment
        if: always()
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          REPLAY_RESULT: ${{ needs.replay.result }}
        run: scripts/gym/steps/finish-experiment.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gym-summary
          retention-days: 90
          path: |
            summary.md
            summary.json
